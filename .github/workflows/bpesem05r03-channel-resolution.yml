name: B-PE-SEM-05R-03 channel resolution
# rerun-after-offline-breaker-fix

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - ".github/workflows/bpesem05r03-channel-resolution.yml"

permissions:
  contents: write

jobs:
  channel-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: integration/system-v1
          fetch-depth: 0

      - name: Assert offline resolution implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          forbidden={"requests","urllib","http","socket","aiohttp","ftplib","smtplib"}
          for name in [
              "tools/bpesem05r03_materialize_channel_resolution.py",
              "breakers/bpesem05r03_channel_resolution_breaker.py",
          ]:
              tree=ast.parse(Path(name).read_text(encoding="utf-8"))
              bad=[]
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      for a in node.names:
                          if a.name.split(".")[0] in forbidden:
                              bad.append((node.lineno,a.name))
                  elif isinstance(node,ast.ImportFrom):
                      root=(node.module or "").split(".")[0]
                      if root in forbidden:
                          bad.append((node.lineno,node.module))
              assert not bad,(name,bad)
          print("OFFLINE_CHANNEL_RESOLUTION_PASS")
          PY

      - name: Materialize Stage R candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bpesem05r03_materialize_channel_resolution.py | tee /tmp/bpesem05r03-candidate.json
          test -f evidence/bpesem05r03/channel_resolution_decision_v0_1.json
          test -f reports/data-qualification/bpesem05r03_channel_resolution_candidate_2026-09-22.md

      - name: Persist Stage R candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/bpesem05r03 reports/data-qualification/bpesem05r03_channel_resolution_candidate_2026-09-22.md
          git commit -m "evidence: materialize B-PE-SEM-05R-03 channel resolution candidate"
          git push origin HEAD:integration/system-v1
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Break persisted Stage R candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          python3 breakers/bpesem05r03_channel_resolution_breaker.py | tee /tmp/bpesem05r03-break.json
          test -f reports/data-qualification/bpesem05r03_channel_resolution_adversarial_break_2026-09-22.md

      - name: Persist adversarial break report
        shell: bash
        run: |
          set -euo pipefail
          git add reports/data-qualification/bpesem05r03_channel_resolution_adversarial_break_2026-09-22.md
          git commit -m "audit: break B-PE-SEM-05R-03 channel resolution candidate"
          git push origin HEAD:integration/system-v1
