name: Trading Breaks Recovery Batch 05 Persisted-HEAD Rebreak

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persisted-head-rebreak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering persisted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove authoritative Batch 05 integration commit is persisted ancestor
        run: git merge-base --is-ancestor 99c2f38842a0c4ea66ba6ff90496380986d02e52 HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest==8.4.2

      - name: Adversarially re-break persisted Batch 05 integration state
        run: |
          python -m pytest -q \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_dukascopy_usatech_calendar_2022_batch02.py \
            tests/test_dukascopy_usatech_calendar_2022_batch03.py \
            tests/test_dukascopy_usatech_calendar_2022_batch04.py \
            tests/test_dukascopy_usatech_calendar_2023_batch05.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_batch01.py \
            tests/test_trading_breaks_recovery_batch02.py \
            tests/test_trading_breaks_recovery_batch03.py \
            tests/test_trading_breaks_recovery_batch03_adjudication.py \
            tests/test_trading_breaks_recovery_batch03_integration.py \
            tests/test_trading_breaks_recovery_batch04.py \
            tests/test_trading_breaks_recovery_batch04_adjudication.py \
            tests/test_trading_breaks_recovery_batch04_integration.py \
            tests/test_trading_breaks_recovery_batch05.py \
            tests/test_trading_breaks_recovery_batch05_adjudication.py \
            tests/test_trading_breaks_recovery_batch05_integration_contract.py \
            tests/test_trading_breaks_recovery_batch05_integration.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Assert exact persisted calendar ledger and progression state
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from tools.dukascopy_usatech_calendar import SPECIAL_SESSION_EVIDENCE
          from tools.dukascopy_usatech_calendar_coverage import audit_calendar_coverage
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue, load_attempt_ledger, load_material_capability_changes, progression_decisions
          from tools.trading_breaks_recovery_protocol import recovery_queue

          global_report = audit_calendar_coverage()
          window = audit_calendar_coverage(date(2021, 8, 14), date(2026, 8, 14))
          _, _, attempts = load_attempt_ledger()
          progression = json.load(open('reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json', encoding='utf-8'))
          raw_days = {d for d, _ in recovery_queue()}
          eligible = eligible_recovery_queue()
          eligible_days = {d for d, _ in eligible}
          decisions = {d.target_date: d for d in progression_decisions()}

          assert (global_report['candidate_dates'], global_report['resolved_candidate_dates'], global_report['unresolved_candidate_dates']) == (111, 42, 69)
          assert global_report['evidence_shape_errors'] == []
          assert global_report['orphan_special_evidence'] == []
          assert global_report['contradictory_evidence_dates'] == []
          assert (window['candidate_dates'], window['resolved_candidate_dates'], window['unresolved_candidate_dates']) == (68, 19, 49)
          assert len(attempts) == 25
          assert [x.attempt_sequence for x in attempts] == list(range(1, 26))
          batch05 = [x for x in attempts if x.attempt_id.startswith('batch05:')]
          assert [x.attempt_sequence for x in batch05] == [21, 22, 23, 24, 25]
          assert [x.outcome for x in batch05] == ['PASS'] * 5
          assert all(x.blocking_reason is None for x in batch05)
          assert load_material_capability_changes() == []
          assert len(recovery_queue()) == 49
          assert progression['verdict'] == 'PASS'
          assert progression['calendar_unresolved_count'] == 49
          assert progression['attempt_ledger_count'] == 25
          assert progression['registered_material_capability_change_count'] == 0
          assert progression['attempted_blocked_ineligible_count'] == 6
          assert progression['eligible_initial_or_retry_count'] == 43
          assert progression['current_capability_id'] == 'TRADING_BREAKS_PRIMARY_WIDGET_V1'
          assert progression['current_capability_fingerprint'] == '82238de6e862e2b31e7a8f4e5faa3f822545ba46251703b06180087a957aaf8f'

          pass_days = {date(2023, 1, 16), date(2023, 2, 20), date(2023, 4, 7), date(2023, 5, 29), date(2023, 6, 19)}
          blocked_days = {date(2021, 12, 24), date(2021, 12, 31), date(2022, 4, 15), date(2022, 7, 1), date(2022, 12, 26), date(2023, 1, 2)}
          assert pass_days <= set(SPECIAL_SESSION_EVIDENCE)
          assert pass_days.isdisjoint(raw_days)
          assert pass_days.isdisjoint(eligible_days)
          assert blocked_days <= raw_days
          assert blocked_days.isdisjoint(eligible_days)
          for day in blocked_days:
              assert decisions[day].reason == 'SAME_CAPABILITY_BLOCKED_ALREADY_ATTEMPTED'
              assert decisions[day].latest_attempt_outcome == 'BLOCKED'
              assert decisions[day].contract_verdict == 'PASS'
          assert eligible[0] == (date(2023, 7, 3), 'INDEPENDENCE_PRE_HOLIDAY_SESSION')
          print('PASS: persisted HEAD proves Batch 05 atomic integration; 49 unresolved / 25 attempts / 6 blocked-ineligible / 43 eligible')
          PY

      - name: Prove re-break contains no browser or capture path
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/trading-breaks-recovery-batch05-persisted-head.yml').read_text(encoding='utf-8').lower()
          forbidden_tokens = [
              ''.join(('play', 'wright')),
              ''.join(('chro', 'mium')),
              ''.join(('probe_', 'candidate')),
          ]
          for forbidden in forbidden_tokens:
              assert forbidden not in source
          PY

      - name: Prove persisted re-break is read-only and deterministic
        run: |
          python -m tools.trading_breaks_recovery_progression >/dev/null
          git diff --exit-code
