name: Synthetic foreign identity test

on:
  push:
    branches:
      - feat/synthetic-execution-evidence
  workflow_dispatch:

jobs:
  synthetic-foreign-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run foreign identity tests
        run: python -m pytest tests/test_synthetic_foreign_identity_links.py -q
