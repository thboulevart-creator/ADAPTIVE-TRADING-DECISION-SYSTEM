name: A0 Minimal Implementation Candidate

on:
  push:
    branches:
      - sandbox/a0-minimal-implementation-candidate
    paths:
      - src/a0_research_authority.py
      - .github/workflows/a0-minimal-implementation-candidate.yml

permissions:
  contents: read

jobs:
  qualify-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile implementation and persisted breaker
        run: |
          python -m py_compile src/a0_research_authority.py
          python -m py_compile breakers/a0_research_authority_red_breaker.py

      - name: Verify persisted breaker identity
        run: |
          test "$(git hash-object breakers/a0_research_authority_red_breaker.py)" = "e02ecfa6d30c2877a33f5c5d81b161ee562202b6"

      - name: Run exact persisted A0 RED breaker
        run: python -m pytest -q breakers/a0_research_authority_red_breaker.py
