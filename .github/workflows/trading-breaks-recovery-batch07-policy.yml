name: Trading Breaks Recovery Batch 07 Policy Qualification

on:
  push:
    branches:
      - feat/multi-year-dukascopy-acquisition
    paths:
      - '.github/workflows/trading-breaks-recovery-batch07-policy.yml'
      - 'tools/trading_breaks_recovery_batch07.py'
      - 'tests/test_trading_breaks_recovery_batch07.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch07-policy-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering persisted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove post-Batch06 freeze baseline ancestry and governed-state immutability
        run: |
          git merge-base --is-ancestor 16c6288158985bb3ad68360401b6bdae60687e15 HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          git diff --exit-code 16c6288158985bb3ad68360401b6bdae60687e15 HEAD -- \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            tools/trading_breaks_recovery_progression.py \
            tools/trading_breaks_recovery_protocol.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest only
        run: python -m pip install pytest==8.4.2

      - name: Adversarially break Batch 07 membership and parent boundaries
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch07.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_batch06.py \
            tests/test_trading_breaks_recovery_batch06_integration.py \
            tests/test_dukascopy_usatech_calendar_2023_batch06.py \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Assert exact mechanically frozen Batch 07 membership
        run: |
          python - <<'PY'
          from datetime import date
          from tools.trading_breaks_recovery_batch07 import BATCH_SIZE, batch07_targets
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue

          expected = [
              (date(2023, 12, 22), 'CHRISTMAS_PRE_HOLIDAY_SESSION'),
              (date(2023, 12, 25), 'CHRISTMAS_OBSERVED'),
              (date(2024, 1, 1), 'NEW_YEARS_OBSERVED'),
              (date(2024, 1, 15), 'MARTIN_LUTHER_KING_DAY'),
              (date(2024, 2, 19), 'PRESIDENTS_DAY'),
          ]
          eligible = eligible_recovery_queue()
          assert BATCH_SIZE == 5
          assert eligible[:5] == expected
          assert batch07_targets() == eligible[:5]
          print('PASS: Batch 07 membership equals governed post-Batch06 eligible_recovery_queue()[:5] at freeze')
          for day, reason in expected:
              print(day.isoformat(), reason)
          PY

      - name: Prove Batch 07 freeze contains no browser probe or live-selection path
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('tools/trading_breaks_recovery_batch07.py').read_text(encoding='utf-8').lower()
          forbidden_tokens = [
              ''.join(('play', 'wright')),
              ''.join(('chro', 'mium')),
              ''.join(('probe_', 'candidate')),
              'asyncio',
              'eligible_recovery_queue(',
              'recovery_queue(',
          ]
          for forbidden in forbidden_tokens:
              assert forbidden not in source, forbidden
          print('PASS: Batch 07 freeze is membership-only; no browser/probe/live-selection path exists')
          PY

      - name: Prove qualification is read-only
        run: git diff --exit-code
