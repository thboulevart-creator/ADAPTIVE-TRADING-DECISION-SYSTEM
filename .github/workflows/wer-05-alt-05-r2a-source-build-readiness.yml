name: WER-05-ALT-05-R2A Windows Source-Only Build Readiness Candidate

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/wer-05-alt-05-r2a-source-build-readiness.yml'

permissions:
  contents: read

concurrency:
  group: wer-05-alt-05-r2a-one-shot-build-readiness
  cancel-in-progress: false

jobs:
  source-build-readiness:
    if: ${{ github.event.head_commit.message == 'WER-05-ALT-05-R2A-V0.1 ONE-SHOT SOURCE-ONLY BUILD PREFLIGHT' }}
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout authorized SHA without persisted credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false
          fetch-depth: 1
      - name: Compile-only static source qualification (no program execution)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'RETRY_FORBIDDEN' }
          if ($env:GITHUB_REF -ne 'refs/heads/integration/system-v1') { throw 'BRANCH_MISMATCH' }
          $os = Get-CimInstance Win32_OperatingSystem
          if ($os.BuildNumber -ne '26100') { throw 'OS_BUILD_MISMATCH' }
          $src = Join-Path $env:GITHUB_WORKSPACE 'tools/wer05_alt05_r2a'
          $expected = @{
            'NATIVE_PROBE_V0.1.c' = '0331cea835288b6911f908e88c41a2983bf4cda97b5be574bfdab1686162dd31'
            'INERT_WORKER_V0.1.c' = '04a5a8db1f11312bf9cb96db367309b05f5e8dd261135a7b4b2764b431d42038'
            'KERNEL32_IMPORTS.def' = '03a6364144b80dfffc328011d2576bc5e228f9feffe4adc8c8f016cf1e783fd4'
          }
          foreach ($name in $expected.Keys) {
            $file = Join-Path $src $name
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw 'SOURCE_MISSING' }
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[$name]) { throw 'SOURCE_HASH_MISMATCH' }
          }
          $clang = Get-Command clang.exe -ErrorAction Stop
          $link = Get-Command lld-link.exe -ErrorAction Stop
          $llvmVersion = ((& $clang.Source --version | Select-Object -First 1) -join '')
          $linkVersion = ((& $link.Source --version | Select-Object -First 1) -join '')
          $tmp = Join-Path $env:RUNNER_TEMP 'ALT05_R2A_COMPILE_ONLY'
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Push-Location $tmp
          try {
            $def = '/def:' + (Join-Path $src 'KERNEL32_IMPORTS.def')
            & $link.Source /dll /noentry /machine:x64 $def /implib:KERNEL32.lib /Brepro 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'IMPORT_LIBRARY_LINK_FAILED' }
            & $clang.Source --target=x86_64-pc-windows-msvc -c -O2 -ffreestanding -fno-builtin -fno-stack-protector -Wall -Wextra (Join-Path $src 'NATIVE_PROBE_V0.1.c') -o native.obj 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'NATIVE_COMPILATION_FAILED' }
            & $link.Source /out:ATDS_ALT05_NATIVE_PROBE_V0.1.exe /subsystem:console /entry:mainCRTStartup /nodefaultlib /machine:x64 /fixed /Brepro native.obj KERNEL32.lib 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'NATIVE_LINK_FAILED' }
            & $clang.Source --target=x86_64-pc-windows-msvc -c -O2 -ffreestanding -fno-builtin -fno-stack-protector -Wall -Wextra (Join-Path $src 'INERT_WORKER_V0.1.c') -o inert.obj 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'WORKER_COMPILATION_FAILED' }
            & $link.Source /out:ATDS_ALT05_INERT_WORKER_V0.1.exe /subsystem:console /entry:mainCRTStartup /nodefaultlib /machine:x64 /fixed /Brepro inert.obj 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'WORKER_LINK_FAILED' }
            $result = [ordered]@{
              schema = 'ATDS_WER05_ALT05_R2A_SOURCE_BUILD_CANDIDATE_V0_1'
              verdict = 'SOURCE_COMPILE_ONLY_PASS_NOT_NATIVE_QUALIFICATION'
              run_id = $env:GITHUB_RUN_ID
              commit = $env:GITHUB_SHA
              observed_utc = (Get-Date).ToUniversalTime().ToString('o')
              image_version = $env:ImageVersion
              llvm_version = $llvmVersion
              linker_version = $linkVersion
              compiled_probe_sha256 = (Get-FileHash '.\ATDS_ALT05_NATIVE_PROBE_V0.1.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
              compiled_inert_sha256 = (Get-FileHash '.\ATDS_ALT05_INERT_WORKER_V0.1.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
              compiled_but_not_executed = $true
              etw_session_started = $false
              job_object_created = $false
              experimental_worker_executed = $false
            }
            $result | ConvertTo-Json -Compress -Depth 3 | Write-Output
            'ALT05 R2A: source-only compile passed; no native binaries executed.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } finally {
            Pop-Location
          }
