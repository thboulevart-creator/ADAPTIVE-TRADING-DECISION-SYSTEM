name: P1.16 Temporary Tier-A Final Re-break Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/p1-16-tier-a-final-rebreak-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  P0_6_BASE: '8061127c148f06454dac6e7977a8d0cb921276f8'
  GOVERNED_HEAD: '1d4c2f3d657b36ecaa6ab25b967e46b3620190d1'
  GOVERNED_TREE: 'bff033bf559d1e61995052be3876d20f0c47223d'
  P116_BREAKER_BLOB: 'afbb1442f5c2335e2bcaedb7f65f6ecb9249910a'
  P116_RUNTIME_BLOB: 'a5c6b820df5ea5e89fd61c84feb42cb42e923a5f'
  P116_WORKFLOW_BLOB: '7feaf435efe72d77bf7a0a87b710fd9cf87f929f'

jobs:
  tier-a-final-rebreak:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact governed ATDS HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.GOVERNED_HEAD }}
          fetch-depth: 0

      - name: Prove exact governed HEAD, TREE, and closed P0.6 ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$GOVERNED_HEAD"
          test "$(git show -s --format=%T HEAD)" = "$GOVERNED_TREE"
          git merge-base --is-ancestor "$P0_6_BASE" HEAD

      - name: Prove exact P1.16 identities
        run: |
          test "$(git hash-object breakers/p1_16_qualified_experimental_finding_breaker.py)" = "$P116_BREAKER_BLOB"
          test "$(git hash-object src/qualified_experimental_finding.py)" = "$P116_RUNTIME_BLOB"
          test "$(git hash-object .github/workflows/p1-16-qualified-experimental-finding.yml)" = "$P116_WORKFLOW_BLOB"
          grep -Fq 'P1_16_QUALIFIED_EXPERIMENTAL_FINDING_INTERPRETATION_BOUNDARY_V1' GOVERNANCE/STEP-3-REAL-SYSTEM-MAPPING.md
          grep -Fq 'P1.16 MINIMAL MODEL: SELECTED' GOVERNANCE/STEP-3-REAL-SYSTEM-MAPPING.md
          grep -Fq 'P1_16_FINDING_INTERPRETATION_POLICY_V1' GOVERNANCE/STEP-3-REAL-SYSTEM-MAPPING.md

      - name: Setup exact qualification Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact P0.6 qualification environment
        run: python tools/qualification_environment.py verify

      - name: Re-break protected RESEARCH to DECISION boundary
        run: python -m pytest -q tests/test_research_to_decision_boundary.py

      - name: Re-break protected P1.2 ACTION to RESULT boundary
        run: python -m pytest -q tests/test_action_result_evidence_tier_a.py tests/test_action_result_evidence_exact_provenance.py

      - name: Re-break protected P1.3 RESULT to TRACE boundary
        run: python -m pytest -q tests/test_result_trace_evidence_tier_a.py tests/test_result_trace_evidence_exact_provenance.py

      - name: Re-break protected P1.4 TRACE to MEMORY episode boundary
        run: python -m pytest -q tests/test_memory_episode_tier_a.py tests/test_memory_episode_exact_provenance.py

      - name: Re-break protected P1.5 durable MEMORY boundary
        run: python -m pytest -q breakers/p1_5_external_receipt_pin_breaker.py breakers/p1_5_external_receipt_pin_second_breaker.py

      - name: Re-break protected P1.6 MEMORY to AUDIT boundary
        run: python -m pytest -q breakers/p1_6_memory_collection_audit_breaker.py breakers/p1_6_memory_collection_audit_second_breaker.py

      - name: Re-break protected P1.7 AUDIT to REVISION boundary
        run: python -m pytest -q breakers/p1_7_audit_revision_breaker.py breakers/p1_7_audit_revision_second_breaker.py

      - name: Re-break protected P1.8 REVISION to FOLLOW-UP REQUEST boundary
        run: python -m pytest -q breakers/p1_8_revision_followup_request_breaker.py breakers/p1_8_revision_followup_request_second_breaker.py

      - name: Re-break protected P1.9A and P1.9B boundaries
        run: python -m pytest -q breakers/p1_9a_evidence_submission_breaker.py breakers/p1_9b_experiment_specification_breaker.py

      - name: Re-break protected P1.10A and P1.10B boundaries
        run: python -m pytest -q breakers/p1_10a_evidence_material_binding_breaker.py breakers/p1_10b_experiment_execution_binding_breaker.py

      - name: Re-break protected P1.11A and P1.11B boundaries
        run: python -m pytest -q breakers/p1_11a_evidence_assessment_criteria_breaker.py breakers/p1_11b_qualified_experiment_execution_input_breaker.py

      - name: Re-break protected P1.12A and P1.12B boundaries
        run: python -m pytest -q breakers/p1_12a_declared_evidence_criteria_assessment_breaker.py breakers/p1_12b_linked_experiment_execution_breaker.py

      - name: Re-break protected P1.13A and P1.13B boundaries
        run: python -m pytest -q breakers/p1_13a_evidence_semantic_completeness_review_breaker.py breakers/p1_13b_experiment_evaluation_submission_breaker.py

      - name: Re-break protected P1.14A and P1.14B boundaries
        run: python -m pytest -q breakers/p1_14a_reviewer_method_authority_breaker.py breakers/p1_14b_measurement_provenance_breaker.py

      - name: Re-break protected P1.15A and P1.15B boundaries
        run: python -m pytest -q breakers/p1_15a_evidence_request_fulfillment_breaker.py breakers/p1_15b_experiment_evaluator_authority_breaker.py

      - name: Re-break P1.16 persisted governed state
        run: python -m pytest -q breakers/p1_16_qualified_experimental_finding_breaker.py

      - name: Prove clean governed checkout
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
