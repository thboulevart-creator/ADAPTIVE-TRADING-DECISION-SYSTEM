name: C01 R3 Persisted Head Rebreak

on:
  push:
    branches:
      - sandbox/c01-r3-persisted-head-rebreak
    paths:
      - .github/workflows/c01-r3-persisted-head-rebreak.yml

permissions:
  contents: read

jobs:
  rebreak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed HEAD
        uses: actions/checkout@v4
        with:
          ref: a2f70840fb9adfae02078de810dbe4d965787e1e
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify exact persisted HEAD and correction scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a2f70840fb9adfae02078de810dbe4d965787e1e"
          python - <<'PY'
          import subprocess
          expected = {
              "04-REFERENCE/RECOVERY-CHECKPOINT.md",
              "breakers/c01_confirmation_runner_breaker.py",
              "reports/program/2026-09-27-C01-R3-FROZEN-WINDOW-BINDING-CORRECTION-CANDIDATE.md",
              "tools/c01_confirmation_runner.py",
          }
          got = set(subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"],
              text=True,
          ).splitlines())
          assert got == expected, (got, expected)
          PY

      - name: Verify protected and qualified blob identities
        shell: bash
        run: |
          test "$(git hash-object tools/c01_confirmation_runner.py)" = "7ea6ed6796eae8618cfd823b49eee1a63a19e096"
          test "$(git hash-object breakers/c01_confirmation_runner_breaker.py)" = "cf275dba96e50e8b899223a57267e811af4693ec"
          test "$(git hash-object reports/program/evidence/2026-09-26-C01-CONFIRMATORY-CHARTER-V0.2.json)" = "ada0ebf41ecd7ab406d2656ac745ed7003d5b5c1"
          test "$(git hash-object reports/program/evidence/2026-09-26-C01-CONFIRMATION-EXECUTION-CONTRACT-V0.1.json)" = "f6823cfa7b3c582524b3d512d45b16fdc0450ee8"
          test "$(git hash-object reports/program/evidence/2026-09-26-C01-FROZEN-CONFIRMATORY-MODEL-V0.2.json)" = "68ee4795462c5dbd5747a7bfdef81716dc84227f"
          test "$(git hash-object reports/program/evidence/2026-09-26-C01-FROZEN-MODEL-V0.2-SEAL-CANDIDATE.json)" = "3a6897a63ef2f07a26429342b45977767090651e"
          test "$(git hash-object reports/program/2026-09-26-C01-FROZEN-MODEL-V0.2-FINAL-SEAL-ADJUDICATION.md)" = "d54ec7840a7bf4eecd94a72f753a02418ea8f543"

      - name: Compile runtime
        run: python -m py_compile tools/c01_confirmation_runner.py

      - name: Historical qualified harness 33
        run: python -m pytest -q breakers/c01_confirmation_runner_breaker.py -k "not r3_frozen_window_binding"

      - name: C01-R3 frozen-window breakers 3
        run: python -m pytest -q breakers/c01_confirmation_runner_breaker.py -k "r3_frozen_window_binding"

      - name: Full C01 runner harness 36
        run: python -m pytest -q breakers/c01_confirmation_runner_breaker.py
