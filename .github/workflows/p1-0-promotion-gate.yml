name: P1.0 Promotion Gate Tier-A
# Final persisted-head qualification trigger: semantically neutral push after documentary closure candidate v2.

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/p1-0-promotion-gate.yml'
      - '04-REFERENCE/PROMOTION-GATE-CONTRACT.md'
      - '04-REFERENCE/PROMOTION-GATE-TIERING-CONTRACT.md'
      - 'src/promotion_gate.py'
      - 'tests/test_promotion_gate_tier_a.py'
      - 'tests/test_promotion_gate_acquisition_binding.py'
      - 'tools/frozen_execution_window.py'
      - 'GOVERNANCE/GOVERNANCE-EVOLUTION-AND-AUDIT-PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: 'UTC'
  LANG: 'C.UTF-8'
  LC_ALL: 'C.UTF-8'
  P0_6_BASE: '8061127c148f06454dac6e7977a8d0cb921276f8'

jobs:
  tier-a-break:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD and closed P0.6 ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${P0_6_BASE}" HEAD

      - name: Prove P1.0 surface is bounded and non-permissive
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          required = {
              '04-REFERENCE/PROMOTION-GATE-CONTRACT.md',
              '04-REFERENCE/PROMOTION-GATE-TIERING-CONTRACT.md',
              'tests/test_promotion_gate_tier_a.py',
              'tests/test_promotion_gate_acquisition_binding.py',
              '.github/workflows/p1-0-promotion-gate.yml',
          }
          for path in required:
              assert Path(path).is_file(), path

          canonical = Path('04-REFERENCE/PROMOTION-GATE-CONTRACT.md').read_text(encoding='utf-8')
          companion = Path('04-REFERENCE/PROMOTION-GATE-TIERING-CONTRACT.md').read_text(encoding='utf-8')
          assert 'single normative P1.0 promotion/tiering contract' in canonical
          assert 'NON_NORMATIVE_QUALIFICATION_COMPANION' in companion
          assert 'Canonical contract ID:** `PROMOTION_GATE_FAIL_CLOSED_V1`' in companion

          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '8061127c148f06454dac6e7977a8d0cb921276f8', 'HEAD'],
              text=True,
          ).splitlines())
          forbidden_prefixes = (
              'data/', 'LOCAL-EVIDENCE/', 'tools/download_',
              'tools/probe_dukascopy', 'tools/qualify_dukascopy',
          )
          forbidden = [p for p in changed if p.startswith(forbidden_prefixes) or p.endswith('.bi5')]
          assert not forbidden, forbidden
          print('PASS: P1.0 surface contains no acquisition/data/backtest payload and has one normative contract authority')
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact P0.6 qualification environment
        run: python tools/qualification_environment.py verify

      - name: Re-prove P0.6 environment attacks
        run: python -m pytest -q tests/test_system_reproducibility_tier_a.py

      - name: Break P1.0 promotion gate and acquisition binding
        run: |
          python -m pytest -q \
            tests/test_promotion_gate_tier_a.py \
            tests/test_promotion_gate_acquisition_binding.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
