name: BEPD-09D-R2-CR1-F2 Precision-Loss Forensics

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - 'GOVERNANCE/BEPD-09D-R2-CR1-F2-HUMAN-AUTHORIZATION-2026-10-08.json'
      - 'GOVERNANCE/BEPD-09D-R2-CR1-F2-PRECISION-LOSS-DIAGNOSTIC-CONTRACT-V0.1.json'
      - 'GOVERNANCE/BEPD-09D-R2-CR1-F2-FORENSIC-BREAKER-CONTRACT-V0.1.json'
      - 'tools/bepd09d_r2_cr1_f2_precision_loss.py'
      - '.github/workflows/bepd-09d-r2-cr1-f2-forensics.yml'

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Run F2 precision-loss diagnostic
        env:
          PYTHONPATH: tools
        run: python tools/bepd09d_r2_cr1_f2_precision_loss.py
      - name: Preserve F2 receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BEPD-09D-R2-CR1-F2-forensics
          path: artifacts/bepd09d-r2-cr1-f2-precision-loss/
          if-no-files-found: error
          retention-days: 30
