name: AO-E0 M06-AMEND-01 Prospective Analysis

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'GOVERNANCE/AO-E0-M06-AMEND-01-*'
      - 'tools/ao_e0_m06_amend_01_analysis.py'
      - 'tests/test_ao_e0_m06_amend_01.py'
      - 'reports/program/2026-10-07-AO-E0-M06-AMEND-01-*'
      - '.github/workflows/ao-e0-m06-amend-01-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: M06-AMEND-01 prospective analysis
        run: python -m pytest -q tests/test_ao_e0_m06_amend_01.py

      - name: Frozen M06 regression
        run: python -m pytest -q tests/test_ao_e0_b8_m06_02.py

      - name: Prove frozen source blobs unchanged
        run: |
          test "$(git rev-parse HEAD:GOVERNANCE/AO-E0-B8-M06-02-SAMPLE-ADEQUACY-PREREGISTRATION-CANDIDATE-V0.1.json)" = "95a2e41c1e004e3b4461631060d8b12380983caa"
          test "$(git rev-parse HEAD:GOVERNANCE/AO-E0-B8-M06-02-PARAMETER-PREREGISTRATION-HUMAN-ADOPTION-2026-10-06.md)" = "cb2c259de09bf283f7d08a106414944197705d3e"
          test "$(git rev-parse HEAD:GOVERNANCE/AO-E0-B12-DATA-01-PROSPECTIVE-FORWARD-INSTANCE-FORMATION-CONTRACT-V0.1.json)" = "7ebb5dc87434776d49966fdfbaba4006d44478ad"
          test "$(git rev-parse HEAD:reports/program/2026-10-06-AO-E0-B8-M06-TR-01-OPERATIONAL-COHERENCE-V0.1.md)" = "3935a31f5629c41f8a4f503b26a7914c0d747bde"

      - name: Prove authority firewall
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('tools/ao_e0_m06_amend_01_analysis.py')
          s=importlib.util.spec_from_file_location('a',p)
          m=importlib.util.module_from_spec(s)
          s.loader.exec_module(m)
          out=m.analyze()
          assert all(v is False for v in out['authority'].values())
          assert out['recommended_next_phase']['select_exact_horizon_now'] is False
          assert out['routes']['R4_DECOUPLE_PLANNING_N_FROM_FIXED_NONPERFORMANCE_CONFIRMATORY_HORIZON'] == 'RECOMMENDED_FOR_NEXT_DESIGN_PHASE'
          PY

      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
