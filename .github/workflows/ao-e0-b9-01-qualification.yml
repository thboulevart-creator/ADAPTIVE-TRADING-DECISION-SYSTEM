name: AO-E0 B9 Exposure Multiplicity Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - 'GOVERNANCE/AO-E0-B9-01-*'
      - 'breakers/ao_e0_b9_01_breaker.py'
      - 'tests/test_ao_e0_b9_01.py'
      - 'reports/program/*AO-E0-B9-01*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify frozen SMF identities
        run: |
          test "$(git hash-object tools/smf03_evidence_governance.py)" = "7ba33f9f9ce8dda49abdd1a7dff7a1b1cc0a0222"
          test "$(git hash-object GOVERNANCE/SMF-03-EVIDENCE-GOVERNANCE-CONTRACT-V0.1.json)" = "67014f4fb753e3165cacc0ae59a49b522e84fa87"

      - name: B9 adversarial breaker
        run: python -m pytest -q breakers/ao_e0_b9_01_breaker.py

      - name: B9 qualification tests
        run: python -m pytest -q tests/test_ao_e0_b9_01.py

      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
