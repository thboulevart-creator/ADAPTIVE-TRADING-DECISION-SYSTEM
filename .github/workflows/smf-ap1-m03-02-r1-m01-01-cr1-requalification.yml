name: SMF AP1 M03-02 R1 M01-01 CR1 Requalification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'GOVERNANCE/SMF-AP1-M03-02-R1-M01-01-CR1-*'
      - 'GOVERNANCE/SMF-AP1-M03-02-R1-M01-01-TEMPORAL-STABILITY-CONTRACT-V0.2.json'
      - 'reports/program/*SMF-AP1-M03-02-R1-M01-01-CR1*'
      - 'tests/test_smf_ap1_m03_02_r1_m01_01_cr1.py'
      - '.github/workflows/smf-ap1-m03-02-r1-m01-01-cr1-requalification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  requalify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: CR1 targeted breakers
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_m01_01_cr1.py
      - name: Original M01 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_m01_01.py
      - name: SI-01 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_si01.py
      - name: EF-01 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_ef01.py
      - name: Assert no M10 execution surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('GOVERNANCE/SMF-AP1-M03-02-R1-M01-01-TEMPORAL-STABILITY-CONTRACT-V0.2.json')
          j=json.loads(p.read_text())
          assert j['m10_authorized'] is False
          assert j['m10_executed'] is False
          assert j['authority']['scientific_method_execution'] is False
          PY
      - name: Clean worktree
        if: always()
        run: |
          git status --porcelain
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
