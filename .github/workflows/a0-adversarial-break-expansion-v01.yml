name: A0 Adversarial Break Expansion V0.1

on:
  push:
    branches:
      - sandbox/a0-adversarial-break-expansion-v01
    paths:
      - breakers/a0_research_authority_adversarial_breaker_v01.py
      - .github/workflows/a0-adversarial-break-expansion-v01.yml

permissions:
  contents: read

jobs:
  break-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify governed candidate and historical breaker identities
        run: |
          test "$(git hash-object src/a0_research_authority.py)" = "737f041b7b083f832f475b2aab607fb417c74fe0"
          test "$(git hash-object breakers/a0_research_authority_red_breaker.py)" = "e02ecfa6d30c2877a33f5c5d81b161ee562202b6"
          test "$(git hash-object GOVERNANCE/A0-RESEARCH-FINDINGS-AUTHORITY-INTERPRETATION-CONTRACT-V0.3.md)" = "f1168481879f33f8762dcb1e19e2ad35211c8ec2"

      - name: Compile candidate and breakers
        run: |
          python -m py_compile src/a0_research_authority.py
          python -m py_compile breakers/a0_research_authority_red_breaker.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v01.py

      - name: Historical six remain green
        run: python -m pytest -q breakers/a0_research_authority_red_breaker.py

      - name: Attempt adversarial break
        shell: bash
        run: |
          set +e
          python -m pytest -q breakers/a0_research_authority_adversarial_breaker_v01.py > /tmp/a0-adversarial.txt 2>&1
          status=$?
          set -e
          cat /tmp/a0-adversarial.txt
          test "$status" -ne 0
          echo "A0_ADVERSARIAL_BREAK_EXPANSION=BREAK_CONFIRMED"
