name: B-PE-SEM-05R-03 channel capture

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - ".github/workflows/bpesem05r03-channel-capture.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: integration/system-v1
          fetch-depth: 0

      - name: Assert exact frozen plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object evidence/bpesem05r03/provider_channel_acquisition_plan_v0_1.json)" = "83f82b27898c1a6fbe0a31ef04196317e2f972ff"
          echo "CHANNEL_PLAN_IDENTITY_PASS"

      - name: Assert GET-only implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path("tools/bpesem05r03_capture_channels.py").read_text(encoding="utf-8")
          assert 'method="GET"' in s
          for bad in ['method="POST"','method="PUT"','method="PATCH"','method="DELETE"','smtplib']:
              assert bad not in s,bad
          print("GET_ONLY_STATIC_GUARD_PASS")
          PY

      - name: Capture official provider channel metadata read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bpesem05r03_capture_channels.py | tee /tmp/bpesem05r03-capture.json
          test -f evidence/bpesem05r03/provider_channel_readonly_capture_v0_1.json

      - name: Assert no contact execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p="evidence/bpesem05r03/provider_channel_readonly_capture_v0_1.json"
          x=json.load(open(p,encoding="utf-8"))
          assert x["method_used"]=="GET_ONLY"
          assert x["no_form_submission"] is True
          assert x["no_email_sent"] is True
          assert x["no_ticket_created"] is True
          assert x["no_inquiry_sent"] is True
          assert x["no_market_data_object_requested"] is True
          print("NO_CONTACT_EXECUTION_PASS")
          PY

      - name: Persist read-only channel capture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/bpesem05r03/provider_channel_readonly_capture_v0_1.json
          git commit -m "evidence: capture B-PE-SEM-05R-03 official channel metadata"
          git push origin HEAD:integration/system-v1
