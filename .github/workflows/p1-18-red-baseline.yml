name: P1-18 RED Baseline

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/p1-18-red-baseline.yml'
      - 'breakers/p1_18_qualified_producer_execution_breaker.py'
      - 'reports/program/*P1-18*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  p1-18-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Prove frozen P1-17 breaker contract
        run: |
          test "$(git hash-object GOVERNANCE/P1-17-FROZEN-ADVERSARIAL-BREAKER-CONTRACT-V0.1.json)" = "9ab0f9018dd6e9def4a5e35b8e9a35c3beb556bc"
          test "$(git hash-object GOVERNANCE/P1-17-QUALIFIED-PRODUCER-EXECUTION-CONTRACT-V0.1.json)" = "164bb9027bb7a241b3a14b1f6704e9be8b2bef7d"

      - name: Prove P1.12C absent before RED
        run: test ! -e src/p1_12c_qualified_producer_execution.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Observe exact 32-case RED
        run: |
          set +e
          python -m pytest -q breakers/p1_18_qualified_producer_execution_breaker.py > /tmp/p118-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/p118-red.log
          test "$rc" -ne 0
          grep -q "32 failed" /tmp/p118-red.log
          test "$(grep -c 'P1_12C_RUNTIME_ABSENT_EXPECTED_RED' /tmp/p118-red.log)" -ge 32
          echo "P1_18_RED_BASELINE=PASS_EXPECTED_32_FAILURES"

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
