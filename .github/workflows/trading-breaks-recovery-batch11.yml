name: Trading Breaks Recovery Batch 11

on:
  push:
    branches: [feat/multi-year-dukascopy-acquisition]
    paths:
      - '.github/workflows/trading-breaks-recovery-batch11.yml'
      - 'tools/trading_breaks_recovery_batch11_execute.py'
      - 'tests/test_trading_breaks_recovery_batch11_execution_contract.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  batch11:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering persisted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove governed parent state unchanged
        run: |
          git merge-base --is-ancestor cd8e4733f8d72674a30469f548899849ebfd3068 HEAD
          git diff --exit-code cd8e4733f8d72674a30469f548899849ebfd3068 HEAD -- \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            tools/trading_breaks_recovery_progression.py \
            tools/trading_breaks_recovery_protocol.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qualify all gates before Chromium
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_trading_breaks_recovery_*.py tests/test_dukascopy_usatech_calendar*.py tests/test_coverage_execution_window_boundary.py

      - name: Assert exact frozen Batch 11 identity
        run: |
          python - <<'PY'
          from tools.trading_breaks_recovery_batch11 import BATCH_SIZE,CURRENT_CAPABILITY_FINGERPRINT,CURRENT_CAPABILITY_ID,FROZEN_BATCH11_TARGETS,batch11_targets
          t=batch11_targets()
          assert BATCH_SIZE==5 and isinstance(FROZEN_BATCH11_TARGETS,tuple)
          assert t==list(FROZEN_BATCH11_TARGETS) and len(t)==5
          assert len({d for d,_ in t})==5 and [d for d,_ in t]==sorted(d for d,_ in t)
          assert CURRENT_CAPABILITY_ID=='TRADING_BREAKS_PRIMARY_WIDGET_V1'
          assert CURRENT_CAPABILITY_FINGERPRINT=='82238de6e862e2b31e7a8f4e5faa3f822545ba46251703b06180087a957aaf8f'
          print('PASS: immutable Batch 11 identity locked before Chromium')
          PY

      - name: Install browser only after gates PASS
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Execute exact frozen Batch 11
        run: xvfb-run -a python -m tools.trading_breaks_recovery_batch11_execute

      - name: Assert capture identity only
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.trading_breaks_recovery_batch11 import batch11_targets
          p=Path('trading_breaks_batch11_artifacts/batch_summary.json')
          assert p.exists()
          data=json.loads(p.read_text(encoding='utf-8'))
          expected=[{'target_date':d.isoformat(),'candidate_reason':r} for d,r in batch11_targets()]
          assert data.get('targets')==expected
          results=data.get('results')
          assert isinstance(results,list) and len(results)==5
          assert [x.get('target_date') for x in results]==[x['target_date'] for x in expected]
          assert all(x.get('capture_verdict') in {'CAPTURED','BLOCKED','FAIL'} for x in results)
          print('PASS: five frozen Batch 11 targets captured in order')
          PY

      - name: Print capture summary
        if: always()
        run: cat trading_breaks_batch11_artifacts/batch_summary.json || true

      - name: Upload complete runtime evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-trading-breaks-recovery-batch11
          path: trading_breaks_batch11_artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Persist compact runtime report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          JOB_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "batch11") | .id' | head -n 1)"
          export JOB_ID
          python - <<'PY'
          import json, os
          from pathlib import Path
          src=Path('trading_breaks_batch11_artifacts/batch_summary.json')
          dst=Path('reports/data-qualification/historical_trading_breaks_recovery_batch11_runtime.json')
          data=json.loads(src.read_text(encoding='utf-8'))
          digest=os.environ.get('ARTIFACT_DIGEST') or None
          if digest and digest.startswith('sha256:'): digest=digest.split(':',1)[1]
          data['provenance']={'workflow_run':int(os.environ['GITHUB_RUN_ID']),'job_id':int(os.environ['JOB_ID']) if os.environ.get('JOB_ID') else None,'probe_commit':os.environ['GITHUB_SHA'],'artifact_id':int(os.environ['ARTIFACT_ID']) if os.environ.get('ARTIFACT_ID') else None,'artifact_url':os.environ.get('ARTIFACT_URL') or None,'artifact_sha256':digest}
          dst.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/data-qualification/historical_trading_breaks_recovery_batch11_runtime.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: persist Trading Breaks recovery Batch 11 runtime'
            git push origin HEAD:feat/multi-year-dukascopy-acquisition
          fi
