name: Trading Breaks Recovery Batch 11 Integration

on:
  push:
    branches: [feat/multi-year-dukascopy-acquisition]
    paths:
      - '.github/workflows/trading-breaks-recovery-batch11-integration.yml'
      - 'tools/integrate_trading_breaks_recovery_batch11.py'
      - 'tests/test_trading_breaks_recovery_batch11_integration_contract.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove adjudication ancestry and exact preintegration state
        run: |
          git merge-base --is-ancestor d49cccb0b99742eb87dfc72eac6481472150a7eb HEAD
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_trading_breaks_recovery_batch11_integration_contract.py tests/test_trading_breaks_recovery_batch11_adjudication.py
      - name: Apply Batch 11 worktree integration
        run: python -m tools.integrate_trading_breaks_recovery_batch11
      - name: Regenerate deterministic progression
        run: python -m tools.trading_breaks_recovery_progression >/tmp/batch11-progression.json
      - name: Assert exact post-integration state
        run: |
          python - <<'PY'
          from datetime import date
          from tools.dukascopy_usatech_calendar import SPECIAL_SESSION_EVIDENCE
          from tools.dukascopy_usatech_calendar_coverage import audit_calendar_coverage
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue, load_attempt_ledger, load_material_capability_changes, progression_decisions
          from tools.trading_breaks_recovery_protocol import recovery_queue
          expected={
            date(2025,5,26):('81578',frozenset(range(17,22))),
            date(2025,6,19):('82497',frozenset(range(17,22))),
            date(2025,7,3):('83303',frozenset(range(17,22))),
            date(2025,7,4):('83304',frozenset(range(17,24))),
            date(2025,9,1):('84407',frozenset(range(17,22))),
          }
          for day,(record_id,hours) in expected.items():
              rec=SPECIAL_SESSION_EVIDENCE[day]
              assert rec['broker_record_id']==record_id
              assert rec['fully_closed_hours_utc']==hours
              assert rec['artifact_id']==10412379849
              assert rec['artifact_sha256']=='f5bf2a2ee5cc7e2cb535266cd918cabfeedd1eb04ad59d518912b02c31276ef2'
              assert rec['probe_commit']=='7b5bbef03db35bf954c9a96364dba84d11b2fc94'
          _,_,attempts=load_attempt_ledger()
          b=[x for x in attempts if x.attempt_id.startswith('batch11:')]
          assert len(attempts)==55
          assert [x.attempt_sequence for x in b]==[51,52,53,54,55]
          assert [x.outcome for x in b]==['PASS']*5
          assert load_material_capability_changes()==[]
          g=audit_calendar_coverage(); w=audit_calendar_coverage(date(2021,8,14),date(2026,8,14))
          assert (g['candidate_dates'],g['resolved_candidate_dates'],g['unresolved_candidate_dates'])==(111,65,46)
          assert (w['candidate_dates'],w['resolved_candidate_dates'],w['unresolved_candidate_dates'])==(68,42,26)
          decisions=progression_decisions(); eligible=eligible_recovery_queue()
          assert len(recovery_queue())==len(decisions)==26
          assert sum((not x.eligible) and x.latest_attempt_outcome=='BLOCKED' for x in decisions)==13
          assert len(eligible)==13
          assert eligible[0]==(date(2025,11,27),'THANKSGIVING_DAY')
          print('PASS: exact Batch 11 post-integration state')
          PY
      - name: Run full governed and adversarial regression
        run: |
          mapfile -t TESTS < <(find tests -maxdepth 1 -type f \( -name 'test_trading_breaks_recovery_*.py' -o -name 'test_dukascopy_usatech_calendar*.py' -o -name 'test_coverage_execution_window_boundary.py' \) ! -name '*_integration_contract.py' | sort)
          python -m pytest -q "${TESTS[@]}"
      - name: Prove integration path used no browser or live capture
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tools/integrate_trading_breaks_recovery_batch11.py').read_text(encoding='utf-8').lower()
          for token in ('playwright','selenium','probe_candidate'):
              assert token not in s, token
          print('PASS: Batch 11 integration is offline')
          PY
      - name: Commit atomically only after all gates PASS
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/dukascopy_usatech_calendar.py reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json tests/
          git diff --cached --check
          git commit -m 'data: integrate Trading Breaks recovery Batch 11'
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
