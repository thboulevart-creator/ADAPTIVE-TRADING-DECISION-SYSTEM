name: AO-E0 P1 Owner 01 Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/ao-e0-p1-owner-01-qualification.yml'
      - 'GOVERNANCE/AO-E0-P1-OWNER-01-*'
      - 'src/p1_12c_ao_e0_native_owner.py'
      - 'src/p1_12d_ao_e0_extension.py'
      - 'tools/ao_e0_cc05_e1_producer.py'
      - 'breakers/ao_e0_p1_owner_01_breaker.py'
      - 'tests/test_ao_e0_p1_owner_01.py'
      - 'reports/program/*AO-E0-P1-OWNER-01*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  ao-e0-p1-owner-01:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify qualification environment
        run: python tools/qualification_environment.py verify

      - name: Frozen AO-E0 owner breaker
        run: python -m pytest -q breakers/ao_e0_p1_owner_01_breaker.py

      - name: AO-E0 owner synthetic qualification
        run: python -m pytest -q tests/test_ao_e0_p1_owner_01.py

      - name: Protected P1-21 regression
        run: python -m pytest -q tests/test_p1_21_real_producer_capability.py

      - name: Protected P1-20 regression
        run: python -m pytest -q tests/test_p1_20_common_downstream.py

      - name: Protected P1-18 regression
        run: python -m pytest -q tests/test_p1_18_qualified_producer_execution.py

      - name: Prove no real AO-E0 outputs
        run: |
          test ! -e AO-E0-CC05-EXECUTION-EVIDENCE.json
          test ! -e /tmp/AO-E0-CC05-EXECUTION-EVIDENCE.json
          echo "PASS: real AO-E0 not executed"

      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
