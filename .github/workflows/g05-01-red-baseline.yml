name: G05-01 Workspace RED Baseline

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'GOVERNANCE/G05-01-FIRST-REAL-CC02-EXECUTION-WORKSPACE-CONTRACT-V0.1.json'
      - 'GOVERNANCE/G05-01-FROZEN-ADVERSARIAL-BREAKER-CONTRACT-V0.1.json'
      - 'breakers/g05_01_workspace_dry_readiness_breaker.py'
      - '.github/workflows/g05-01-red-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: Observe exact expected RED
        run: |
          set +e
          python -m pytest -q breakers/g05_01_workspace_dry_readiness_breaker.py > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          test "$rc" -ne 0
          grep -q "30 failed" /tmp/red.log
          test "$(grep -c 'G05_01_WORKSPACE_RUNTIME_ABSENT_EXPECTED_RED' /tmp/red.log)" -ge 30
      - name: Prove runtime absent
        run: |
          test ! -e tools/g05_01_workspace_dry_readiness.py
          echo "PASS: G05-01 capability absent before implementation"
      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
