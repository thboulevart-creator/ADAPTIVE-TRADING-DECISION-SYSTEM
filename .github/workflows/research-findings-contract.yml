name: Research Findings Contract

on:
  push:
    paths:
      - 'src/context.py'
      - 'src/context_identity.py'
      - 'src/data/dataset_admissibility.py'
      - 'src/research_run_evidence.py'
      - 'src/research_findings.py'
      - 'tests/test_research_findings_contract.py'
      - 'tests/test_research_to_decision_boundary.py'
      - '.github/workflows/research-findings-contract.yml'
      - '04-REFERENCE/SYSTEM-REPRODUCIBILITY-CONTRACT.md'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
  pull_request:
    paths:
      - 'src/context.py'
      - 'src/context_identity.py'
      - 'src/data/dataset_admissibility.py'
      - 'src/research_run_evidence.py'
      - 'src/research_findings.py'
      - 'tests/test_research_findings_contract.py'
      - 'tests/test_research_to_decision_boundary.py'
      - '.github/workflows/research-findings-contract.yml'
      - '04-REFERENCE/SYSTEM-REPRODUCIBILITY-CONTRACT.md'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: 'UTC'
  LANG: 'C.UTF-8'
  LC_ALL: 'C.UTF-8'

jobs:
  research-findings-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install and verify locked qualification environment
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
          python tools/qualification_environment.py verify
      - run: python -m pytest tests/test_research_findings_contract.py -q
