name: Research Findings Contract

on:
  push:
    branches:
      - feat/decision-producer-contract
  pull_request:
    branches:
      - feat/decision-producer-contract

jobs:
  research-findings-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_research_findings_contract.py -q
