name: Trading Breaks Negative Evidence Completeness V1

on:
  push:
    branches: [feat/multi-year-dukascopy-acquisition]
    paths:
      - '.github/workflows/trading-breaks-negative-evidence-completeness.yml'
      - '04-REFERENCE/TRADING-BREAKS-NEGATIVE-EVIDENCE-COMPLETENESS.md'
      - 'tools/trading_breaks_negative_evidence_completeness.py'
      - 'tests/test_trading_breaks_negative_evidence_completeness.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualification HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove checkpoint ancestry current branch head and bounded mutation
        run: |
          git merge-base --is-ancestor 198df945eba73791edf759b14d3120b7a24d3105 HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/trading-breaks-negative-evidence-completeness.yml',
              '04-REFERENCE/TRADING-BREAKS-NEGATIVE-EVIDENCE-COMPLETENESS.md',
              'tools/trading_breaks_negative_evidence_completeness.py',
              'tests/test_trading_breaks_negative_evidence_completeness.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '26f9f366c55232bea321995e6076bd5c48c29bf9..HEAD'],
              text=True,
          ).splitlines())
          assert changed == expected, (changed, expected)
          forbidden = {
              'tools/dukascopy_usatech_calendar.py',
              'reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json',
              'reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json',
              'reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json',
          }
          assert not (changed & forbidden)
          print('PASS: qualification delta is bounded and does not mutate governed Trading Breaks state')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Adversarially break the completeness boundary
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_trading_breaks_negative_evidence_completeness.py

      - name: Download only the already-persisted source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/trading-breaks-negative-evidence-artifacts
          for artifact_id in 10364872726 10364984459 10367930592 10418961548; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "/tmp/trading-breaks-negative-evidence-artifacts/${artifact_id}.zip"
          done
          sha256sum /tmp/trading-breaks-negative-evidence-artifacts/*.zip

      - name: Apply qualified boundary to the four persisted Class-B observations
        run: |
          set +e
          python tools/trading_breaks_negative_evidence_completeness.py \
            --repo-root . \
            --artifact-dir /tmp/trading-breaks-negative-evidence-artifacts \
            --json-out /tmp/trading_breaks_negative_evidence_completeness.json
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo 'FAIL: integrity contradiction in persisted evidence'
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/trading_breaks_negative_evidence_completeness.json').read_text())
          assert result['verdict'] in {'PASS', 'BLOCKED'}
          assert result['class_b_date_count'] == 3
          assert result['source_observation_count'] == 4
          assert result['read_only'] is True
          assert result['browser_used'] is False
          assert result['broker_probe_used'] is False
          assert result['new_capture_used'] is False
          assert result['calendar_mutated'] is False
          assert result['attempt_ledger_mutated'] is False
          assert result['progression_mutated'] is False
          assert result['capability_registry_mutated'] is False
          assert result['execution_window_mutated'] is False
          print('GOVERNED_CLASS_B_VERDICT=' + result['verdict'])
          print('GOVERNED_CLASS_B_REASON=' + result['reason'])
          for item in result['date_results']:
              print(f"CLASS_B_DATE={item['target_date']} VERDICT={item['verdict']} REASON={item['reason']} OBS={item['observation_count']}")
          PY

      - name: Prove qualification execution is repository-read-only and clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
