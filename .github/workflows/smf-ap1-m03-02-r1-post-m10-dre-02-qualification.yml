name: SMF Post-M10 DRE-02 Synthetic Qualification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'tools/smf_ap1_m03_02_r1_post_m10_dre_02*.py'
      - 'tests/test_smf_ap1_m03_02_r1_post_m10_dre_02.py'
      - 'tests/fixtures/smf_ap1_m03_02_r1_post_m10_dre_02/**'
      - 'GOVERNANCE/SMF-AP1-M03-02-R1-POST-M10-DRE-02-*.json'
      - 'reports/program/*POST-M10-DRE-02*'
      - '.github/workflows/smf-ap1-m03-02-r1-post-m10-dre-02-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: DRE-02 synthetic qualification
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_dre_02.py
      - name: DRE-01 design freeze regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_dre_01_design_freeze.py
      - name: Assert no real payload surface
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[
              Path('tools/smf_ap1_m03_02_r1_post_m10_dre_02.py'),
              Path('tools/smf_ap1_m03_02_r1_post_m10_dre_02_reference.py'),
          ]
          text='\n'.join(p.read_text(encoding='utf-8') for p in paths)
          for forbidden in ('M03-R1-REAL-e73a24ca.json','ATDS-CONTROL','REAL_SOURCE_PATH','open(','read_text(','read_bytes('):
              assert forbidden not in text
          PY
      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
