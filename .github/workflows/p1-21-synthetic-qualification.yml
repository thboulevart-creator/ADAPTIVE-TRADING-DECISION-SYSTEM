name: P1-21 Real Producer Capability Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/p1-21-synthetic-qualification.yml'
      - '.github/workflows/p1-21-red-baseline.yml'
      - 'src/p1_12c_qualified_producer_execution.py'
      - 'tools/p1_12c_sandbox_runner.py'
      - 'tests/p1_21_fixture.py'
      - 'tests/p1_21_ap1_profile_probe.py'
      - 'tests/test_p1_21_real_producer_capability.py'
      - 'breakers/p1_21_real_producer_capability_breaker.py'
      - 'reports/program/*P1-21*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  P1_21_RED_RECEIPT_HEAD: 'e9a2f76ce93959d2de5a052c639ca12657360fb7'

jobs:
  p1-21:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove ancestry and persisted HEAD
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${P1_21_RED_RECEIPT_HEAD}" HEAD

      - name: Prove immutable test-first evidence
        run: |
          test "$(git hash-object GOVERNANCE/P1-21-FROZEN-ADVERSARIAL-BREAKER-CONTRACT-V0.1.json)" = "2d985ebcd2fca331a8af1be864fdce07ff26ceec"
          test "$(git hash-object breakers/p1_21_real_producer_capability_breaker.py)" = "981f21bcdde9afea5b85cced387c3acdb119e26f"
          test "$(git hash-object reports/program/2026-10-05-P1-21-TEST-FIRST-RED-RECEIPT-V0.1.json)" = "006a877e9c64361d68cbb969578ed71b34054d6e"
          test "$(git hash-object reports/program/2026-10-05-P1-21-PARENT-DRIFT-RECONCILIATION-R4-V0.1.json)" = "73983e061c8cd227fc1d826da42ca7eb1f07d72c"

      - name: Prove protected owner identities unchanged
        run: |
          test "$(git hash-object src/data/claim_scoped_admission.py)" = "6ce06e1583e61be9e8618136d1bc8fdda608ffd7"
          test "$(git hash-object reports/program/2026-10-04-DATA-02-REAL-AP0-READ-ONLY-ADMISSION-RECEIPT-V0.1.json)" = "ccfccda676abfe7e02082a331557ffed14e1f32b"
          test "$(git hash-object tools/ap1_intraday_spread_census.py)" = "9f613063fb8a190a1ff6f2f8b12c97c4ed97712a"
          test "$(git hash-object src/p1_12d_qualified_execution_evidence.py)" = "2bbc59f248d1c735fba93a35fc8c00b3ab6c7190"
          test "$(git hash-object src/p1_13c_common_evaluation.py)" = "617c39505cdd64e8a7a40a40612b4bec0c30ed34"
          test "$(git hash-object src/p1_14c_common_measurement_provenance.py)" = "7bd6a91a69484213b4d26d25bd18d62019c77b08"
          test "$(git hash-object src/p1_15c_common_evaluator_authority.py)" = "a0c7ced052a734ce44d580f2430081f8f8647a47"
          test "$(git hash-object src/p1_16c_common_qualified_finding.py)" = "92967f7789537399510ac2c61ceab5b52268c931"

      - name: Prove exact P1-21 implementation identities
        run: |
          test "$(git hash-object src/p1_12c_qualified_producer_execution.py)" = "9d304202d44c8917cf640fd0b4114169968e511e"
          test "$(git hash-object tools/p1_12c_sandbox_runner.py)" = "b16fa57409a67049eedfbb6c6ec7b2e9ae3e3108"
          test "$(git hash-object tests/p1_21_fixture.py)" = "92c3412aff89c46b290110d995b753d9c1f3b93f"
          test "$(git hash-object tests/p1_21_ap1_profile_probe.py)" = "b31918b1be62cf6aa03f2ca5fc45583662a07aa9"
          test "$(git hash-object tests/test_p1_21_real_producer_capability.py)" = "53a5f4f93cb95b36811311704a13ee632581e3f3"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Compile changed Python surfaces without filesystem mutation
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              "src/p1_12c_qualified_producer_execution.py",
              "tools/p1_12c_sandbox_runner.py",
              "tests/p1_21_fixture.py",
              "tests/p1_21_ap1_profile_probe.py",
              "tests/test_p1_21_real_producer_capability.py",
              "reports/program/2026-10-05-P1-21-PARENT-DRIFT-RECONCILIATION-R2-V0.1.json",
              "reports/program/2026-10-05-P1-21-PARENT-DRIFT-RECONCILIATION-R3-V0.1.json",
          ):
              p=Path(name)
              compile(p.read_text(encoding="utf-8"),str(p),"exec")
          print("PASS: P1-21 changed surfaces compile")
          PY

      - name: Replay frozen P1-21 breaker
        run: python -m pytest -q breakers/p1_21_real_producer_capability_breaker.py

      - name: P1-21 synthetic and non-empirical qualification
        run: python -m pytest -q tests/test_p1_21_real_producer_capability.py

      - name: P1-18 protected breaker replay
        run: python -m pytest -q breakers/p1_18_qualified_producer_execution_breaker.py

      - name: P1-18 positive regression
        run: python -m pytest -q tests/test_p1_18_qualified_producer_execution.py

      - name: P1-20 common-downstream frozen breaker replay
        run: python -m pytest -q breakers/p1_20_common_downstream_breaker.py

      - name: P1-20 common-downstream positive regression
        run: python -m pytest -q tests/test_p1_20_common_downstream.py

      - name: DATA-02 protected regression
        run: python -m pytest -q breakers/data_02_claim_scoped_admission_breaker.py

      - name: Prove P1-21 implementation and reconciliation deltas are bounded
        run: |
          python - <<'PY'
          import subprocess

          implementation_parent="7e81f615b2cd8e3c8704a1469384ae8779b0c9fa"
          implementation_head="6fc1d67ebc27d5329e4915e58b833ef044631f40"
          implementation_changed=subprocess.check_output(
              ["git","diff","--name-only",f"{implementation_parent}..{implementation_head}"],
              text=True,
          ).splitlines()
          implementation_exact={
              ".github/workflows/p1-21-red-baseline.yml",
              ".github/workflows/p1-21-synthetic-qualification.yml",
              "src/p1_12c_qualified_producer_execution.py",
              "tools/p1_12c_sandbox_runner.py",
              "tests/p1_21_fixture.py",
              "tests/p1_21_ap1_profile_probe.py",
              "tests/test_p1_21_real_producer_capability.py",
              "reports/program/2026-10-05-P1-21-PARENT-DRIFT-RECONCILIATION-R2-V0.1.json",
              "reports/program/2026-10-05-P1-21-PARENT-DRIFT-RECONCILIATION-R3-V0.1.json",
          }
          extra=sorted(set(implementation_changed)-implementation_exact)
          if extra:
              raise SystemExit("UNAUTHORIZED_P1_21_IMPLEMENTATION_DELTA:"+",".join(extra))

          tail_parent="e99b5e1cd3814144ef4c1294b2c0dd3df5c2389d"
          tail_changed=subprocess.check_output(
              ["git","diff","--name-only",f"{tail_parent}..HEAD"],
              text=True,
          ).splitlines()
          tail_exact={
              ".github/workflows/p1-21-synthetic-qualification.yml",
              "tests/test_p1_21_real_producer_capability.py",
              "reports/program/2026-10-05-P1-21-PARENT-DRIFT-RECONCILIATION-R4-V0.1.json",
          }
          for path in tail_changed:
              if path in tail_exact:
                  continue
              if path.startswith("reports/program/") and "P1-21" in path:
                  continue
              raise SystemExit(f"UNAUTHORIZED_P1_21_TAIL_DELTA:{path}")
          print("PASS: P1-21 implementation and reconciliation deltas bounded")
          PY

      - name: Prove no real AP1 output
        run: |
          test ! -e ATDS-AP1-INTRADAY-SPREAD-CENSUS.json
          test ! -e /tmp/ATDS-AP1-INTRADAY-SPREAD-CENSUS.json
          echo "PASS: real AP1 not executed"

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
