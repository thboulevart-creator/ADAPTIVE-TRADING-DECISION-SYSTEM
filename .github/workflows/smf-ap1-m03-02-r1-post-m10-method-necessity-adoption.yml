name: SMF Post-M10 Method Necessity Adoption

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'GOVERNANCE/SMF-AP1-M03-02-R1-POST-M10-METHOD-NECESSITY-HUMAN-ADJUDICATION-2026-10-06.md'
      - 'reports/program/2026-10-06-SMF-AP1-M03-02-R1-POST-M10-METHOD-NECESSITY-HUMAN-ADOPTION-RECEIPT-V0.1.json'
      - 'tests/test_smf_ap1_m03_02_r1_post_m10_method_necessity.py'
      - '.github/workflows/smf-ap1-m03-02-r1-post-m10-method-necessity-adoption.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Qualify post-M10 human adoption
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_method_necessity.py
      - name: M10-01 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_m10_01.py
      - name: M10-00 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_m10_00.py
      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
