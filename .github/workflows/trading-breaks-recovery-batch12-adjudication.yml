name: Trading Breaks Recovery Batch 12 Adjudication

on:
  push:
    branches: [feat/multi-year-dukascopy-acquisition]
    paths:
      - '.github/workflows/trading-breaks-recovery-batch12-adjudication.yml'
      - 'tools/trading_breaks_recovery_batch12_adjudication.py'
      - 'tests/test_trading_breaks_recovery_batch12_adjudication.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove capture ancestry and governed state unchanged
        run: |
          git merge-base --is-ancestor 2c2fd6e2db2e0ab75a6b978d6cddad679dbda5b8 HEAD
          git diff --exit-code 2c2fd6e2db2e0ab75a6b978d6cddad679dbda5b8 HEAD -- \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            tools/trading_breaks_recovery_progression.py \
            tools/trading_breaks_recovery_protocol.py \
            tools/trading_breaks_recovery_batch12.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json
          test -f reports/data-qualification/historical_trading_breaks_recovery_batch12_runtime.json

      - name: Run independent offline adjudication tests
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch12_adjudication.py \
            tests/test_trading_breaks_recovery_batch12.py \
            tests/test_trading_breaks_recovery_batch12_execution_contract.py

      - name: Produce independent adjudication reports
        run: python -m tools.trading_breaks_recovery_batch12_adjudication

      - name: Prove adjudication has no browser, live probe, or scheduler path
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/trading_breaks_recovery_batch12_adjudication.py').read_text(encoding='utf-8').lower()
          for token in ('playwright', 'selenium', 'probe_candidate', 'eligible_recovery_queue', 'recovery_queue('):
              assert token not in source, token
          print('PASS: Batch 12 adjudication is offline, immutable-membership, and scheduler-free')
          PY

      - name: Persist adjudication evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('reports/data-qualification/historical_trading_breaks_recovery_batch12_qualification.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            reports/data-qualification/historical_trading_breaks_recovery_batch12_adjudication.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch12_qualification.md
          git diff --cached --check
          git commit -m 'evidence: adjudicate Trading Breaks recovery Batch 12'
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
