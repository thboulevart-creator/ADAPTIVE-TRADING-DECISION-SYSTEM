name: G05-01 Dry Readiness Code Qualification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'tools/g05_01_workspace_dry_readiness.py'
      - 'tests/test_g05_01_workspace_dry_readiness.py'
      - 'breakers/g05_01_workspace_dry_readiness_breaker.py'
      - 'GOVERNANCE/G05-01-*'
      - 'reports/program/*G05-01*'
      - '.github/workflows/g05-01-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: Prove frozen RED identities
        run: |
          test "$(git hash-object GOVERNANCE/G05-01-FROZEN-ADVERSARIAL-BREAKER-CONTRACT-V0.1.json)" = "05e8c946ae44017c81afd99185649e9aa9378b61"
          test "$(git hash-object breakers/g05_01_workspace_dry_readiness_breaker.py)" = "2b1936c7f70b536e5bd23591a5a48618e51e9012"
          test "$(git hash-object reports/program/2026-10-05-G05-01-TEST-FIRST-RED-RECEIPT-V0.1.json)" = "4c5ef9a53bed5bd5f04c2c6b262f8f86dd2d8aec"
      - name: Frozen G05 breakers
        run: python -m pytest -q breakers/g05_01_workspace_dry_readiness_breaker.py
      - name: G05 synthetic code qualification
        run: python -m pytest -q tests/test_g05_01_workspace_dry_readiness.py
      - name: P1-21 regression
        run: |
          python -m pytest -q breakers/p1_21_real_producer_capability_breaker.py
          python -m pytest -q tests/test_p1_21_real_producer_capability.py
      - name: SMF-AP1-M03 regression
        run: |
          python -m pytest -q breakers/smf_ap1_m03_01_binding_breaker.py
          python -m pytest -q tests/test_smf_ap1_m03_01_binding.py
      - name: DATA-02 regression
        run: python -m pytest -q breakers/data_02_claim_scoped_admission_breaker.py
      - name: Prove no empirical execution artifact
        run: |
          test ! -e ATDS-AP1-INTRADAY-SPREAD-CENSUS.json
          test ! -d artifacts/g05-01
          echo "PASS: code qualification is non-empirical"
      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
