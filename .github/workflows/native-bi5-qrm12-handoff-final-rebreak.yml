name: Native BI5 Q-RM-12 Handoff Final Re-break

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/native-bi5-qrm12-handoff-final-rebreak.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

  HANDOFF_SOURCE_BLOB: '95d5fcf0a70757abcb2509363b7b03fdea785c71'
  HANDOFF_ADVERSARIAL_BLOB: '59c6f976e72f112c8450de6ac4ba23cff159ba78'
  IA_V02_SOURCE_BLOB: 'cab85272bc5a2e229f56f1e02e624d68dc84ce29'
  IB_V02_SOURCE_BLOB: '6d14704548861c13dfc809adad6ae7a21e31c2ca'
  QRM12_BREAKER_BLOB: '967ab86d517cc8736344bb27154641eb9bac7996'
  F_SOURCE_BLOB: '199b07929fe8ec40d719b001b0321d1f26c8faab'
  O_SOURCE_BLOB: '219b22bc92855c24eef3a7abb08e177644d05c76'

jobs:
  final-rebreak:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted technical identities
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object src/native_bi5_qrm12_handoff.py)" = "${HANDOFF_SOURCE_BLOB}"
          test "$(git hash-object breakers/native_bi5_qrm12_handoff_adversarial.py)" = "${HANDOFF_ADVERSARIAL_BLOB}"
          test "$(git hash-object src/native_bi5_reference_qualifier_qrm12.py)" = "${IA_V02_SOURCE_BLOB}"
          test "$(git hash-object src/native_bi5_independent_qualifier_qrm12.py)" = "${IB_V02_SOURCE_BLOB}"
          test "$(git hash-object breakers/native_bi5_qrm12_compatibility_breaker.py)" = "${QRM12_BREAKER_BLOB}"
          test "$(git hash-object src/native_bi5_freeze_persistence.py)" = "${F_SOURCE_BLOB}"
          test "$(git hash-object src/native_bi5_semantic_universe_comparator.py)" = "${O_SOURCE_BLOB}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Execute full frozen contract and handoff adversarial suite
        run: |
          set +e
          python -m pytest -q breakers/native_bi5_qrm12_compatibility_breaker.py
          frozen_status=$?
          python -m pytest -q breakers/native_bi5_qrm12_handoff_adversarial.py
          adversarial_status=$?
          set -e
          echo "frozen_status=${frozen_status}"
          echo "adversarial_status=${adversarial_status}"
          test "${frozen_status}" -eq 0
          test "${adversarial_status}" -eq 0

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
