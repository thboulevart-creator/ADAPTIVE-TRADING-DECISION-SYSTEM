name: Native BI5 I_B Independent Qualifier Adversarial

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/native-bi5-ib-independent-qualifier-adversarial.yml'
      - 'breakers/native_bi5_ib_independent_qualifier_adversarial.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  IB_SOURCE_GIT_BLOB: '1b3fbcd4ac084eedc27a008c959025c02b71a95a'
  EVIDENCE_BREAKER_BLOB: '231f9daa343f95baa4b747ec2b89166833255958'

jobs:
  break-ib:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact source and immutable evidence breaker
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object src/native_bi5_independent_qualifier.py)" = "${IB_SOURCE_GIT_BLOB}"
          test "$(git hash-object breakers/native_bi5_ib_derivation_evidence_breaker.py)" = "${EVIDENCE_BREAKER_BLOB}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Adversarially break I_B
        run: python -m pytest -q breakers/native_bi5_ib_independent_qualifier_adversarial.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
