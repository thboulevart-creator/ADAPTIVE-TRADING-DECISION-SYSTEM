name: Native BI5 Q-RM-12 Compatibility Preimplementation RED

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/native-bi5-qrm12-compatibility-preimplementation.yml'
      - 'breakers/native_bi5_qrm12_compatibility_breaker.py'
      - 'reports/data-qualification/qrm12_postseal_f_o_handoff_formalization_candidate_2026-09-19.md'
      - 'reports/data-qualification/qrm12_postseal_f_o_handoff_persisted_head_rebreak_2026-09-19.md'
      - 'src/native_bi5_reference_qualifier_qrm12.py'
      - 'src/native_bi5_independent_qualifier_qrm12.py'
      - 'src/native_bi5_qrm12_handoff.py'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

  QRM12_FORMALIZATION_BLOB: 'a1f1c0edf6f45fd96620e3f2274cc9da0214e3f7'
  QRM12_REBREAK_BLOB: '408074e0480ba101368ba219ad50624567ab28e5'
  QRM12_BREAKER_BLOB: '967ab86d517cc8736344bb27154641eb9bac7996'

  IA_V1_SOURCE_BLOB: '098040812de654a9c5e4f9961f4a26b2ba959adf'
  IB_V1_SOURCE_BLOB: '25fadd36761616e89a21964201b3bfa3c7349ea4'
  F_SOURCE_BLOB: '199b07929fe8ec40d719b001b0321d1f26c8faab'
  O_SOURCE_BLOB: '219b22bc92855c24eef3a7abb08e177644d05c76'

  IA_V1_BREAKER_BLOB: '64d3a391e1b5cb5aecfdf926551acd3ee5f0d7dd'
  IB_V1_BREAKER_BLOB: 'd1a305e3b9ae813e891b34522e3a12bb6bc8ac34'
  F_BREAKER_BLOB: '3d9eb75c2f4e988c984da67af0af344d3dc24148'
  F_ADVERSARIAL_BLOB: 'c4c499d5e76e15a8fdcaeb91dde80beadad6487a'
  O_BREAKER_BLOB: '9e1d897329a15f8b26172558b6579d61d9ba3820'
  O_ADVERSARIAL_BLOB: '255ff9f02d206815638b5e63e92546e647e826e4'

jobs:
  preimplementation-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD and frozen governed identities
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          test "$(git hash-object reports/data-qualification/qrm12_postseal_f_o_handoff_formalization_candidate_2026-09-19.md)" = "${QRM12_FORMALIZATION_BLOB}"
          test "$(git hash-object reports/data-qualification/qrm12_postseal_f_o_handoff_persisted_head_rebreak_2026-09-19.md)" = "${QRM12_REBREAK_BLOB}"
          test "$(git hash-object breakers/native_bi5_qrm12_compatibility_breaker.py)" = "${QRM12_BREAKER_BLOB}"

          test "$(git hash-object src/native_bi5_reference_qualifier.py)" = "${IA_V1_SOURCE_BLOB}"
          test "$(git hash-object src/native_bi5_independent_qualifier.py)" = "${IB_V1_SOURCE_BLOB}"
          test "$(git hash-object src/native_bi5_freeze_persistence.py)" = "${F_SOURCE_BLOB}"
          test "$(git hash-object src/native_bi5_semantic_universe_comparator.py)" = "${O_SOURCE_BLOB}"

          test "$(git hash-object breakers/native_bi5_ia_reference_qualifier_breaker.py)" = "${IA_V1_BREAKER_BLOB}"
          test "$(git hash-object breakers/native_bi5_ib_independent_qualifier_breaker.py)" = "${IB_V1_BREAKER_BLOB}"
          test "$(git hash-object breakers/native_bi5_f_freeze_persistence_breaker.py)" = "${F_BREAKER_BLOB}"
          test "$(git hash-object breakers/native_bi5_f_freeze_persistence_adversarial.py)" = "${F_ADVERSARIAL_BLOB}"
          test "$(git hash-object breakers/native_bi5_o_semantic_comparator_breaker.py)" = "${O_BREAKER_BLOB}"
          test "$(git hash-object breakers/native_bi5_o_semantic_comparator_adversarial.py)" = "${O_ADVERSARIAL_BLOB}"

      - name: Prove future Q-RM-12 production surfaces are absent
        run: |
          test ! -e src/native_bi5_reference_qualifier_qrm12.py
          test ! -e src/native_bi5_independent_qualifier_qrm12.py
          test ! -e src/native_bi5_qrm12_handoff.py
          echo 'PASS: expected preimplementation state — all future Q-RM-12 production surfaces absent'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Prove Q-RM-12 breaker collection before intentional RED
        run: python -m pytest --collect-only -q breakers/native_bi5_qrm12_compatibility_breaker.py

      - name: Execute Q-RM-12 compatibility breaker — expected RED only because future surfaces are absent
        run: python -m pytest -q breakers/native_bi5_qrm12_compatibility_breaker.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
