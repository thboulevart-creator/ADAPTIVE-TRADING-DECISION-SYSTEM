name: BEPD-09D First Real Historical C1 Execution

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - 'GOVERNANCE/BEPD-09D-HUMAN-AUTHORIZATION-2026-10-07.md'
      - 'tools/bepd09d_real_execution_harness.py'
      - '.github/workflows/bepd-09d-real-execution.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0

      - name: Execute governed BEPD-09D pair
        env:
          PYTHONPATH: tools
        run: python tools/bepd09d_real_execution_harness.py

      - name: Preserve governed receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BEPD-09D-real-execution
          path: artifacts/bepd09d-real-execution/
          if-no-files-found: error
          retention-days: 30
