name: B-PE-SEM-05R-02 inquiry contract

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - ".github/workflows/bpesem05r02-inquiry-contract.yml"

permissions:
  contents: write

jobs:
  inquiry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: integration/system-v1
          fetch-depth: 0

      - name: Assert formalization-only implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          forbidden={"requests","urllib","http","socket","aiohttp","ftplib","smtplib"}
          for name in [
              "tools/bpesem05r02_materialize_contract.py",
              "breakers/bpesem05r02_inquiry_contract_breaker.py",
          ]:
              tree=ast.parse(Path(name).read_text(encoding="utf-8"))
              bad=[]
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      for a in node.names:
                          if a.name.split(".")[0] in forbidden:
                              bad.append((node.lineno,a.name))
                  elif isinstance(node,ast.ImportFrom):
                      root=(node.module or "").split(".")[0]
                      if root in forbidden:
                          bad.append((node.lineno,node.module))
              assert not bad,(name,bad)
          print("PRECONTACT_NO_NETWORK_OR_MAIL_IMPORTS_PASS")
          PY

      - name: Materialize inquiry contract candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bpesem05r02_materialize_contract.py | tee /tmp/bpesem05r02-candidate.json
          test -f evidence/bpesem05r02/provider_primary_authority_inquiry_contract_v0_1.json
          test -f reports/data-qualification/bpesem05r02_inquiry_contract_candidate_2026-09-22.md

      - name: Persist inquiry contract candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             evidence/bpesem05r02/provider_primary_authority_inquiry_contract_v0_1.json             reports/data-qualification/bpesem05r02_inquiry_contract_candidate_2026-09-22.md
          git commit -m "evidence: materialize B-PE-SEM-05R-02 inquiry contract candidate"
          git push origin HEAD:integration/system-v1
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Break persisted inquiry contract candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          python3 breakers/bpesem05r02_inquiry_contract_breaker.py | tee /tmp/bpesem05r02-break.json
          test -f reports/data-qualification/bpesem05r02_inquiry_contract_adversarial_break_2026-09-22.md

      - name: Persist adversarial break report
        shell: bash
        run: |
          set -euo pipefail
          git add reports/data-qualification/bpesem05r02_inquiry_contract_adversarial_break_2026-09-22.md
          git commit -m "audit: break B-PE-SEM-05R-02 inquiry contract candidate"
          git push origin HEAD:integration/system-v1
