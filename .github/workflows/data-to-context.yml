name: Data to context boundary

on:
  push:
    paths:
      - 'src/context.py'
      - 'src/context_identity.py'
      - 'src/data/**'
      - 'src/research_run_evidence.py'
      - 'tests/test_data_to_context.py'
      - 'tests/test_context_to_research_boundary.py'
      - '.github/workflows/data-to-context.yml'
  pull_request:
    paths:
      - 'src/context.py'
      - 'src/context_identity.py'
      - 'src/data/**'
      - 'src/research_run_evidence.py'
      - 'tests/test_data_to_context.py'
      - 'tests/test_context_to_research_boundary.py'
      - '.github/workflows/data-to-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-to-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2
      - name: Run DATA to CONTEXT boundary tests
        run: python -m pytest tests/test_data_to_context.py -q
      - name: Run CONTEXT to RESEARCH boundary tests
        run: python -m pytest tests/test_context_to_research_boundary.py -q
