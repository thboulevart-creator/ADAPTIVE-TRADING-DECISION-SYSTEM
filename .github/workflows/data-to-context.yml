name: Data to context boundary

on:
  push:
    branches:
      - feat/step3-system-mapping
  workflow_dispatch:

jobs:
  data-to-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run DATA to CONTEXT boundary tests
        run: python -m pytest tests/test_data_to_context.py -q
