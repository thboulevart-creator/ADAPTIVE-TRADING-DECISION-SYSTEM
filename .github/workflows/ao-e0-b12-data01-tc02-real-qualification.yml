name: AO-E0 DATA-01 TC-02 Real Structural Qualification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'reports/program/2026-10-07-AO-E0-B12-DATA-01-TC-02-*.json'
      - 'tests/test_ao_e0_b12_data01_tc02_real_receipts.py'
      - '.github/workflows/ao-e0-b12-data01-tc02-real-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify TC-02 persisted evidence only
        run: python -m pytest -q tests/test_ao_e0_b12_data01_tc02_real_receipts.py

      - name: Prove authority firewall remains closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/program')
          q=json.loads((p/'2026-10-07-AO-E0-B12-DATA-01-TC-02-TECHNICAL-QUALIFICATION-V0.1.json').read_text())
          e=json.loads((p/'2026-10-07-AO-E0-B12-DATA-01-TC-02-REAL-EXECUTION-RECEIPT-V0.1.json').read_text())
          assert q['b12']=='CLOSED'
          assert q['strategy_qualified']=='NO_CLAIM'
          assert q['stop']=='HUMAN_DECISION_REQUIRED'
          assert e['real_read_count']==1
          assert e['tc02_read_token']=='CONSUMED'
          assert e['performance_bearing_read'] is False
          PY

      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
