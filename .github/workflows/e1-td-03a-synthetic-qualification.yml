name: E1-TD-03A Synthetic Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/e1-td-03a-synthetic-qualification.yml'
      - 'GOVERNANCE/E1-TD-03A-SOURCE-B-PROVENANCE-COLLECTOR-QUALIFICATION-CONTRACT-V0.1.json'
      - 'breakers/e1_td_03a_acquisition_collector_red_breaker.py'
      - 'tools/e1_td_03a_acquisition_collector.py'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  PYTHONPYCACHEPREFIX: '/tmp/e1-td-03a-pycache'
  PYTEST_ADDOPTS: '-p no:cacheprovider'
  TZ: 'UTC'
  LANG: 'C.UTF-8'
  LC_ALL: 'C.UTF-8'

jobs:
  e1-td-03a-synthetic-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install locked qualification environment
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Run frozen E1-TD-03A breaker
        run: python -m pytest -q breakers/e1_td_03a_acquisition_collector_red_breaker.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
