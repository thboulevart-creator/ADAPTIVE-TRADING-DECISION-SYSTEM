name: Native BI5 F Freeze Persistence Preimplementation RED

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/native-bi5-f-freeze-persistence-preimplementation.yml'
      - 'breakers/native_bi5_f_freeze_persistence_breaker.py'
      - 'reports/data-qualification/fo_native_bi5_freeze_oracle_candidate_2026-09-19.md'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
      - 'src/native_bi5_freeze_persistence.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  FO_CONTRACT_BLOB: 'fe62da06e63a51c336f9a447e7f1e0f3d89cad3b'
  F_BREAKER_BLOB: '612139be940c6bebd56f69e1d3bb1042e42bebba'

jobs:
  preimplementation-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD and governed F contract
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object reports/data-qualification/fo_native_bi5_freeze_oracle_candidate_2026-09-19.md)" = "${FO_CONTRACT_BLOB}"
          test "$(git hash-object breakers/native_bi5_f_freeze_persistence_breaker.py)" = "${F_BREAKER_BLOB}"

      - name: Prove F production runtime and O implementation are absent
        run: |
          test ! -e src/native_bi5_freeze_persistence.py
          test ! -e src/native_bi5_semantic_universe_comparator.py
          test ! -e src/native_bi5_oracle.py
          echo 'PASS: expected preimplementation state — F runtime and O implementation absent'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Execute F test-first breaker — expected RED only because runtime is absent
        run: python -m pytest -q breakers/native_bi5_f_freeze_persistence_breaker.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
