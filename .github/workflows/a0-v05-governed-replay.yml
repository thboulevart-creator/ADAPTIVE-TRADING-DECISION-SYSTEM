name: A0 Adversarial V0.5 Governed Replay

on:
  push:
    branches:
      - sandbox/a0-v05-governed-replay
    paths:
      - .github/workflows/a0-v05-governed-replay.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed V0.5 replay HEAD
        uses: actions/checkout@v4
        with:
          ref: b8c538aabc2793ecc6d2ba57725a8919135a3335
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify exact governed identities
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "b8c538aabc2793ecc6d2ba57725a8919135a3335"
          test "$(git hash-object src/a0_research_authority.py)" = "1210bee06a2d9aed2ed7d9078542934ff430175c"
          test "$(git hash-object src/a0_metric_domain_authority.py)" = "9bd05f2a2a97f092c0fc2988319f15caff57dda3"
          test "$(git hash-object GOVERNANCE/A0-SYNTHETIC-PRODUCER-METRIC-DOMAIN-AUTHORITY-V0.1.json)" = "dd205d3e7b4a522a5ba23cef1e665d51c196acb8"
          test "$(git hash-object breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py)" = "e3620ac348a8042fe1d04cfc9b32c16060fce4a3"
          test "$(git hash-object breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py)" = "bcba5de33a73f9e32ff39e8fb498ab4d471af098"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v05.py)" = "f02eae836b79403673f8a43292cca19eab0c6b33"
          test "$(git hash-object GOVERNANCE/A0-RESEARCH-FINDINGS-AUTHORITY-INTERPRETATION-CONTRACT-V0.3.md)" = "f1168481879f33f8762dcb1e19e2ad35211c8ec2"

      - name: Compile runtime and breakers
        run: |
          python -m py_compile src/a0_research_authority.py
          python -m py_compile src/a0_metric_domain_authority.py
          python -m py_compile breakers/a0_research_authority_red_breaker.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v01.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v02.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v03.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v04.py
          python -m py_compile breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py
          python -m py_compile breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v05.py

      - name: Preserve current 127-test surface
        shell: bash
        run: |
          python -m pytest -q             breakers/a0_research_authority_red_breaker.py             breakers/a0_research_authority_adversarial_breaker_v01.py             breakers/a0_research_authority_adversarial_breaker_v02.py             breakers/a0_research_authority_adversarial_breaker_v03.py             breakers/a0_research_authority_adversarial_breaker_v04.py             breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py             breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py             | tee /tmp/a0-existing-127.txt
          grep -q "127 passed" /tmp/a0-existing-127.txt
          echo "A0_EXISTING_127=PASS_UNCHANGED"

      - name: Replay complete governed V0.5 breaker
        shell: bash
        run: |
          python -m pytest -q             breakers/a0_research_authority_adversarial_breaker_v05.py             | tee /tmp/a0-v05-replay.txt
          grep -q "22 passed" /tmp/a0-v05-replay.txt
          echo "A0_V05_GOVERNED_REPLAY=PASS_22_OF_22"

      - name: Combined current-head surface
        shell: bash
        run: |
          python -m pytest -q             breakers/a0_research_authority_red_breaker.py             breakers/a0_research_authority_adversarial_breaker_v01.py             breakers/a0_research_authority_adversarial_breaker_v02.py             breakers/a0_research_authority_adversarial_breaker_v03.py             breakers/a0_research_authority_adversarial_breaker_v04.py             breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py             breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py             breakers/a0_research_authority_adversarial_breaker_v05.py             | tee /tmp/a0-current-149.txt
          grep -q "149 passed" /tmp/a0-current-149.txt
          echo "A0_CURRENT_HEAD_COMBINED_SURFACE=PASS_149_OF_149"
