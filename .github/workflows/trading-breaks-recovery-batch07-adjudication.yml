name: Trading Breaks Recovery Batch 07 Independent Adjudication

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjudicate-batch07:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering persisted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove authoritative Batch 07 runtime ancestry and immutability
        run: |
          git merge-base --is-ancestor 071c2240dc6205ee8ffc6b8a0dbd7f2bc08a8632 HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          git diff --exit-code 071c2240dc6205ee8ffc6b8a0dbd7f2bc08a8632 HEAD -- \
            reports/data-qualification/historical_trading_breaks_recovery_batch07_runtime.json \
            tools/trading_breaks_recovery_batch07.py \
            tools/trading_breaks_recovery_protocol.py \
            tools/trading_breaks_recovery_progression.py \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Adversarially break Batch 07 adjudication and parent boundaries
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch07_adjudication.py \
            tests/test_trading_breaks_recovery_batch07.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_batch06_adjudication.py \
            tests/test_trading_breaks_recovery_batch06_integration.py \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Independently adjudicate persisted Batch 07 runtime
        run: python -m tools.trading_breaks_recovery_batch07_adjudication

      - name: Assert exact final Batch 07 verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/data-qualification/historical_trading_breaks_recovery_batch07_adjudication.json').read_text(encoding='utf-8'))
          assert report['verdict'] == 'PASS'
          assert report['attempted'] == 5
          assert report['pass'] == 3
          assert report['blocked'] == 2
          assert report['fail'] == 0
          assert [x['verdict'] for x in report['adjudications']] == ['PASS', 'BLOCKED', 'BLOCKED', 'PASS', 'PASS']
          assert report['adjudications'][1]['reason'] == 'NO_EXACT_TARGET_DATE_POSITIVE_RECORD_ADMISSIBLE'
          assert report['adjudications'][1]['overlap_record_id'] == '63023'
          assert report['adjudications'][2]['reason'] == 'NO_EXACT_TARGET_DATE_POSITIVE_RECORD_ADMISSIBLE'
          assert report['adjudications'][2]['overlap_record_id'] == '63024'
          print('PASS: Batch 07 independently adjudicated 3 PASS / 2 BLOCKED / 0 FAIL')
          PY

      - name: Prove adjudication consumes persisted frozen evidence only
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/trading_breaks_recovery_batch07_adjudication.py').read_text(encoding='utf-8').lower()
          for forbidden in (
              ''.join(('play', 'wright')),
              ''.join(('chro', 'mium')),
              ''.join(('probe_', 'candidate')),
              ''.join(('eligible_', 'recovery_queue')),
              ''.join(('recovery_', 'queue()')),
          ):
              assert forbidden not in source, forbidden
          assert 'batch07_targets()' in source
          print('PASS: independent adjudication has no browser/probe/live-queue path')
          PY

      - name: Persist independent Batch 07 adjudication reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            reports/data-qualification/historical_trading_breaks_recovery_batch07_adjudication.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch07_qualification.md
          git diff --cached --check
          git commit -m 'evidence: independently adjudicate Trading Breaks Batch 07'
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
