name: Trading Breaks Recovery Batch 09 Atomic Integration

on:
  push:
    branches:
      - feat/multi-year-dukascopy-acquisition
    paths:
      - '.github/workflows/trading-breaks-recovery-batch09-integration.yml'
      - 'tools/integrate_trading_breaks_recovery_batch09.py'
      - 'tests/test_trading_breaks_recovery_batch09_integration_contract.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-batch09:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact triggering persisted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove Batch 09 adjudication checkpoint ancestry and governed pre-state immutability
        run: |
          git merge-base --is-ancestor cb2f4f53dbc118146a8fa0ab5a2f6622a0ed3828 HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          git diff --exit-code cb2f4f53dbc118146a8fa0ab5a2f6622a0ed3828 HEAD -- \
            04-REFERENCE/RECOVERY-CHECKPOINT.md \
            reports/data-qualification/current_coverage_execution_window_boundary_application.md \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            tools/trading_breaks_recovery_batch09.py \
            reports/data-qualification/historical_trading_breaks_recovery_batch09_adjudication.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch09_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Break Batch 09 integration contract before mutation
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch09_integration_contract.py \
            tests/test_trading_breaks_recovery_batch09_adjudication.py \
            tests/test_trading_breaks_recovery_batch09.py \
            tests/test_trading_breaks_recovery_batch09_freeze_contract.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_progression.py
          python - <<'PY'
          from tools.integrate_trading_breaks_recovery_batch09 import guard_preintegration_state
          guard_preintegration_state()
          print('PASS: exact pre-Batch09 integration state and anti-partial guards hold')
          PY

      - name: Prepare exact atomic Batch 09 integration in worktree
        run: python -m tools.integrate_trading_breaks_recovery_batch09

      - name: Regenerate attempt-aware progression deterministically
        run: python -m tools.trading_breaks_recovery_progression

      - name: Adversarially re-break calendar coverage progression after mutation
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_*.py \
            tests/test_dukascopy_usatech_calendar*.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Assert exact post-Batch09 integrated state
        run: |
          python - <<'PY'
          from datetime import date
          from tools.dukascopy_usatech_calendar import SPECIAL_SESSION_EVIDENCE
          from tools.dukascopy_usatech_calendar_coverage import NO_SPECIAL_CHANGE_EVIDENCE, audit_calendar_coverage
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue, load_attempt_ledger, load_material_capability_changes, progression_decisions
          from tools.trading_breaks_recovery_protocol import recovery_queue

          global_report = audit_calendar_coverage()
          window_report = audit_calendar_coverage(date(2021, 8, 14), date(2026, 8, 14))
          assert (global_report['candidate_dates'], global_report['resolved_candidate_dates'], global_report['unresolved_candidate_dates']) == (111, 57, 54)
          assert (window_report['candidate_dates'], window_report['resolved_candidate_dates'], window_report['unresolved_candidate_dates']) == (68, 34, 34)
          assert global_report['evidence_shape_errors'] == []
          assert global_report['orphan_special_evidence'] == []
          assert global_report['contradictory_evidence_dates'] == []

          _, _, attempts = load_attempt_ledger()
          batch09 = [x for x in attempts if x.attempt_id.startswith('batch09:')]
          assert len(attempts) == 45
          assert [x.attempt_sequence for x in batch09] == [41, 42, 43, 44, 45]
          assert [x.target_date for x in batch09] == [date(2024, 9, 2), date(2024, 11, 28), date(2024, 11, 29), date(2024, 12, 24), date(2024, 12, 25)]
          assert [x.outcome for x in batch09] == ['PASS', 'PASS', 'PASS', 'PASS', 'BLOCKED']
          assert batch09[-1].blocking_reason == 'NO_EXACT_TARGET_DATE_POSITIVE_RECORD_ADMISSIBLE'

          pass_days = {date(2024, 9, 2), date(2024, 11, 28), date(2024, 11, 29), date(2024, 12, 24)}
          blocked_day = date(2024, 12, 25)
          raw_days = {d for d, _ in recovery_queue()}
          eligible = eligible_recovery_queue()
          eligible_days = {d for d, _ in eligible}
          decisions = {d.target_date: d for d in progression_decisions()}
          assert pass_days <= set(SPECIAL_SESSION_EVIDENCE)
          assert pass_days.isdisjoint(raw_days)
          assert blocked_day not in SPECIAL_SESSION_EVIDENCE
          assert blocked_day not in NO_SPECIAL_CHANGE_EVIDENCE
          assert blocked_day in raw_days
          assert blocked_day not in eligible_days
          dec25 = decisions[blocked_day]
          assert dec25.latest_attempt_id == 'batch09:2024-12-25'
          assert dec25.latest_attempt_outcome == 'BLOCKED'
          assert dec25.reason == 'SAME_CAPABILITY_BLOCKED_ALREADY_ATTEMPTED'
          assert len(recovery_queue()) == len(decisions) == 34
          assert sum(not d.eligible and d.latest_attempt_outcome == 'BLOCKED' for d in decisions.values()) == 11
          assert len(eligible) == 23
          assert eligible[0] == (date(2024, 12, 31), 'NEW_YEARS_EVE_CANDIDATE')
          assert load_material_capability_changes() == []
          print('PASS: exact atomic Batch 09 integrated state = global 111/57/54, window 68/34/34, ledger 45, blocked 11, eligible 23')
          PY

      - name: Prove integration mutation surface has no browser capture or live Batch 09 selection
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('tools/integrate_trading_breaks_recovery_batch09.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          imports = set()
          calls = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.lower() for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add((node.module or '').lower())
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id.lower())
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr.lower())
          assert not any('playwright' in name or 'selenium' in name or 'chromium' in name for name in imports)
          for forbidden in ('probe_candidate', 'eligible_recovery_queue', 'recovery_queue', 'progression_decisions', 'derive_batch09_membership'):
              assert forbidden not in calls, forbidden
          assert 'batch09_targets' in calls
          print('PASS: integration executable AST uses frozen Batch 09 identity only and has no browser/capture/live-queue path')
          PY

      - name: Persist integration qualification and one atomic governed-state commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "integrate-batch09") | .id' | head -n 1)"
          export JOB_ID
          python - <<'PY'
          import os
          from pathlib import Path
          report = Path('reports/data-qualification/historical_trading_breaks_recovery_batch09_integration_qualification.md')
          report.write_text(
              '# HISTORICAL TRADING BREAKS RECOVERY — BATCH 09 ATOMIC INTEGRATION\n\n'
              '**PASS — `BATCH09_ATOMIC_CALENDAR_ATTEMPT_PROGRESSION_INTEGRATION_COHERENT`**\n\n'
              f'- integration workflow run: `{os.environ["GITHUB_RUN_ID"]}`\n'
              f'- integration job: `{os.environ.get("JOB_ID")}`\n'
              f'- trigger commit: `{os.environ["GITHUB_SHA"]}`\n'
              '- authoritative browser evidence run/job: `34993614373` / `104464228483`\n'
              '- adjudication run/job: `34995973784` / `104472165374`\n'
              '- artifact: `10406357435`\n'
              '- artifact SHA-256: `dc241bac2c214ad562b9efc5ce8f3ad16705d967c82d0bfbd51e5084323220cc`\n'
              '- exact calendar mutation: four adjudicated PASS dates only\n'
              '- exact ledger mutation: five factual attempts, sequences `41..45`\n'
              '- `2024-12-25` remains unresolved and becomes `SAME_CAPABILITY_BLOCKED_ALREADY_ATTEMPTED`\n'
              '- post-state: global `111/57/54`, window `68/34/34`, ledger `45`, BLOCKED/ineligible `11`, eligible `23`\n'
              '- material capability changes: `0`\n'
              '- no `.bi5`; no real backtest\n',
              encoding='utf-8',
          )
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/dukascopy_usatech_calendar.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch09_integration_qualification.md \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_batch02.py \
            tests/test_trading_breaks_recovery_batch03_integration.py \
            tests/test_trading_breaks_recovery_batch04_integration.py \
            tests/test_trading_breaks_recovery_batch05.py \
            tests/test_trading_breaks_recovery_batch05_integration.py \
            tests/test_trading_breaks_recovery_batch06.py \
            tests/test_trading_breaks_recovery_batch06_integration.py \
            tests/test_trading_breaks_recovery_batch07.py \
            tests/test_trading_breaks_recovery_batch07_integration.py \
            tests/test_trading_breaks_recovery_batch08.py \
            tests/test_trading_breaks_recovery_batch08_integration.py \
            tests/test_trading_breaks_recovery_batch09.py \
            tests/test_trading_breaks_recovery_batch09_freeze_contract.py \
            tests/test_dukascopy_usatech_calendar_2024_batch09.py \
            tests/test_trading_breaks_recovery_batch09_integration.py
          git diff --cached --check
          git commit -m 'evidence: atomically integrate Trading Breaks Batch 09'
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
