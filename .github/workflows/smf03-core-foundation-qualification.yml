name: SMF03 Core Foundation Qualification

on:
  push:
    branches:
      - feat/smf03-core-implementation-v0.1
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"

      - name: Verify Python
        run: python --version

      - name: Install qualification lock
        run: python -m pip install -r requirements/qualification.lock.txt

      - name: Run SMF-03 core foundation breaker
        run: python -m pytest -q breakers/smf03_core_foundation_red_breaker.py
