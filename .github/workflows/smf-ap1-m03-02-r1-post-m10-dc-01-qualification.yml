name: SMF Post-M10 DC-01 Documentary Qualification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'GOVERNANCE/SMF-AP1-M03-02-R1-POST-M10-DC-01-*.json'
      - 'reports/program/*POST-M10-DC-01*'
      - 'tests/test_smf_ap1_m03_02_r1_post_m10_dc_01.py'
      - '.github/workflows/smf-ap1-m03-02-r1-post-m10-dc-01-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: DC-01 documentary/static qualification
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_dc_01.py
      - name: PCG-02C regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_pcg_02c_adjudication.py
      - name: PCG-02B result-integrity regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_pcg_02b_result_integrity.py
      - name: DC-00 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_dc_00.py
      - name: Post-M10 governance regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_method_necessity.py
      - name: Assert no DC-01 runtime or data artifact surface
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          assert not list((root/'tools').glob('*post_m10_dc_01*'))
          art=root/'artifacts'
          if art.exists():
              assert not list(art.glob('*dc_01*'))
              assert not list(art.glob('*DC-01*'))
          PY
      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
