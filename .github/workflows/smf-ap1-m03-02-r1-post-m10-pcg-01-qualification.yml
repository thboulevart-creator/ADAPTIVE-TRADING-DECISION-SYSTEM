name: SMF Post-M10 PCG-01 Synthetic Qualification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'tools/smf_ap1_m03_02_r1_post_m10_pcg_01*.py'
      - 'tests/test_smf_ap1_m03_02_r1_post_m10_pcg_01.py'
      - 'tests/fixtures/smf_ap1_m03_02_r1_post_m10_pcg_01_synthetic_cases_v0_1.json'
      - 'GOVERNANCE/SMF-AP1-M03-02-R1-POST-M10-PCG-01-*.json'
      - 'reports/program/*POST-M10-PCG-01*'
      - '.github/workflows/smf-ap1-m03-02-r1-post-m10-pcg-01-qualification.yml'
      - 'tests/test_smf_ap1_m03_02_r1_post_m10_pcg_00.py'
      - '.github/workflows/smf-ap1-m03-02-r1-post-m10-pcg-00-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: PCG-01 targeted synthetic qualification
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_pcg_01.py
      - name: PCG-00 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_pcg_00.py
      - name: Post-M10 method-necessity regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_method_necessity.py
      - name: M10-01 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_m10_01.py
      - name: M10-00 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_m10_00.py
      - name: Assert no real PCG result or real-data surface
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          art=root/'artifacts'
          if art.exists():
              assert not list(art.glob('*pcg_01*'))
              assert not list(art.glob('*PCG-01*'))
          for path in [
              root/'tools'/'smf_ap1_m03_02_r1_post_m10_pcg_01.py',
              root/'tools'/'smf_ap1_m03_02_r1_post_m10_pcg_01_reference.py',
          ]:
              src=path.read_text(encoding='utf-8').lower()
              for forbidden in ('m03-r1-real','m10_real_result','atds-control','oos data path'):
                  assert forbidden not in src
          PY
      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
