name: RVO-10 Single AP1 Retry Qualification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'GOVERNANCE/RVO-10-*'
      - 'tools/rvo_10_single_ap1_retry.py'
      - 'tests/test_rvo_10_single_ap1_retry.py'
      - 'reports/program/*RVO-10*'
      - '.github/workflows/rvo-10-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: RVO-10 controller tests
        run: python -m pytest -q tests/test_rvo_10_single_ap1_retry.py
      - name: RVO-09 regression
        run: python -m pytest -q tests/test_rvo_09_pre_retry_requalification.py
      - name: RVO-08F regression
        run: python -m pytest -q tests/test_rvo_08f_runtime_repair.py
      - name: P1-21 regression
        run: |
          python -m pytest -q breakers/p1_21_real_producer_capability_breaker.py
          python -m pytest -q tests/test_p1_21_real_producer_capability.py
      - name: RVO-08 regression
        run: python -m pytest -q tests/test_rvo_08_single_ap1_execution.py
      - name: RVO-07 regression
        run: |
          python -m pytest -q breakers/rvo_07_pre_execution_requalification_breaker.py
          python -m pytest -q tests/test_rvo_07_pre_execution_requalification.py
      - name: G05 regression
        run: |
          python -m pytest -q breakers/g05_01_workspace_dry_readiness_breaker.py
          python -m pytest -q tests/test_g05_01_workspace_dry_readiness.py
      - name: SMF regression
        run: |
          python -m pytest -q breakers/smf_ap1_m03_01_binding_breaker.py
          python -m pytest -q tests/test_smf_ap1_m03_01_binding.py
      - name: DATA-02 regression
        run: python -m pytest -q breakers/data_02_claim_scoped_admission_breaker.py
      - name: Static execution boundary
        run: |
          test "$(git hash-object tools/ap1_intraday_spread_census.py)" = "9f613063fb8a190a1ff6f2f8b12c97c4ed97712a"
          test "$(grep -F 'cp = subprocess.run(' tools/rvo_10_single_ap1_retry.py | wc -l)" -ge 1
          echo "PASS: workflow does not invoke AP1"
      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
