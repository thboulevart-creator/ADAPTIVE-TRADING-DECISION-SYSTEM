name: E1-08A Synthetic Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/e1-08a-synthetic-qualification.yml'
      - 'GOVERNANCE/E1-08A-ONE-SHOT-REAL-E1-CONTRACT-V0.1.json'
      - 'breakers/e1_08_one_shot_real_e1_red_breaker.py'
      - 'tools/e1_08_one_shot_real_e1.py'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  PYTEST_ADDOPTS: '-p no:cacheprovider'
  TZ: 'UTC'
  LANG: 'C.UTF-8'
  LC_ALL: 'C.UTF-8'

jobs:
  e1-08a-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install locked qualification environment
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Compile E1-08A executor
        run: python -m py_compile tools/e1_08_one_shot_real_e1.py

      - name: Run frozen E1-08A breaker
        run: python -m pytest -q breakers/e1_08_one_shot_real_e1_red_breaker.py

      - name: Re-break protected E1 executable chain
        run: |
          python -m pytest -q             breakers/e1_03_h1_dataset_identity_red_breaker.py             breakers/e1_04_execution_cost_model_red_breaker.py             breakers/e1_05_minimal_momentum_runner_red_breaker.py             breakers/e1_06_adversarial_reference_parity_red_breaker.py             breakers/e1_07_preflight_reproducibility_trace_red_breaker.py             breakers/e1_08_one_shot_real_e1_red_breaker.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
