name: Native BI5 F Freeze Persistence Adversarial

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/native-bi5-f-freeze-persistence-adversarial.yml'
      - 'src/native_bi5_freeze_persistence.py'
      - 'breakers/native_bi5_f_freeze_persistence_breaker.py'
      - 'breakers/native_bi5_f_freeze_persistence_adversarial.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  F_SOURCE_BLOB: 'f43e2789cbc2dc3d4c6210091aa65701d834722a'
  F_FROZEN_BREAKER_BLOB: '3d9eb75c2f4e988c984da67af0af344d3dc24148'
  F_ADVERSARIAL_BREAKER_BLOB: 'c4c499d5e76e15a8fdcaeb91dde80beadad6487a'

jobs:
  adversarial-f:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted F candidate and breakers
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object src/native_bi5_freeze_persistence.py)" = "${F_SOURCE_BLOB}"
          test "$(git hash-object breakers/native_bi5_f_freeze_persistence_breaker.py)" = "${F_FROZEN_BREAKER_BLOB}"
          test "$(git hash-object breakers/native_bi5_f_freeze_persistence_adversarial.py)" = "${F_ADVERSARIAL_BREAKER_BLOB}"

      - name: Prove O implementation remains absent
        run: |
          test ! -e src/native_bi5_semantic_universe_comparator.py
          test ! -e src/native_bi5_oracle.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Re-run frozen F breaker
        run: python -m pytest -q breakers/native_bi5_f_freeze_persistence_breaker.py

      - name: Execute supplemental F adversarial breaker
        run: python -m pytest -q breakers/native_bi5_f_freeze_persistence_adversarial.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
