name: Native BI5 Q-RM-12 Handoff Adversarial

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/native-bi5-qrm12-handoff-adversarial.yml'
      - 'src/native_bi5_qrm12_handoff.py'
      - 'breakers/native_bi5_qrm12_handoff_adversarial.py'
      - 'src/native_bi5_reference_qualifier_qrm12.py'
      - 'src/native_bi5_independent_qualifier_qrm12.py'
      - 'breakers/native_bi5_qrm12_compatibility_breaker.py'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

  HANDOFF_SOURCE_BLOB: '95d5fcf0a70757abcb2509363b7b03fdea785c71'
  HANDOFF_ADVERSARIAL_BLOB: '59c6f976e72f112c8450de6ac4ba23cff159ba78'
  IA_V02_SOURCE_BLOB: 'cab85272bc5a2e229f56f1e02e624d68dc84ce29'
  IB_V02_SOURCE_BLOB: '6d14704548861c13dfc809adad6ae7a21e31c2ca'
  QRM12_BREAKER_BLOB: '967ab86d517cc8736344bb27154641eb9bac7996'

jobs:
  adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact technical identities
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object src/native_bi5_qrm12_handoff.py)" = "${HANDOFF_SOURCE_BLOB}"
          test "$(git hash-object breakers/native_bi5_qrm12_handoff_adversarial.py)" = "${HANDOFF_ADVERSARIAL_BLOB}"
          test "$(git hash-object src/native_bi5_reference_qualifier_qrm12.py)" = "${IA_V02_SOURCE_BLOB}"
          test "$(git hash-object src/native_bi5_independent_qualifier_qrm12.py)" = "${IB_V02_SOURCE_BLOB}"
          test "$(git hash-object breakers/native_bi5_qrm12_compatibility_breaker.py)" = "${QRM12_BREAKER_BLOB}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Collect handoff adversarial breaker
        run: python -m pytest --collect-only -q breakers/native_bi5_qrm12_handoff_adversarial.py

      - name: Execute handoff adversarial breaker
        run: python -m pytest -q breakers/native_bi5_qrm12_handoff_adversarial.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
