name: SMF AP1 M03-02 R1 M10-01 Real Qualification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'artifacts/smf_ap1_m03_02_r1_m10_01/**'
      - 'tests/test_smf_ap1_m03_02_r1_m10_01.py'
      - 'reports/program/*SMF-AP1-M03-02-R1-M10-01*'
      - '.github/workflows/smf-ap1-m03-02-r1-m10-01-real-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: M10-01 persisted real-result qualification
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_m10_01.py
      - name: M10-00 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_m10_00.py
      - name: M01 CR1 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_m01_01_cr1.py
      - name: M01 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_m01_01.py
      - name: SI-01 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_si01.py
      - name: EF-01 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_ef01.py
      - name: Assert no global verdict or authority expansion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/smf_ap1_m03_02_r1_m10_01')
          r=json.loads((p/'REAL_M10_RESULT.json').read_text())
          m=json.loads((p/'RUN_MANIFEST.json').read_text())
          forbidden={'global_verdict','global_pass','global_fail','overall_stable','overall_unstable','strategy_valid','strategy_invalid'}
          assert forbidden.isdisjoint(r)
          assert r['authority']['trading'] is False
          assert r['authority']['capital'] is False
          assert m['scientific_adjudication']=='PENDING_HUMAN_DECISION'
          PY
      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
