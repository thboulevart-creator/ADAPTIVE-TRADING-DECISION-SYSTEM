name: Native BI5 I_A Reference Qualifier Candidate

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/native-bi5-ia-reference-qualifier-candidate.yml'
      - 'breakers/native_bi5_ia_reference_qualifier_breaker.py'
      - 'src/native_bi5_reference_qualifier.py'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  IA_BREAKER_BLOB: '64d3a391e1b5cb5aecfdf926551acd3ee5f0d7dd'
  IA_SOURCE_BLOB: '9ac0e27b1104fae972124946c876f2170300a9d7'

jobs:
  qualify-ia-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD and immutable breaker/candidate blobs
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object breakers/native_bi5_ia_reference_qualifier_breaker.py)" = "${IA_BREAKER_BLOB}"
          test "$(git hash-object src/native_bi5_reference_qualifier.py)" = "${IA_SOURCE_BLOB}"

      - name: Prove I_A exists and I_B is still absent
        run: |
          test -f src/native_bi5_reference_qualifier.py
          test ! -e src/native_bi5_independent_qualifier.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Execute frozen I_A breaker
        run: python -m pytest -q breakers/native_bi5_ia_reference_qualifier_breaker.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
