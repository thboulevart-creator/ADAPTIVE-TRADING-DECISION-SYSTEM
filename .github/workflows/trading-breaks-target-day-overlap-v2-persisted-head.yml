name: Trading Breaks Target-Day Overlap V2 Persisted HEAD Re-break

on:
  push:
    branches: [feat/multi-year-dukascopy-acquisition]
    paths:
      - '.github/workflows/trading-breaks-target-day-overlap-v2-persisted-head.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering persisted HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove V2 activation ancestry and verifier-only delta
        run: |
          git merge-base --is-ancestor 31b285a30f5648e1f3979ed8847c5a2c8c7a022c HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          test "$(git diff --name-only 31b285a30f5648e1f3979ed8847c5a2c8c7a022c HEAD)" = ".github/workflows/trading-breaks-target-day-overlap-v2-persisted-head.yml"
          git diff --exit-code 31b285a30f5648e1f3979ed8847c5a2c8c7a022c HEAD -- \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-break V2 current-state and semantic contracts
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q \
            tests/test_trading_breaks_target_day_overlap_semantics.py \
            tests/test_trading_breaks_target_day_overlap_v2_state.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_coverage_execution_window_boundary.py \
            tests/test_dukascopy_usatech_calendar*.py
          python -m pytest -q tests/test_trading_breaks_recovery_progression.py -k \
            'not test_attempt_ledger_preserves_all_forty_five_historical_attempts_and_duplicate_history and not test_material_capability_change_registry_is_versioned_and_currently_empty and not test_unchanged_capability_forbids_replay_of_historical_blocked_dates and not test_current_capability_is_exhausted_after_terminal_batch and not test_new_run_artifact_or_probe_commit_cannot_change_semantic_capability'

      - name: Assert exact persisted V2 activation state
        run: |
          python - <<'PY'
          from datetime import date
          from tools.activate_trading_breaks_target_day_overlap_capability import NEW_CAPABILITY_ID, NEW_FINGERPRINT, OLD_CAPABILITY_ID, OLD_FINGERPRINT
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue, load_attempt_ledger, load_material_capability_changes, progression_decisions
          from tools.trading_breaks_recovery_protocol import recovery_queue
          from tools.trading_breaks_target_day_overlap_semantics import CLASS_A_SOURCES

          capabilities, current_id, attempts = load_attempt_ledger()
          assert current_id == NEW_CAPABILITY_ID
          assert capabilities[OLD_CAPABILITY_ID].fingerprint() == OLD_FINGERPRINT
          assert capabilities[NEW_CAPABILITY_ID].fingerprint() == NEW_FINGERPRINT
          assert len(attempts) == 68
          assert [item.attempt_sequence for item in attempts] == list(range(1,69))
          assert len({item.attempt_id for item in attempts}) == 68
          changes = load_material_capability_changes()
          assert len(changes) == 1
          change = changes[0]
          assert change.from_fingerprint == OLD_FINGERPRINT
          assert change.to_fingerprint == NEW_FINGERPRINT
          assert change.changed_dimensions == frozenset({'protocol_contract','proof_capabilities'})
          assert change.added_proof_capabilities == frozenset({'QUALIFIED_CROSS_DATE_INTERVAL_ATTRIBUTION'})
          assert change.addresses_blocking_reasons == frozenset({'NO_EXACT_TARGET_DATE_POSITIVE_RECORD_ADMISSIBLE'})
          assert len(recovery_queue()) == 17
          expected = sorted((day, reason) for day, reason, _ in CLASS_A_SOURCES)
          assert eligible_recovery_queue() == expected
          decisions = {item.target_date: item for item in progression_decisions()}
          for day, reason, _ in CLASS_A_SOURCES:
              d = decisions[day]
              assert d.candidate_reason == reason
              assert d.eligible is True
              assert d.reason == 'MATERIAL_CAPABILITY_CHANGE_RETRY'
          for day in (date(2021,12,31), date(2022,7,1), date(2026,7,2)):
              d = decisions[day]
              assert d.eligible is False
              assert d.reason == 'RETRY_MATERIAL_CHANGE_NOT_PROVEN:BLOCKING_REASON_NOT_EXPLICITLY_ADDRESSED'
          print('PASS: persisted V2 activation exactly preserves 68 attempts and exposes 14/3 retry split')
          PY

      - name: Prove byte-stable progression and clean read-only verifier
        run: |
          BEFORE="$(sha256sum reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json | awk '{print $1}')"
          python -m tools.trading_breaks_recovery_progression >/tmp/v2-persisted.json
          AFTER="$(sha256sum reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'PASS: persisted V2 activation verifier remained strictly read-only'
