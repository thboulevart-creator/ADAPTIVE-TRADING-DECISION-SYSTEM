name: Trading Breaks Recovery Batch 05 Atomic Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-batch05:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: feat/multi-year-dukascopy-acquisition
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify checkpoint ancestry and untouched pre-integration state
        run: |
          git merge-base --is-ancestor e8f3d594a7f2cdd9261664723f6d9056d40b8bcd HEAD
          python - <<'PY'
          from tools.integrate_trading_breaks_recovery_batch05 import (
              guard_preintegration_state,
              load_authoritative_adjudication,
          )
          load_authoritative_adjudication()
          guard_preintegration_state()
          print('PASS: Batch 05 adjudication authoritative and executable state still pre-integration')
          PY

      - name: Install pytest
        run: python -m pip install pytest==8.4.2

      - name: Adversarially qualify integration contract before mutation
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch05_integration_contract.py \
            tests/test_trading_breaks_recovery_batch05_adjudication.py \
            tests/test_trading_breaks_recovery_batch05.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_protocol.py

      - name: Prepare calendar ledger tests atomically in worktree
        run: python -m tools.integrate_trading_breaks_recovery_batch05

      - name: Regenerate deterministic progression runtime from integrated worktree
        run: python -m tools.trading_breaks_recovery_progression

      - name: Adversarial regression before atomic commit
        run: |
          python -m pytest -q \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_dukascopy_usatech_calendar_2022_batch02.py \
            tests/test_dukascopy_usatech_calendar_2022_batch03.py \
            tests/test_dukascopy_usatech_calendar_2022_batch04.py \
            tests/test_dukascopy_usatech_calendar_2023_batch05.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_batch01.py \
            tests/test_trading_breaks_recovery_batch02.py \
            tests/test_trading_breaks_recovery_batch03.py \
            tests/test_trading_breaks_recovery_batch03_adjudication.py \
            tests/test_trading_breaks_recovery_batch03_integration.py \
            tests/test_trading_breaks_recovery_batch04.py \
            tests/test_trading_breaks_recovery_batch04_adjudication.py \
            tests/test_trading_breaks_recovery_batch04_integration.py \
            tests/test_trading_breaks_recovery_batch05.py \
            tests/test_trading_breaks_recovery_batch05_adjudication.py \
            tests/test_trading_breaks_recovery_batch05_integration_contract.py \
            tests/test_trading_breaks_recovery_batch05_integration.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Assert exact integrated worktree accounting and historical blocked semantics
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from tools.dukascopy_usatech_calendar import SPECIAL_SESSION_EVIDENCE
          from tools.dukascopy_usatech_calendar_coverage import audit_calendar_coverage
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue, load_attempt_ledger, progression_decisions
          from tools.trading_breaks_recovery_protocol import recovery_queue

          global_report = audit_calendar_coverage()
          window = audit_calendar_coverage(date(2021, 8, 14), date(2026, 8, 14))
          _, _, attempts = load_attempt_ledger()
          progression = json.load(open('reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json', encoding='utf-8'))
          raw_days = {d for d, _ in recovery_queue()}
          eligible_days = {d for d, _ in eligible_recovery_queue()}
          decisions = {d.target_date: d for d in progression_decisions()}

          assert (global_report['candidate_dates'], global_report['resolved_candidate_dates'], global_report['unresolved_candidate_dates']) == (111, 42, 69)
          assert (window['candidate_dates'], window['resolved_candidate_dates'], window['unresolved_candidate_dates']) == (68, 19, 49)
          assert len(attempts) == 25
          assert [x.attempt_sequence for x in attempts if x.attempt_id.startswith('batch05:')] == [21, 22, 23, 24, 25]
          assert [x.outcome for x in attempts if x.attempt_id.startswith('batch05:')] == ['PASS'] * 5
          assert len(recovery_queue()) == 49
          assert progression['verdict'] == 'PASS'
          assert progression['calendar_unresolved_count'] == 49
          assert progression['attempt_ledger_count'] == 25
          assert progression['attempted_blocked_ineligible_count'] == 6
          assert progression['eligible_initial_or_retry_count'] == 43

          pass_days = {date(2023, 1, 16), date(2023, 2, 20), date(2023, 4, 7), date(2023, 5, 29), date(2023, 6, 19)}
          blocked_days = {date(2021, 12, 24), date(2021, 12, 31), date(2022, 4, 15), date(2022, 7, 1), date(2022, 12, 26), date(2023, 1, 2)}
          assert pass_days <= set(SPECIAL_SESSION_EVIDENCE)
          assert pass_days.isdisjoint(raw_days)
          assert blocked_days <= raw_days
          assert blocked_days.isdisjoint(eligible_days)
          for day in blocked_days:
              assert decisions[day].reason == 'SAME_CAPABILITY_BLOCKED_ALREADY_ATTEMPTED'
              assert decisions[day].latest_attempt_outcome == 'BLOCKED'
              assert decisions[day].contract_verdict == 'PASS'
          print('PASS: worktree Batch 05 integration coherent; 49 unresolved / 25 attempts / 6 blocked-ineligible / 43 eligible')
          PY

      - name: Write integration qualification report
        run: |
          cat > reports/data-qualification/historical_trading_breaks_recovery_batch05_integration_qualification.md <<EOF
          # HISTORICAL TRADING BREAKS RECOVERY — BATCH 05 ATOMIC INTEGRATION QUALIFICATION

          **PASS — \`BATCH05_ATOMIC_CALENDAR_ATTEMPT_PROGRESSION_INTEGRATION_COHERENT\`**

          Source adjudication:
          - browser run: \`34947146056\`
          - job: \`104309150262\`
          - artifact: \`10386998786\`
          - artifact SHA-256: \`ad96e1850ca53910c092abd444f02a04e2a84ea192fa6c0b5189a7e349ea800c\`
          - probe commit: \`33ae476c48372bce64421a411066db2ddea6125c\`

          Integration workflow run: \`${GITHUB_RUN_ID}\`
          Pre-integration execution SHA: \`${GITHUB_SHA}\`

          Atomic mutation authorized and proven:
          - calendar PASS additions only: \`2023-01-16\`, \`2023-02-20\`, \`2023-04-07\`, \`2023-05-29\`, \`2023-06-19\`;
          - five factual Batch 05 PASS attempts appended as sequences \`21..25\`;
          - progression runtime regenerated from the integrated worktree;
          - all six historical same-capability BLOCKED dates remain unresolved and execution-ineligible;
          - no material capability change registered;
          - no negative-evidence promotion.

          Proven post-integration accounting:
          - global calendar: \`111 / 42 resolved / 69 unresolved / 0 FAIL\`;
          - execution-window candidate: \`68 / 19 resolved / 49 unresolved / 0 FAIL\`;
          - attempt ledger: \`25\`;
          - attempted BLOCKED execution-ineligible: \`6\`;
          - execution-eligible unresolved: \`43\`.

          This qualification does not authorize massive \`.bi5\` acquisition or any real backtest.
          EOF

      - name: Persist one atomic Batch 05 integration commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/dukascopy_usatech_calendar.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch05_integration_qualification.md \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_batch02.py \
            tests/test_trading_breaks_recovery_batch03_integration.py \
            tests/test_trading_breaks_recovery_batch04_integration.py \
            tests/test_trading_breaks_recovery_batch05.py \
            tests/test_dukascopy_usatech_calendar_2023_batch05.py \
            tests/test_trading_breaks_recovery_batch05_integration.py
          git diff --cached --check
          git commit -m 'evidence: atomically integrate Trading Breaks Batch 05'
          echo "INTEGRATION_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
