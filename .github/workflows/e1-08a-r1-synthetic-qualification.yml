name: E1-08A-R1 Synthetic Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/e1-08a-r1-synthetic-qualification.yml'
      - 'GOVERNANCE/E1-08A-R1-AUTHORITY-REAL-RUN-CLOSURE-CONTRACT-V0.1.json'
      - 'breakers/e1_08a_r1_authority_real_run_red_breaker.py'
      - 'tools/e1_08a_r1_real_run.py'
      - 'requirements/e1_08a_r1_real_run.lock.txt'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  PYTHONPYCACHEPREFIX: '/tmp/e1-r1-pycache'
  PYTEST_ADDOPTS: '-p no:cacheprovider'
  TZ: 'UTC'
  LANG: 'C.UTF-8'
  LC_ALL: 'C.UTF-8'

jobs:
  e1-08a-r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind exact persisted identity
        run: |
          echo "E1_R1_EXPECTED_HEAD=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "E1_R1_EXPECTED_TREE=$(git rev-parse HEAD^{tree})" >> "${GITHUB_ENV}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
          python -m pip install --disable-pip-version-check --no-deps -r requirements/e1_08a_r1_real_run.lock.txt
          python - <<'PY'
          import platform, pyarrow
          assert platform.python_version() == "3.12.14"
          assert pyarrow.__version__ == "25.0.1"
          print("R1_ENVIRONMENT=PASS")
          PY

      - name: Run frozen R1 breaker
        run: python -m pytest -q breakers/e1_08a_r1_authority_real_run_red_breaker.py

      - name: Re-break existing Q8
        if: success()
        run: python -m pytest -q breakers/e1_08_one_shot_real_e1_red_breaker.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
