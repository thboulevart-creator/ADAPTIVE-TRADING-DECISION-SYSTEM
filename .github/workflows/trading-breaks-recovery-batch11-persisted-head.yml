name: Trading Breaks Recovery Batch 11 Persisted HEAD Re-break

on:
  push:
    branches: [feat/multi-year-dukascopy-acquisition]
    paths: ['.github/workflows/trading-breaks-recovery-batch11-persisted-head.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove ancestry and verifier-only delta
        run: |
          git merge-base --is-ancestor 524a9a235e3af5dc59d455138427c68578b37942 HEAD
          git merge-base --is-ancestor 4be30ed9c5b8e7e1dd53663192a001ac027bb578 HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          test "$(git diff --name-only 4be30ed9c5b8e7e1dd53663192a001ac027bb578 HEAD)" = ".github/workflows/trading-breaks-recovery-batch11-persisted-head.yml"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-break governed and adversarial regression
        run: |
          python -m pip install pytest==8.4.2
          mapfile -t TESTS < <(find tests -maxdepth 1 -type f \( -name 'test_trading_breaks_recovery_*.py' -o -name 'test_dukascopy_usatech_calendar*.py' -o -name 'test_coverage_execution_window_boundary.py' \) ! -name '*_integration_contract.py' | sort)
          python -m pytest -q "${TESTS[@]}"

      - name: Assert exact persisted Batch 11 state and provenance
        run: |
          python - <<'PY'
          from datetime import date
          from tools.dukascopy_usatech_calendar import SPECIAL_SESSION_EVIDENCE
          from tools.dukascopy_usatech_calendar_coverage import audit_calendar_coverage
          from tools.trading_breaks_recovery_progression import (
              eligible_recovery_queue,
              load_attempt_ledger,
              load_material_capability_changes,
              progression_decisions,
          )
          from tools.trading_breaks_recovery_protocol import recovery_queue

          expected = {
              date(2025, 5, 26): ('81578', frozenset(range(17, 22))),
              date(2025, 6, 19): ('82497', frozenset(range(17, 22))),
              date(2025, 7, 3): ('83303', frozenset(range(17, 22))),
              date(2025, 7, 4): ('83304', frozenset(range(17, 24))),
              date(2025, 9, 1): ('84407', frozenset(range(17, 22))),
          }

          assert set(expected).issubset(SPECIAL_SESSION_EVIDENCE)
          for day, (record_id, hours) in expected.items():
              rec = SPECIAL_SESSION_EVIDENCE[day]
              assert rec['broker_record_id'] == record_id
              assert rec['fully_closed_hours_utc'] == hours
              assert rec['artifact_id'] == 10412379849
              assert rec['artifact_sha256'] == 'f5bf2a2ee5cc7e2cb535266cd918cabfeedd1eb04ad59d518912b02c31276ef2'
              assert rec['probe_commit'] == '7b5bbef03db35bf954c9a96364dba84d11b2fc94'

          _, _, attempts = load_attempt_ledger()
          batch11 = [x for x in attempts if x.attempt_id.startswith('batch11:')]
          assert len(attempts) == 55
          assert len(batch11) == 5
          assert [x.attempt_sequence for x in batch11] == [51, 52, 53, 54, 55]
          assert [x.outcome for x in batch11] == ['PASS'] * 5
          assert all(x.provenance['workflow_run'] == 35009400933 for x in batch11)
          assert all(x.provenance['job_id'] == 104517277101 for x in batch11)
          assert all(x.provenance['artifact_id'] == 10412379849 for x in batch11)
          assert all(x.provenance['artifact_sha256'] == 'f5bf2a2ee5cc7e2cb535266cd918cabfeedd1eb04ad59d518912b02c31276ef2' for x in batch11)
          assert all(x.provenance['probe_commit'] == '7b5bbef03db35bf954c9a96364dba84d11b2fc94' for x in batch11)
          assert load_material_capability_changes() == []

          global_audit = audit_calendar_coverage()
          window_audit = audit_calendar_coverage(date(2021, 8, 14), date(2026, 8, 14))
          assert (
              global_audit['candidate_dates'],
              global_audit['resolved_candidate_dates'],
              global_audit['unresolved_candidate_dates'],
          ) == (111, 65, 46)
          assert (
              window_audit['candidate_dates'],
              window_audit['resolved_candidate_dates'],
              window_audit['unresolved_candidate_dates'],
          ) == (68, 42, 26)

          decisions = progression_decisions()
          eligible = eligible_recovery_queue()
          assert len(recovery_queue()) == len(decisions) == 26
          assert sum((not x.eligible) and x.latest_attempt_outcome == 'BLOCKED' for x in decisions) == 13
          assert len(eligible) == 13
          assert eligible[0] == (date(2025, 11, 27), 'THANKSGIVING_DAY')
          print('PASS: exact persisted Batch 11 state and provenance')
          PY

      - name: Prove byte-stable progression
        run: |
          BEFORE="$(sha256sum reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json | awk '{print $1}')"
          python -m tools.trading_breaks_recovery_progression >/tmp/b11.json
          AFTER="$(sha256sum reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"

      - name: Prove read-only clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
