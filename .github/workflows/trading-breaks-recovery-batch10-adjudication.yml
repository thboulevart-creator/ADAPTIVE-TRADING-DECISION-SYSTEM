name: Trading Breaks Recovery Batch 10 Independent Adjudication

on:
  push:
    branches:
      - feat/multi-year-dukascopy-acquisition
    paths:
      - '.github/workflows/trading-breaks-recovery-batch10-adjudication.yml'
      - 'tools/trading_breaks_recovery_batch10_adjudication.py'
      - 'tests/test_trading_breaks_recovery_batch10_adjudication.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  adjudicate-batch10:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact triggering persisted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove execution checkpoint ancestry and adjudication-only preparation delta
        run: |
          git merge-base --is-ancestor 5eef199d09edb0c467d856746daaf0d89535f682 HEAD
          git merge-base --is-ancestor 1134f96517157647d7663ce1ebaf045267e78bcb HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/trading-breaks-recovery-batch10-adjudication.yml',
              'tests/test_trading_breaks_recovery_batch10_adjudication.py',
              'tools/trading_breaks_recovery_batch10_adjudication.py',
          }
          actual = set(subprocess.check_output([
              'git', 'diff', '--name-only',
              '5eef199d09edb0c467d856746daaf0d89535f682', 'HEAD'
          ], text=True).splitlines())
          assert actual == expected, (actual, expected)
          print('PASS: only Batch 10 offline adjudication preparation changed since execution checkpoint')
          PY
          git diff --exit-code 5eef199d09edb0c467d856746daaf0d89535f682 HEAD -- \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch10_runtime.json \
            tools/trading_breaks_recovery_batch10.py

      - name: Verify authoritative execution provenance externally through GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/35004172846 --jq '.id')" = "35004172846"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/35004172846 --jq '.conclusion')" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/35004172846 --jq '.head_sha')" = "443b3696e4e2740a54354787de231c886f90b26e"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/35004172846/jobs --jq '.jobs[] | select(.id == 104499660140) | .conclusion')" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/35004172846/artifacts --jq '.artifacts[] | select(.id == 10411022092) | .digest')" = "sha256:1572cc5a1c38998f59d32e107b1bcb006a74b288fe32c70ffe019726b3ad5f14"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/35004172846/artifacts --jq '.artifacts[] | select(.id == 10411022092) | .size_in_bytes')" = "3796617"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/35004172846/artifacts --jq '.artifacts[] | select(.id == 10411022092) | .expired')" = "false"
          echo 'PASS: external GitHub run/job/artifact/digest provenance matches persisted runtime'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-break complete governed and Batch 10 adjudication regression offline
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q \
            tests/test_trading_breaks_recovery_*.py \
            tests/test_dukascopy_usatech_calendar*.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Prove adjudicator has no browser probe or live membership selection path
        run: |
          python - <<'PY'
          import ast
          import inspect
          import tools.trading_breaks_recovery_batch10_adjudication as module
          source = inspect.getsource(module)
          tree = ast.parse(source)
          imports = set()
          calls = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.lower() for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add((node.module or '').lower())
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id.lower())
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr.lower())
          assert not any(token in name for name in imports for token in ('playwright', 'selenium', 'requests', 'httpx'))
          for forbidden in ('probe_candidate', 'eligible_recovery_queue', 'recovery_queue', 'progression_decisions', 'derive_batch10_membership'):
              assert forbidden not in calls, forbidden
          assert 'batch10_targets' in calls
          assert 'validate_positive_recovery_against_frozen_batch' in calls
          print('PASS: Batch 10 adjudicator is strictly offline and frozen-membership only')
          PY

      - name: Independently adjudicate persisted Batch 10 runtime
        run: python -m tools.trading_breaks_recovery_batch10_adjudication

      - name: Assert exact independent verdict and anti-promotion boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/data-qualification/historical_trading_breaks_recovery_batch10_adjudication.json').read_text())
          assert report['verdict'] == 'PASS'
          assert report['reason'] == 'BATCH10_POSITIVE_RECORDS_INDEPENDENTLY_ADJUDICATED_WITH_NO_CROSS_DATE_OR_MISSING_DOM_PROMOTION'
          assert (report['attempted'], report['pass'], report['blocked'], report['fail']) == (5, 3, 2, 0)
          items = report['adjudications']
          assert [item['verdict'] for item in items] == ['PASS', 'BLOCKED', 'PASS', 'PASS', 'BLOCKED']
          assert items[0]['broker_record_id'] == '75799'
          assert items[0]['fully_closed_hours_utc'] == [22, 23]
          assert items[1]['broker_record_id'] == '75799'
          assert items[1]['reason'] == 'NO_EXACT_TARGET_DATE_POSITIVE_RECORD_ADMISSIBLE'
          assert items[1]['capture_verdict'] == 'CAPTURED'
          assert items[2]['broker_record_id'] == '76806'
          assert items[2]['fully_closed_hours_utc'] == [18, 19, 20, 21, 22]
          assert items[3]['broker_record_id'] == '78513'
          assert items[3]['fully_closed_hours_utc'] == [18, 19, 20, 21, 22]
          assert items[4]['broker_record_id'] == '80057'
          assert items[4]['reason'] == 'NO_EXACT_TARGET_DATE_POSITIVE_RECORD_ADMISSIBLE'
          assert items[4]['capture_verdict'] == 'BLOCKED'
          assert items[4]['capture_reason'] == 'EXPECTED_DOM_CROSSCHECK_MISSING'
          assert items[4]['dom_witness_present'] is False
          print('PASS: Batch 10 independent adjudication is exactly 3 PASS / 2 BLOCKED / 0 FAIL')
          PY

      - name: Prove adjudication did not mutate governed executable state
        run: |
          git diff --exit-code 5eef199d09edb0c467d856746daaf0d89535f682 HEAD -- \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch10_runtime.json

      - name: Persist independent adjudication reports only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            reports/data-qualification/historical_trading_breaks_recovery_batch10_adjudication.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch10_qualification.md
          git diff --cached --check
          git commit -m 'evidence: independently adjudicate Trading Breaks Batch 10'
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
