name: DATA-01 Documentary Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/data-01-documentary-qualification.yml'
      - 'GOVERNANCE/DATA-01-*'
      - 'breakers/data_01_documentary_static_breaker.py'
      - 'reports/program/*DATA-01*'
      - 'GOVERNANCE/RVO-04-*'
      - 'src/data/dataset_admissibility.py'
      - 'src/data/tick_reader.py'
      - 'tools/ap0_ustech_profile_minute_core.py'
      - 'tools/ap1_intraday_spread_census.py'
      - 'tools/e1_03_h1_dataset_identity.py'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  DATA01_PARENT: '1a4ea7f19a4bdee0cd632f8f42adb40fa1f0fe86'

jobs:
  data-01:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD and DATA-01 ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${DATA01_PARENT}" HEAD

      - name: Prove frozen RVO-04 identities
        run: |
          test "$(git hash-object GOVERNANCE/RVO-04-CLAIM-CLASS-TAXONOMY-V0.1.json)" = "1fa07fb4b262bfc2a867e66914ce4221cdcd1f79"
          test "$(git hash-object GOVERNANCE/RVO-04-CLAIM-CAPABILITY-GRAPH-V0.1.json)" = "fcd723a30bad063471d7a399c06464b580c87e77"
          test "$(git hash-object GOVERNANCE/RVO-04-OWNER-GAP-PRIORITIZATION-V0.1.json)" = "4c5720b593fc8e955103c55b9ab37b5e6c3e83da"
          test "$(git hash-object GOVERNANCE/RVO-04-REAL-EXPERIMENT-READINESS-DESIGN-V0.1.md)" = "3f6875e1a1a1aa36396d10c43eae25478963a48a"
          test "$(git hash-object reports/program/2026-10-04-RVO-04-CLAIM-ROUTING-READINESS-QUALIFICATION-RECEIPT-V0.1.json)" = "47fcd31c68220054eede4e5f297a415ad5165f7c"
          test "$(git hash-object reports/program/2026-10-04-RVO-04-CLAIM-ROUTING-READINESS-QUALIFICATION.md)" = "60dc4b5717e629d1d50361b46d3ddda8f079076b"

      - name: Prove inspected Data identities remain exact
        run: |
          test "$(git hash-object tools/ap0_ustech_profile_minute_core.py)" = "42fcb38809a1cc0365cd4027fae5154e1d6d3b4f"
          test "$(git hash-object tools/ap1_intraday_spread_census.py)" = "9f613063fb8a190a1ff6f2f8b12c97c4ed97712a"
          test "$(git hash-object reports/program/2026-09-25-AP0-USTECH-PROFILE-MINUTE-CORE-ADJUDICATION.md)" = "94bba3315e3569993623b8cd2a2bf4264f4ab6f8"
          test "$(git hash-object reports/data-qualification/source_b_price_core_data_truth_closure_2026-09-25.md)" = "62e9bd1e0892dab7273eed35c8704a9e05611112"
          test "$(git hash-object reports/program/2026-09-28-E1-03-REAL-H1-QUALIFICATION.md)" = "534233d63a01c42c6b4de8979cca8dcb2feb7bc7"
          test "$(git hash-object tools/e1_03_h1_dataset_identity.py)" = "38d481755e00ce3c2ed9c66c4db710500ca0911a"
          test "$(git hash-object src/data/dataset_admissibility.py)" = "63f629a8cf39c79b5334015e038b70771c39f78b"
          test "$(git hash-object src/data/tick_reader.py)" = "ee80355504e14e1ac7f70b7481b3e9a980d7dc30"
          test "$(git hash-object docs/05-DATA-CONTRACT.md)" = "e7426c6c5ee4a122aecc8c8719f9cdd9173841e7"
          test "$(git hash-object docs/09-DATASET-PROVENANCE-REGISTRY.md)" = "89763a279e957afd0e9a1e3933a2d582df58dda3"
          test "$(git hash-object docs/10-TEMPORAL-POINT-IN-TIME-CONTRACT.md)" = "861362264a3602aa875bb16487d12558f700c250"

      - name: Prove exact DATA-01 design identities
        run: |
          test "$(git hash-object GOVERNANCE/DATA-01-FIRST-USE-DATA-REQUIREMENTS-MAP-V0.1.json)" = "2d6d43d783281ee3dfd4028bc9b84c4dce495b87"
          test "$(git hash-object GOVERNANCE/DATA-01-CLAIM-SCOPED-DATA-ADMISSIBILITY-PROVENANCE-CONTRACT-V0.1.json)" = "ec013c8db53b482770a62016db50b113b19ecd7f"
          test "$(git hash-object GOVERNANCE/DATA-01-DATA-TEMPORAL-OWNERSHIP-BOUNDARY-V0.1.md)" = "4bdb9d6c7448759c0349048fd4f48abba296c0cf"
          test "$(git hash-object GOVERNANCE/DATA-01-FROZEN-ADVERSARIAL-BREAKER-CONTRACT-V0.1.json)" = "d9cafc53c863341ca827097014411702c26633f2"
          test "$(git hash-object breakers/data_01_documentary_static_breaker.py)" = "8bce54c4964d970cd703e803f55ccae089d814da"

      - name: Prove DATA-01 delta does not modify owner runtimes
        run: |
          python - <<'PY'
          import subprocess
          parent = "1a4ea7f19a4bdee0cd632f8f42adb40fa1f0fe86"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{parent}..HEAD"],
              text=True,
          ).splitlines()
          exact = {
              ".github/workflows/data-01-documentary-qualification.yml",
              "GOVERNANCE/DATA-01-FIRST-USE-DATA-REQUIREMENTS-MAP-V0.1.json",
              "GOVERNANCE/DATA-01-CLAIM-SCOPED-DATA-ADMISSIBILITY-PROVENANCE-CONTRACT-V0.1.json",
              "GOVERNANCE/DATA-01-DATA-TEMPORAL-OWNERSHIP-BOUNDARY-V0.1.md",
              "GOVERNANCE/DATA-01-FROZEN-ADVERSARIAL-BREAKER-CONTRACT-V0.1.json",
              "breakers/data_01_documentary_static_breaker.py",
          }
          for path in changed:
              if path in exact:
                  continue
              if path.startswith("reports/program/") and "DATA-01" in path:
                  continue
              raise SystemExit(f"UNAUTHORIZED_DATA01_DELTA:{path}")
          print("PASS: DATA-01 delta is documentary/static only")
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Execute DATA-01 documentary/static breaker
        run: python -m pytest -q breakers/data_01_documentary_static_breaker.py

      - name: Replay RVO-04 routing breaker
        run: python -m pytest -q breakers/rvo_04_claim_routing_breaker.py

      - name: Re-run existing tick-CSV Data boundary tests
        run: python -m pytest -q tests/test_dataset_admissibility.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
