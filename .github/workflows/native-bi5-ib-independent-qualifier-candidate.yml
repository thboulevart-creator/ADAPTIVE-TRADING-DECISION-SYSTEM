name: Native BI5 I_B Independent Qualifier Candidate

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/native-bi5-ib-independent-qualifier-candidate.yml'
      - 'src/native_bi5_independent_qualifier.py'
      - 'reports/data-qualification/iab/ib_semantic_source_provenance.json'
      - 'reports/data-qualification/iab/ib_no_copy_declaration.json'
      - 'reports/data-qualification/iab/ib_independent_stage_test_inventory.json'
      - 'breakers/native_bi5_ib_derivation_evidence_breaker.py'
      - 'breakers/native_bi5_ib_independent_qualifier_breaker.py'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  IB_SOURCE_GIT_BLOB: '051acc40a6368d9159de720eacbd1e6e778a9776'
  IB_SOURCE_SHA256: '06461c72e4a5dd96f7c0dd6758759d3a5d60faaaeb447d5ea635d027a467a429'
  PROVENANCE_BLOB: '2d58ff7b846ff5616cde5219ec30b1186291ef26'
  NO_COPY_BLOB: 'f2e0dcc25db7b31761f61deeb1431498881a1aa9'
  INVENTORY_BLOB: '031904f3a15b5574aef5d652382476e45c3e9871'
  EVIDENCE_BREAKER_BLOB: '231f9daa343f95baa4b747ec2b89166833255958'
  IB_BREAKER_BLOB: 'd1a305e3b9ae813e891b34522e3a12bb6bc8ac34'

jobs:
  qualify-ib-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted I_B candidate and frozen qualification surfaces
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object src/native_bi5_independent_qualifier.py)" = "${IB_SOURCE_GIT_BLOB}"
          test "$(sha256sum src/native_bi5_independent_qualifier.py | awk '{print $1}')" = "${IB_SOURCE_SHA256}"
          test "$(git hash-object reports/data-qualification/iab/ib_semantic_source_provenance.json)" = "${PROVENANCE_BLOB}"
          test "$(git hash-object reports/data-qualification/iab/ib_no_copy_declaration.json)" = "${NO_COPY_BLOB}"
          test "$(git hash-object reports/data-qualification/iab/ib_independent_stage_test_inventory.json)" = "${INVENTORY_BLOB}"
          test "$(git hash-object breakers/native_bi5_ib_derivation_evidence_breaker.py)" = "${EVIDENCE_BREAKER_BLOB}"
          test "$(git hash-object breakers/native_bi5_ib_independent_qualifier_breaker.py)" = "${IB_BREAKER_BLOB}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Verify qualified evidence package unchanged except source binding
        run: python -m pytest -q breakers/native_bi5_ib_derivation_evidence_breaker.py

      - name: Execute frozen I_B breaker
        run: python -m pytest -q breakers/native_bi5_ib_independent_qualifier_breaker.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
