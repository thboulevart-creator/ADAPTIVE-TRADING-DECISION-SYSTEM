name: AO-E0 OWNER-02 B11 V0.2 Requalification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - 'GOVERNANCE/AO-E0-P1-OWNER-02-B11-V0.2-REQUALIFICATION-CONTRACT-V0.1.json'
      - 'tests/test_ao_e0_owner02_b11_v02_requalification.py'
      - '.github/workflows/ao-e0-owner02-b11-v02-requalification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  requalify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: B11 V0.2 requalification
        run: python -m pytest tests/test_ao_e0_owner02_b11_v02_requalification.py -q
      - name: OWNER-02 full regression
        run: python -m pytest tests/test_ao_e0_p1_owner_02.py tests/test_ao_e0_p1_owner_01.py -q
      - name: PIPE-01 regression
        run: python -m unittest tests/test_ao_e0_b12_consumption_controller.py -v
      - name: Protected surfaces exact
        shell: bash
        run: |
          test "$(git hash-object src/p1_12d_ao_e0_extension.py)" = "fec520916ca07ee6fe7e6029b4ca611519c39bc2"
          test "$(git hash-object tools/ao_e0_cc05_e1_producer.py)" = "981794fedbfd8c9fdac69ba4751540e63a2e5289"
          test "$(git hash-object src/p1_12c_ao_e0_native_owner.py)" = "57191ab2892e571807a8ed3f53fd0569de1f739e"
