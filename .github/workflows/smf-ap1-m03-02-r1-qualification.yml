name: SMF AP1 M03-02 R1 Transport Qualification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'GOVERNANCE/SMF-AP1-M03-02-R1-*'
      - 'tools/smf_ap1_m03_02_r1_bootstrap.py'
      - 'tests/test_smf_ap1_m03_02_r1_transport.py'
      - 'reports/program/*SMF-AP1-M03-02-R1*'
      - '.github/workflows/smf-ap1-m03-02-r1-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
          python -m pip install --disable-pip-version-check numpy==2.5.3 pyarrow==25.0.1 tzdata==2026.3
      - name: R1 transport qualification
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_transport.py
      - name: M03-02 executor regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_real_execution.py
      - name: M03-01 binding regression
        run: |
          python -m pytest -q breakers/smf_ap1_m03_01_binding_breaker.py
          python -m pytest -q tests/test_smf_ap1_m03_01_binding.py
      - name: Static owner invariants
        run: |
          test "$(git hash-object tools/smf_ap1_m03_02_real_execution.py)" = "63b7cb779fd1e8cf5eaa175f17a3ce6f7a76e81f"
          test "$(git hash-object src/smf_ap1_m03_binding.py)" = "f4c0295625f8b360effbd27a8d616d9644ea2a5e"
          test "$(git hash-object tools/smf03_core_foundation.py)" = "b67d63bbbc4f93be3fe1e7327c1f1f1cc440ebeb"
          test "$(git hash-object tools/ap1_intraday_spread_census.py)" = "9f613063fb8a190a1ff6f2f8b12c97c4ed97712a"
      - name: Clean worktree
        if: always()
        run: |
          git status --porcelain
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
