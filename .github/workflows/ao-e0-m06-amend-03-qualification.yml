name: AO-E0 M06-AMEND-03 Application Qualification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'GOVERNANCE/AO-E0-M06-AMEND-03-*'
      - 'GOVERNANCE/AO-E0-B8-M06-02-SAMPLE-ADEQUACY-PREREGISTRATION-V0.2.json'
      - 'GOVERNANCE/AO-E0-B12-DATA-01-PROSPECTIVE-FORWARD-INSTANCE-FORMATION-CONTRACT-V0.2.json'
      - 'GOVERNANCE/AO-E0-B8-DR-01-FINAL-QUALIFICATION-DECISION-RULE-V0.2.json'
      - 'GOVERNANCE/AO-E0-B12-DATA-01-TC-01-COUNT-ONLY-CONTRACT-V0.2.json'
      - 'tools/ao_e0_*_v0_2.py'
      - 'tests/test_ao_e0_m06_amend_03.py'
      - '.github/workflows/ao-e0-m06-amend-03-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: M06-AMEND-03 application
        run: python -m pytest -q tests/test_ao_e0_m06_amend_03.py

      - name: M06 V0.1 regression
        run: python -m pytest -q tests/test_ao_e0_b8_m06_02.py

      - name: DR-01 V0.1 regression
        run: python -m pytest -q tests/test_ao_e0_b8_dr_01.py

      - name: TC-01 V0.1 regression
        run: python -m pytest -q tests/test_ao_e0_b12_data01_tc01.py

      - name: M06-AMEND-02 regression
        run: python -m pytest -q tests/test_ao_e0_m06_amend_02.py

      - name: B12 controller regression
        run: python -m pytest -q tests/test_ao_e0_b12_consumption_controller.py

      - name: OWNER02 B11 regression
        run: python -m pytest -q tests/test_ao_e0_owner02_b11_v02_requalification.py tests/test_ao_e0_b11_01_owner_binding.py

      - name: V0.1 blob immutability
        run: |
          test "$(git rev-parse HEAD:GOVERNANCE/AO-E0-B8-M06-02-SAMPLE-ADEQUACY-PREREGISTRATION-CANDIDATE-V0.1.json)" = "95a2e41c1e004e3b4461631060d8b12380983caa"
          test "$(git rev-parse HEAD:GOVERNANCE/AO-E0-B12-DATA-01-PROSPECTIVE-FORWARD-INSTANCE-FORMATION-CONTRACT-V0.1.json)" = "7ebb5dc87434776d49966fdfbaba4006d44478ad"
          test "$(git rev-parse HEAD:GOVERNANCE/AO-E0-B8-DR-01-FINAL-QUALIFICATION-DECISION-RULE-CANDIDATE-V0.1.json)" = "7b08d0af9cb733be186ddc2f4fa6ca22768284fd"
          test "$(git rev-parse HEAD:GOVERNANCE/AO-E0-B12-DATA-01-TC-01-COUNT-ONLY-CONTRACT-V0.1.json)" = "ac6541b43f71a3dd0415a8d0d9a6efb12b8364c9"

      - name: Firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=lambda p:json.loads(Path(p).read_text())
          app=j('GOVERNANCE/AO-E0-M06-AMEND-03-PROSPECTIVE-APPLICATION-MANIFEST-V0.1.json')
          d=j('GOVERNANCE/AO-E0-B12-DATA-01-PROSPECTIVE-FORWARD-INSTANCE-FORMATION-CONTRACT-V0.2.json')
          t=j('GOVERNANCE/AO-E0-B12-DATA-01-TC-01-COUNT-ONLY-CONTRACT-V0.2.json')
          assert app['real_forward_read_authorized'] is False
          assert app['b12'] == 'CLOSED'
          assert app['reference_planning_n_is_terminal_authority'] is False
          assert d['result_driven_extension'] is False
          assert d['post_end_data_in_same_instance'] is False
          assert t['terminal_authority'] is False
          assert t['real_tc01_forward_read'] is False
          PY

      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
