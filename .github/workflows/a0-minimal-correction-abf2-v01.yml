name: A0 Minimal Correction ABF2 V0.1

on:
  push:
    branches:
      - sandbox/a0-minimal-correction-abf2-v01
    paths:
      - .github/workflows/a0-minimal-correction-abf2-v01.yml

permissions:
  contents: read

jobs:
  correction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact correction candidate
        uses: actions/checkout@v4
        with:
          ref: c1cc687ac0f894fcd5ec041709a8ab89649c11ea
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify exact candidate and scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "c1cc687ac0f894fcd5ec041709a8ab89649c11ea"
          python - <<'PY'
          import subprocess
          expected = {"src/a0_research_authority.py"}
          got = set(subprocess.check_output(
              ["git", "diff", "--name-only",
               "e6d55cd8f135af502781952cec72a7267f223073",
               "c1cc687ac0f894fcd5ec041709a8ab89649c11ea"],
              text=True,
          ).splitlines())
          assert got == expected, (got, expected)
          PY

      - name: Verify protected identities
        shell: bash
        run: |
          test "$(git hash-object src/a0_research_authority.py)" = "f0015894d001c0ced7d0edf881947e3a435ab5ca"
          test "$(git hash-object breakers/a0_research_authority_red_breaker.py)" = "e02ecfa6d30c2877a33f5c5d81b161ee562202b6"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v01.py)" = "2911d5b282ccbb6147b2b54a7db5c357c2d315b6"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v02.py)" = "9833ce563305cfb6d6fe1de8907e8aa9fc96fda4"
          test "$(git hash-object GOVERNANCE/A0-RESEARCH-FINDINGS-AUTHORITY-INTERPRETATION-CONTRACT-V0.3.md)" = "f1168481879f33f8762dcb1e19e2ad35211c8ec2"

      - name: Compile candidate and breakers
        run: |
          python -m py_compile src/a0_research_authority.py
          python -m py_compile breakers/a0_research_authority_red_breaker.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v01.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v02.py

      - name: Run closed 42-test correction suite
        shell: bash
        run: |
          python -m pytest -q             breakers/a0_research_authority_red_breaker.py             breakers/a0_research_authority_adversarial_breaker_v01.py             breakers/a0_research_authority_adversarial_breaker_v02.py             | tee /tmp/a0-abf2-correction.txt
          grep -q "42 passed" /tmp/a0-abf2-correction.txt
          echo "A0_MINIMAL_CORRECTION_ABF2_V01=PASS_42_OF_42"
