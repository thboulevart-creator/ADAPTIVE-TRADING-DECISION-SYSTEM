name: Trading Breaks Recovery Batch 04 Atomic Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-batch04:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: feat/multi-year-dukascopy-acquisition
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify checkpoint ancestry and untouched pre-integration state
        run: |
          git merge-base --is-ancestor 918b7f5409854c23f01edcfd6082470be4013745 HEAD
          python - <<'PY'
          from tools.integrate_trading_breaks_recovery_batch04 import (
              guard_preintegration_state,
              load_authoritative_adjudication,
          )
          load_authoritative_adjudication()
          guard_preintegration_state()
          print('PASS: Batch 04 adjudication authoritative and executable state still pre-integration')
          PY

      - name: Install pytest
        run: python -m pip install pytest==8.4.2

      - name: Adversarially qualify integration contract before mutation
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch04_integration_contract.py \
            tests/test_trading_breaks_recovery_batch04_adjudication.py \
            tests/test_trading_breaks_recovery_batch04.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_protocol.py

      - name: Prepare calendar ledger tests atomically in worktree
        run: python -m tools.integrate_trading_breaks_recovery_batch04

      - name: Regenerate deterministic progression runtime from integrated worktree
        run: python -m tools.trading_breaks_recovery_progression

      - name: Adversarial regression before atomic commit
        run: |
          python -m pytest -q \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_dukascopy_usatech_calendar_2022_batch02.py \
            tests/test_dukascopy_usatech_calendar_2022_batch03.py \
            tests/test_dukascopy_usatech_calendar_2022_batch04.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_batch01.py \
            tests/test_trading_breaks_recovery_batch02.py \
            tests/test_trading_breaks_recovery_batch03.py \
            tests/test_trading_breaks_recovery_batch03_adjudication.py \
            tests/test_trading_breaks_recovery_batch03_integration.py \
            tests/test_trading_breaks_recovery_batch04.py \
            tests/test_trading_breaks_recovery_batch04_adjudication.py \
            tests/test_trading_breaks_recovery_batch04_integration_contract.py \
            tests/test_trading_breaks_recovery_batch04_integration.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Assert exact integrated worktree accounting and blocked semantics
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from tools.dukascopy_usatech_calendar import SPECIAL_SESSION_EVIDENCE
          from tools.dukascopy_usatech_calendar_coverage import audit_calendar_coverage
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue, load_attempt_ledger, progression_decisions
          from tools.trading_breaks_recovery_protocol import recovery_queue

          global_report = audit_calendar_coverage()
          window = audit_calendar_coverage(date(2021, 8, 14), date(2026, 8, 14))
          _, _, attempts = load_attempt_ledger()
          progression = json.load(open('reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json', encoding='utf-8'))
          raw_days = {d for d, _ in recovery_queue()}
          eligible_days = {d for d, _ in eligible_recovery_queue()}
          decisions = {d.target_date: d for d in progression_decisions()}

          assert (global_report['candidate_dates'], global_report['resolved_candidate_dates'], global_report['unresolved_candidate_dates']) == (111, 37, 74)
          assert (window['candidate_dates'], window['resolved_candidate_dates'], window['unresolved_candidate_dates']) == (68, 14, 54)
          assert len(attempts) == 20
          assert len(recovery_queue()) == 54
          assert progression['verdict'] == 'PASS'
          assert progression['calendar_unresolved_count'] == 54
          assert progression['attempt_ledger_count'] == 20
          assert progression['attempted_blocked_ineligible_count'] == 6
          assert progression['eligible_initial_or_retry_count'] == 48

          pass_days = {date(2022, 11, 24), date(2022, 11, 25), date(2022, 12, 23)}
          blocked_days = {date(2022, 12, 26), date(2023, 1, 2)}
          assert pass_days <= set(SPECIAL_SESSION_EVIDENCE)
          assert pass_days.isdisjoint(raw_days)
          assert blocked_days <= raw_days
          assert blocked_days.isdisjoint(eligible_days)
          assert blocked_days.isdisjoint(set(SPECIAL_SESSION_EVIDENCE))
          for day in blocked_days:
              assert decisions[day].reason == 'SAME_CAPABILITY_BLOCKED_ALREADY_ATTEMPTED'
              assert decisions[day].latest_attempt_outcome == 'BLOCKED'
              assert decisions[day].contract_verdict == 'PASS'
          print('PASS: worktree Batch 04 integration coherent; 54 unresolved / 20 attempts / 6 blocked-ineligible / 48 eligible')
          PY

      - name: Write integration qualification report
        run: |
          cat > reports/data-qualification/historical_trading_breaks_recovery_batch04_integration_qualification.md <<EOF
          # HISTORICAL TRADING BREAKS RECOVERY — BATCH 04 ATOMIC INTEGRATION QUALIFICATION

          **PASS — \`BATCH04_ATOMIC_CALENDAR_ATTEMPT_PROGRESSION_INTEGRATION_COHERENT\`**

          Source adjudication:
          - browser run: \`34895457466\`
          - job: \`104148201341\`
          - artifact: \`10369230708\`
          - artifact SHA-256: \`3e6d259f24fce540d39560cdc2714963cdd887f67f362aa9bc90eafa3d4176dc\`
          - probe commit: \`11a81294720898802e49dd1131a64e20e7e7ae3a\`

          Integration workflow run: \`${GITHUB_RUN_ID}\`
          Pre-integration execution SHA: \`${GITHUB_SHA}\`

          Atomic mutation authorized and proven:
          - calendar PASS additions only: \`2022-11-24\`, \`2022-11-25\`, \`2022-12-23\`;
          - five factual Batch 04 attempts appended as sequences \`16..20\`;
          - \`2022-12-26\` and \`2023-01-02\` remain unresolved and are same-capability execution-ineligible;
          - progression runtime regenerated from the integrated worktree;
          - no material capability change registered;
          - no negative-evidence promotion.

          Proven post-integration accounting:
          - global calendar: \`111 / 37 resolved / 74 unresolved / 0 FAIL\`;
          - execution-window candidate: \`68 / 14 resolved / 54 unresolved / 0 FAIL\`;
          - attempt ledger: \`20\`;
          - attempted BLOCKED execution-ineligible: \`6\`;
          - execution-eligible unresolved: \`48\`.

          This qualification does not authorize massive \`.bi5\` acquisition or any real backtest.
          EOF

      - name: Persist one atomic Batch 04 integration commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/dukascopy_usatech_calendar.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch04_integration_qualification.md \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_batch02.py \
            tests/test_trading_breaks_recovery_batch03.py \
            tests/test_trading_breaks_recovery_batch03_integration.py \
            tests/test_trading_breaks_recovery_batch04.py \
            tests/test_dukascopy_usatech_calendar_2022_batch04.py \
            tests/test_trading_breaks_recovery_batch04_integration.py
          git diff --cached --check
          git commit -m 'evidence: atomically integrate Trading Breaks Batch 04'
          echo "INTEGRATION_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
