name: A0 Metric-Domain Runtime Binding Minimal Implementation Persisted Rebreak

on:
  push:
    branches:
      - sandbox/a0-metric-domain-runtime-binding-minimal-implementation-persisted-rebreak
    paths:
      - .github/workflows/a0-metric-domain-runtime-binding-minimal-implementation-persisted-rebreak.yml

permissions:
  contents: read

jobs:
  rebreak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact persisted binding HEAD
        uses: actions/checkout@v4
        with:
          ref: 8630a512ad7abafed10783caf5165c61e095b534
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify exact persisted scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "8630a512ad7abafed10783caf5165c61e095b534"
          python - <<'PY'
          import subprocess
          got=set(subprocess.check_output(
              ["git","diff","--name-only",
               "3b4e5f055ac427265c1bde6027262d2ca4271d14",
               "8630a512ad7abafed10783caf5165c61e095b534"],
              text=True,
          ).splitlines())
          assert got=={"src/a0_research_authority.py"}, got
          PY

      - name: Verify protected identities
        shell: bash
        run: |
          test "$(git hash-object src/a0_research_authority.py)" = "1210bee06a2d9aed2ed7d9078542934ff430175c"
          test "$(git hash-object src/a0_metric_domain_authority.py)" = "9bd05f2a2a97f092c0fc2988319f15caff57dda3"
          test "$(git hash-object GOVERNANCE/A0-SYNTHETIC-PRODUCER-METRIC-DOMAIN-AUTHORITY-V0.1.json)" = "dd205d3e7b4a522a5ba23cef1e665d51c196acb8"
          test "$(git hash-object GOVERNANCE/A0-SYNTHETIC-PRODUCER-METRIC-DOMAIN-RUNTIME-BINDING-TEST-FIRST-RED-V0.1.json)" = "935661cbdf4dee031a738e37969baafa0a975d81"
          test "$(git hash-object breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py)" = "bcba5de33a73f9e32ff39e8fb498ab4d471af098"
          test "$(git hash-object breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py)" = "e3620ac348a8042fe1d04cfc9b32c16060fce4a3"
          ! grep -q "FOREIGN_METRIC" breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py

      - name: Compile runtime and qualifier
        run: |
          python -m py_compile src/a0_research_authority.py
          python -m py_compile src/a0_metric_domain_authority.py

      - name: Fresh persisted-head 127-test rebreak
        shell: bash
        run: |
          python -m pytest -q             breakers/a0_research_authority_red_breaker.py             breakers/a0_research_authority_adversarial_breaker_v01.py             breakers/a0_research_authority_adversarial_breaker_v02.py             breakers/a0_research_authority_adversarial_breaker_v03.py             breakers/a0_research_authority_adversarial_breaker_v04.py             breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py             breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py             | tee /tmp/a0-binding-persisted.txt
          grep -q "127 passed" /tmp/a0-binding-persisted.txt
          echo "A0_METRIC_DOMAIN_RUNTIME_BINDING_MINIMAL_IMPLEMENTATION_PERSISTED_REBREAK=PASS_127_OF_127"
