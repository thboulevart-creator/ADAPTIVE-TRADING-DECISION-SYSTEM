name: BEPD-04I Persisted-Head Replay + Rebreak

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - .github/workflows/bepd-04i-persisted-head-rebreak.yml

permissions:
  contents: read

jobs:
  rebreak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact persisted identities
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            path="$1"; expected="$2"; actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || { echo "BEPD04I_REBREAK_BINDING_FAIL:$path:$actual:$expected"; exit 1; }
          }
          check_blob "GOVERNANCE/BEPD-04I-PRE-RESULT-REAL-BOOTSTRAP-EXECUTION-FREEZE-V0.1.json" "7e8b38648e0d55109068597099cdad3b4355cd4e"
          check_blob "GOVERNANCE/BEPD-04H-RESPONSE-SPECIFIC-M05-EXPLORATORY-ACTIVATION-2026-10-06.md" "7f2fd16d7cc636e8d3e3cb23f618deb55407bcf1"
          check_blob "artifacts/bepd02/real-historical-weekly-liquidity-ledger-v0.1/EVENT_LEDGER.jsonl" "0d15e3bc8dc9393e53923bb91d7c74d30d1cf0b2"
          check_blob "GOVERNANCE/BEPD-04E-COMPLETE-WEEK-CALENDAR-BINDING-V0.1.json" "26385eb2547892df4b87206ad59fc2ba07721354"
          check_blob "tools/bepd_04e_response_generalization_v0_1.py" "61a996562fe18e0e2efd6f16db27a48738e60421"
          check_blob "tools/bepd_04e_response_generalization_reference_v0_1.py" "e4ad2b642265889455e33f23ead3c5b57c1a7eae"
          check_blob "tools/bepd_04i_real_m05_bootstrap_v0_1.py" "214177ae7a1e68f87d83076673c968f721076b29"
          check_blob "breakers/bepd_04i_real_m05_bootstrap_breaker_v0_1.py" "7987de3da5b14c96acfbe9e51d788640d04f08aa"
          check_blob "artifacts/bepd04i/first-real-m05-bootstrap-v0.1/REAL_M05_BOOTSTRAP_RESULT.json" "5d6e7c7f3a7c3beb1e41b00d5edf58500eade94e"
          check_blob "artifacts/bepd04i/first-real-m05-bootstrap-v0.1/RUN_MANIFEST.json" "2ce84bffa55a5095119e1a5eb3d4fa79ba84d11a"
          check_blob "reports/program/2026-10-06-BEPD-04I-FIRST-REAL-M05-BOOTSTRAP-EXECUTION-RECORD-V0.1.json" "db999472a23612fbfaefb45be654e40018c9d10a"
          check_blob "reports/program/2026-10-06-BEPD-04I-INDEPENDENT-RECOMPUTATION-RECEIPT-V0.1.json" "88b75ab96f3705f3c2a77acbcfd84f340b14ca3f"
          echo "BEPD04I_PERSISTED_IDENTITIES_PASS"

      - name: Deterministic replay from persisted inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bepd04i-rebreak
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from tools.bepd_04i_real_m05_bootstrap_v0_1 import execute_primary,distribution_evidence,EXPECTED_BINDINGS
          from tools.bepd_04e_response_generalization_reference_v0_1 import reference_moving_block_ratio_ci

          cal_obj=json.loads(Path("GOVERNANCE/BEPD-04E-COMPLETE-WEEK-CALENDAR-BINDING-V0.1.json").read_text())
          calendar=[x["target_week_id"] for x in cal_obj["calendar"]]
          events=[json.loads(x) for x in Path("artifacts/bepd02/real-historical-weekly-liquidity-ledger-v0.1/EVENT_LEDGER.jsonl").read_text().splitlines() if x.strip()]
          persisted=json.loads(Path("artifacts/bepd04i/first-real-m05-bootstrap-v0.1/REAL_M05_BOOTSTRAP_RESULT.json").read_text())
          record=json.loads(Path("reports/program/2026-10-06-BEPD-04I-FIRST-REAL-M05-BOOTSTRAP-EXECUTION-RECORD-V0.1.json").read_text())
          indep_receipt=json.loads(Path("reports/program/2026-10-06-BEPD-04I-INDEPENDENT-RECOMPUTATION-RECEIPT-V0.1.json").read_text())

          cfg={
            "method":"M05","scheme":"MOVING_BLOCK","statistic":"RATIO_OF_SUMS",
            "replications":200000,"block_length":13,"seed":40420261006,
            "confidence_level":0.99,"interval_method":"PERCENTILE","execution_scope":"EXPLORATORY_ONLY",
            "response_subgroup":None,"sensitivity_analysis":False,"alternative_response":False,
            "alternative_horizon":False,"occurrence_x_response":False,"time_to_reintegration":False,
            "prediction_claim":False,"edge_claim":False,"strategy_claim":False,"trading_authority":"NONE",
            "post_result_parameter_selection":False,"competing_canonical_execution":False
          }
          replay=execute_primary(calendar,events,cfg,EXPECTED_BINDINGS)
          evidence=distribution_evidence(calendar,events)
          independent=reference_moving_block_ratio_ci(
              calendar,events,block_length=13,replications=200000,seed=40420261006,
              confidence_level=0.99,interval_method="PERCENTILE"
          )
          def f(x): return format(float(x),".17g")
          assert f(replay["point_estimate"])==persisted["historical_point_estimate"]
          assert f(replay["lower"])==persisted["percentile_lower_bound"]
          assert f(replay["upper"])==persisted["percentile_upper_bound"]
          assert f(replay["upper"]-replay["lower"])==persisted["interval_width"]
          assert f(evidence["minimum_replicate_statistic"])==persisted["minimum_replicate_statistic"]
          assert f(evidence["maximum_replicate_statistic"])==persisted["maximum_replicate_statistic"]
          assert evidence["sequence_digest_sha256"]==persisted["replicate_sequence_digest_sha256"]
          assert evidence["sorted_distribution_digest_sha256"]==persisted["sorted_distribution_digest_sha256"]
          assert f(independent["point_estimate"])==persisted["historical_point_estimate"]
          assert f(independent["lower"])==persisted["percentile_lower_bound"]
          assert f(independent["upper"])==persisted["percentile_upper_bound"]
          assert indep_receipt["status"]=="PASS"
          assert indep_receipt["point_estimate_parity"]=="PASS"
          assert indep_receipt["interval_lower_parity"]=="PASS"
          assert indep_receipt["interval_upper_parity"]=="PASS"

          canonical=json.dumps(persisted,sort_keys=True,separators=(",",":"))
          assert hashlib.sha256(canonical.encode()).hexdigest()==record["result_sha256"]

          replay_receipt={
            "schema":"ATDS_BEPD_04I_DETERMINISTIC_REPLAY_RECEIPT_V0_1",
            "status":"PASS",
            "point_estimate_replay":"PASS",
            "interval_lower_replay":"PASS",
            "interval_upper_replay":"PASS",
            "interval_width_replay":"PASS",
            "replicate_minimum_replay":"PASS",
            "replicate_maximum_replay":"PASS",
            "replicate_sequence_digest_replay":"PASS",
            "sorted_distribution_digest_replay":"PASS",
            "result_sha256_replay":"PASS",
            "replications":200000,
            "block_length":13,
            "seed":40420261006,
            "confidence_level":"0.99",
            "interval_method":"PERCENTILE"
          }
          Path("bepd04i-rebreak/DETERMINISTIC_REPLAY_RECEIPT.json").write_text(json.dumps(replay_receipt,indent=2,sort_keys=True)+"\n")

          rebreak={
            "schema":"ATDS_BEPD_04I_PERSISTED_HEAD_REBREAK_RECEIPT_V0_1",
            "status":"PASS",
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),
            "persisted_identities":"PASS",
            "deterministic_replay":"PASS",
            "independent_recomputation":"PASS",
            "point_estimate_parity":"PASS",
            "interval_lower_parity":"PASS",
            "interval_upper_parity":"PASS",
            "distribution_digest_replay":"PASS",
            "bootstrap_replications":200000,
            "block_length":13,
            "seed":40420261006,
            "confidence_level":"0.99",
            "interval_method":"PERCENTILE",
            "result_human_adopted":False,
            "generalization_established":False,
            "trading_authority":"NONE"
          }
          Path("bepd04i-rebreak/PERSISTED_HEAD_REBREAK_RECEIPT.json").write_text(json.dumps(rebreak,indent=2,sort_keys=True)+"\n")
          print("BEPD04I_DETERMINISTIC_REPLAY_PASS")
          print("BEPD04I_INDEPENDENT_RECOMPUTATION_REPLAY_PASS")
          print("BEPD04I_DISTRIBUTION_DIGEST_REPLAY_PASS")
          PY

      - name: Run BEPD-04I breaker
        shell: bash
        run: |
          set -euo pipefail
          python breakers/bepd_04i_real_m05_bootstrap_breaker_v0_1.py

      - name: Run qualified BEPD-04E breaker
        shell: bash
        run: |
          set -euo pipefail
          python breakers/bepd_04e_response_generalization_breaker_v0_1.py

      - name: Verify authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/bepd04i/first-real-m05-bootstrap-v0.1/REAL_M05_BOOTSTRAP_RESULT.json").read_text())
          assert r["result_human_adopted"] is False
          assert r["generalization_established"] is False
          assert r["confirmatory_generalization"]=="FRESH_OOS_EVIDENCE_REQUIRED"
          assert r["prediction"] is False
          assert r["edge"] is False
          assert r["trading_authority"]=="NONE"
          print("BEPD04I_AUTHORITY_BOUNDARY_PASS")
          PY

      - name: Upload replay and rebreak receipts
        uses: actions/upload-artifact@v4
        with:
          name: bepd04i-rebreak
          path: bepd04i-rebreak/*.json
          if-no-files-found: error
          retention-days: 30
