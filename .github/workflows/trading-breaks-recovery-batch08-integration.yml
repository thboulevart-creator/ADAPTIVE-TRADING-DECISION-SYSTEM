name: Trading Breaks Recovery Batch 08 Atomic Integration

on:
  push:
    branches:
      - feat/multi-year-dukascopy-acquisition
    paths:
      - '.github/workflows/trading-breaks-recovery-batch08-integration.yml'
      - 'tools/integrate_trading_breaks_recovery_batch08.py'
      - 'tests/test_trading_breaks_recovery_batch08_integration_contract.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-batch08:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering persisted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove Batch 08 adjudication checkpoint ancestry and governed pre-state immutability
        run: |
          git merge-base --is-ancestor fcce4997a68046c27e47f5f4101ad02a6e3b48fa HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          git diff --exit-code fcce4997a68046c27e47f5f4101ad02a6e3b48fa HEAD -- \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            tools/trading_breaks_recovery_batch08.py \
            reports/data-qualification/historical_trading_breaks_recovery_batch08_adjudication.json \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Break Batch 08 integration contract before mutation
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch08_integration_contract.py \
            tests/test_trading_breaks_recovery_batch08_adjudication.py \
            tests/test_trading_breaks_recovery_batch08.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_progression.py
          python - <<'PY'
          from tools.integrate_trading_breaks_recovery_batch08 import guard_preintegration_state
          guard_preintegration_state()
          print('PASS: exact pre-Batch08 integration state and anti-partial guards hold')
          PY

      - name: Prepare exact atomic Batch 08 integration in worktree
        run: python -m tools.integrate_trading_breaks_recovery_batch08

      - name: Regenerate attempt-aware progression deterministically
        run: python -m tools.trading_breaks_recovery_progression

      - name: Adversarially re-break calendar coverage progression after mutation
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_*.py \
            tests/test_dukascopy_usatech_calendar*.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Assert exact post-Batch08 integrated state
        run: |
          python - <<'PY'
          from datetime import date
          from tools.dukascopy_usatech_calendar import SPECIAL_SESSION_EVIDENCE
          from tools.dukascopy_usatech_calendar_coverage import NO_SPECIAL_CHANGE_EVIDENCE, audit_calendar_coverage
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue, load_attempt_ledger, load_material_capability_changes, progression_decisions
          from tools.trading_breaks_recovery_protocol import recovery_queue

          global_report = audit_calendar_coverage()
          window_report = audit_calendar_coverage(date(2021, 8, 14), date(2026, 8, 14))
          assert (global_report['candidate_dates'], global_report['resolved_candidate_dates'], global_report['unresolved_candidate_dates']) == (111, 53, 58)
          assert (window_report['candidate_dates'], window_report['resolved_candidate_dates'], window_report['unresolved_candidate_dates']) == (68, 30, 38)
          assert global_report['evidence_shape_errors'] == []
          assert global_report['orphan_special_evidence'] == []
          assert global_report['contradictory_evidence_dates'] == []

          _, _, attempts = load_attempt_ledger()
          batch08 = [x for x in attempts if x.attempt_id.startswith('batch08:')]
          assert len(attempts) == 40
          assert [x.attempt_sequence for x in batch08] == [36, 37, 38, 39, 40]
          assert [x.outcome for x in batch08] == ['BLOCKED', 'PASS', 'PASS', 'PASS', 'PASS']
          assert batch08[0].target_date == date(2024, 3, 29)
          assert batch08[0].blocking_reason == 'NO_EXACT_TARGET_DATE_POSITIVE_RECORD_ADMISSIBLE'

          pass_days = {date(2024, 5, 27), date(2024, 6, 19), date(2024, 7, 3), date(2024, 7, 4)}
          raw_days = {d for d, _ in recovery_queue()}
          eligible = eligible_recovery_queue()
          eligible_days = {d for d, _ in eligible}
          decisions = {d.target_date: d for d in progression_decisions()}
          assert pass_days <= set(SPECIAL_SESSION_EVIDENCE)
          assert pass_days.isdisjoint(raw_days)
          assert date(2024, 3, 29) not in SPECIAL_SESSION_EVIDENCE
          assert date(2024, 3, 29) not in NO_SPECIAL_CHANGE_EVIDENCE
          assert date(2024, 3, 29) in raw_days
          assert date(2024, 3, 29) not in eligible_days
          good_friday = decisions[date(2024, 3, 29)]
          assert good_friday.latest_attempt_id == 'batch08:2024-03-29'
          assert good_friday.latest_attempt_outcome == 'BLOCKED'
          assert good_friday.reason == 'SAME_CAPABILITY_BLOCKED_ALREADY_ATTEMPTED'
          assert len(recovery_queue()) == len(decisions) == 38
          assert sum(not d.eligible and d.latest_attempt_outcome == 'BLOCKED' for d in decisions.values()) == 10
          assert len(eligible) == 28
          assert eligible[0] == (date(2024, 9, 2), 'LABOR_DAY')
          assert load_material_capability_changes() == []
          print('PASS: exact atomic Batch 08 integrated state = global 111/53/58, window 68/30/38, ledger 40, blocked 10, eligible 28')
          PY

      - name: Prove integration mutation surface has no browser capture or live Batch 08 selection
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/integrate_trading_breaks_recovery_batch08.py').read_text(encoding='utf-8').lower()
          for forbidden in (
              ''.join(('play', 'wright')),
              ''.join(('chro', 'mium')),
              ''.join(('probe_', 'candidate')),
              ''.join(('eligible_', 'recovery_queue(')),
              ''.join(('recovery_', 'queue(')),
          ):
              assert forbidden not in source, forbidden
          assert 'batch08_targets()' in source
          print('PASS: integration uses frozen Batch 08 identity only and has no browser/capture/live-queue path')
          PY

      - name: Persist integration qualification and one atomic governed-state commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "integrate-batch08") | .id' | head -n 1)"
          export JOB_ID
          python - <<'PY'
          import os
          from pathlib import Path
          report = Path('reports/data-qualification/historical_trading_breaks_recovery_batch08_integration_qualification.md')
          report.write_text(
              '# HISTORICAL TRADING BREAKS RECOVERY — BATCH 08 ATOMIC INTEGRATION\n\n'
              '**PASS — `BATCH08_ATOMIC_CALENDAR_ATTEMPT_PROGRESSION_INTEGRATION_COHERENT`**\n\n'
              f'- integration workflow run: `{os.environ["GITHUB_RUN_ID"]}`\n'
              f'- integration job: `{os.environ.get("JOB_ID")}`\n'
              f'- trigger commit: `{os.environ["GITHUB_SHA"]}`\n'
              '- authoritative browser evidence run/job: `34984538763` / `104433139005`\n'
              '- artifact: `10402433119`\n'
              '- artifact SHA-256: `644e6d6776792dac03e7cb87a3bd63af0be603c6efe951f44c8911ecd9defadd`\n'
              '- exact calendar mutation: four adjudicated PASS dates only\n'
              '- exact ledger mutation: five factual attempts, sequences `36..40`\n'
              '- `2024-03-29` remains unresolved and becomes `SAME_CAPABILITY_BLOCKED_ALREADY_ATTEMPTED`\n'
              '- post-state: global `111/53/58`, window `68/30/38`, ledger `40`, BLOCKED/ineligible `10`, eligible `28`\n'
              '- material capability changes: `0`\n'
              '- no `.bi5`; no real backtest\n',
              encoding='utf-8',
          )
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/dukascopy_usatech_calendar.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch08_integration_qualification.md \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_batch02.py \
            tests/test_trading_breaks_recovery_batch03_integration.py \
            tests/test_trading_breaks_recovery_batch04_integration.py \
            tests/test_trading_breaks_recovery_batch05.py \
            tests/test_trading_breaks_recovery_batch05_integration.py \
            tests/test_trading_breaks_recovery_batch06.py \
            tests/test_trading_breaks_recovery_batch06_integration.py \
            tests/test_trading_breaks_recovery_batch07.py \
            tests/test_trading_breaks_recovery_batch07_integration.py \
            tests/test_trading_breaks_recovery_batch08.py \
            tests/test_dukascopy_usatech_calendar_2024_batch08.py \
            tests/test_trading_breaks_recovery_batch08_integration.py
          git diff --cached --check
          git commit -m 'evidence: atomically integrate Trading Breaks Batch 08'
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
