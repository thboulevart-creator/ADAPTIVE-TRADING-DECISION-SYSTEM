name: Native BI5 I_B Independent Derivation Evidence

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/native-bi5-ib-derivation-evidence.yml'
      - 'breakers/native_bi5_ib_derivation_evidence_breaker.py'
      - 'reports/data-qualification/iab/ib_semantic_source_provenance.json'
      - 'reports/data-qualification/iab/ib_no_copy_declaration.json'
      - 'reports/data-qualification/iab/ib_independent_stage_test_inventory.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PROVENANCE_BLOB: '8c9a6406275b653baa130127d8668ddae4b08581'
  NO_COPY_BLOB: '8fc59ab9232e778abd08471e18a5ce5c98ede6af'
  INVENTORY_BLOB: '35aa65ab3a9646b897e2ad7f8e2a065de07f0ee2'

jobs:
  break-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted evidence candidate
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object reports/data-qualification/iab/ib_semantic_source_provenance.json)" = "${PROVENANCE_BLOB}"
          test "$(git hash-object reports/data-qualification/iab/ib_no_copy_declaration.json)" = "${NO_COPY_BLOB}"
          test "$(git hash-object reports/data-qualification/iab/ib_independent_stage_test_inventory.json)" = "${INVENTORY_BLOB}"

      - name: Prove I_B source still does not exist
        run: test ! -e src/native_bi5_independent_qualifier.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Adversarially break I_B derivation evidence package
        run: python -m pytest -q breakers/native_bi5_ib_derivation_evidence_breaker.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
