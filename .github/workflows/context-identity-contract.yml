name: Context identity contract

on:
  push:
    branches:
      - feat/context-identity-contract-test-v7
  workflow_dispatch:

jobs:
  context-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run context identity contract tests
        run: python -m pytest tests/test_context_identity_contract.py -q
