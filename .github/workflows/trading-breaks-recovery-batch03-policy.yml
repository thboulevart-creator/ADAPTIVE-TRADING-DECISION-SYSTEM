name: Trading Breaks Recovery Batch 03 Policy Qualification

on:
  push:
    branches:
      - feat/multi-year-dukascopy-acquisition
    paths:
      - '04-REFERENCE/HISTORICAL-TRADING-BREAKS-RECOVERY-BATCH03-POLICY.md'
      - 'tools/trading_breaks_recovery_batch03.py'
      - 'tests/test_trading_breaks_recovery_batch03.py'
      - '.github/workflows/trading-breaks-recovery-batch03-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch03-policy-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: feat/multi-year-dukascopy-acquisition
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest only
        run: python -m pip install pytest==8.4.2

      - name: Adversarially qualify Batch 03 frozen membership and parent boundaries
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch03.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_batch01.py \
            tests/test_trading_breaks_recovery_batch02.py \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Assert exact frozen Batch 03 membership without browser observation
        run: |
          python - <<'PY'
          from datetime import date
          from tools.trading_breaks_recovery_batch03 import BATCH_SIZE, batch03_targets
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue

          expected = [
              (date(2022, 5, 30), 'MEMORIAL_DAY'),
              (date(2022, 6, 20), 'JUNETEENTH_OBSERVED'),
              (date(2022, 7, 1), 'INDEPENDENCE_PRE_HOLIDAY_SESSION'),
              (date(2022, 7, 4), 'INDEPENDENCE_DAY_OBSERVED'),
              (date(2022, 9, 5), 'LABOR_DAY'),
          ]
          assert BATCH_SIZE == 5
          assert batch03_targets() == expected
          assert eligible_recovery_queue()[:5] == expected
          print('PASS: Batch 03 membership frozen before observation')
          for day, reason in expected:
              print(day.isoformat(), reason)
          PY

      - name: Prove Batch 03 tool has no browser execution path yet
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('tools/trading_breaks_recovery_batch03.py').read_text(encoding='utf-8').lower()
          assert 'playwright' not in source
          assert 'probe_candidate' not in source
          assert 'asyncio' not in source
          assert 'chromium' not in source
          print('PASS: Batch 03 freeze tool contains membership only; no browser/probe execution path exists')
          PY
