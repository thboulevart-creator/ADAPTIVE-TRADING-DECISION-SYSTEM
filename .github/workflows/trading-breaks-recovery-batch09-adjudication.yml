name: Trading Breaks Recovery Batch 09 Independent Adjudication

on:
  push:
    branches:
      - feat/multi-year-dukascopy-acquisition
    paths:
      - '.github/workflows/trading-breaks-recovery-batch09-adjudication.yml'
      - 'tools/trading_breaks_recovery_batch09_adjudication.py'
      - 'tests/test_trading_breaks_recovery_batch09_adjudication.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact triggering persisted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove checkpoint ancestry and immutable adjudication inputs
        run: |
          git merge-base --is-ancestor 1b9f684d732901eb04ac7b093ef7143568160f32 HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          git diff --exit-code 1b9f684d732901eb04ac7b093ef7143568160f32 HEAD -- \
            04-REFERENCE/RECOVERY-CHECKPOINT.md \
            99-BACKUP/SESSION-2026-09-15-TRADING-BREAKS-RECOVERY-BATCH09-EXECUTION-PASS.md \
            reports/data-qualification/current_coverage_execution_window_boundary_application.md \
            reports/data-qualification/historical_trading_breaks_recovery_batch09_execution_qualification.md \
            reports/data-qualification/historical_trading_breaks_recovery_batch09_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch09_policy_qualification.md \
            reports/data-qualification/historical_trading_breaks_recovery_batch09_persisted_membership_qualification.md \
            04-REFERENCE/HISTORICAL-TRADING-BREAKS-RECOVERY-BATCH09-POLICY.md \
            tools/trading_breaks_recovery_batch09.py \
            tests/test_trading_breaks_recovery_batch09.py \
            tools/trading_breaks_recovery_batch09_execute.py \
            tests/test_trading_breaks_recovery_batch09_execution_contract.py \
            tools/freeze_trading_breaks_recovery_batch09.py \
            tests/test_trading_breaks_recovery_batch09_freeze_contract.py \
            tools/trading_breaks_recovery_batch01.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json \
            04-REFERENCE/HISTORICAL-TRADING-BREAKS-RECOVERY-PROGRESSION-CONTRACT.md \
            tools/trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_progression.py \
            04-REFERENCE/HISTORICAL-TRADING-BREAKS-RECOVERY-PROTOCOL.md \
            tools/trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_coverage_execution_window_boundary.py
          git diff --exit-code e1dce6a85aed3785c151c0b3e51138219cc50f87 HEAD -- \
            reports/data-qualification/historical_trading_breaks_recovery_batch09_runtime.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install adjudication-only test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.4.2

      - name: Verify locked external execution provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_JSON="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34993614373)"
          test "$(printf '%s' "$RUN_JSON" | jq -r '.conclusion')" = "success"
          test "$(printf '%s' "$RUN_JSON" | jq -r '.head_sha')" = "0b5dedf6028add27040af112d0bceef76be25827"
          JOBS_JSON="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34993614373/jobs)"
          test "$(printf '%s' "$JOBS_JSON" | jq -r '.jobs[] | select(.id == 104464228483) | .name')" = "batch09"
          test "$(printf '%s' "$JOBS_JSON" | jq -r '.jobs[] | select(.id == 104464228483) | .conclusion')" = "success"
          ARTIFACT_JSON="$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10406357435)"
          test "$(printf '%s' "$ARTIFACT_JSON" | jq -r '.expired')" = "false"
          test "$(printf '%s' "$ARTIFACT_JSON" | jq -r '.digest')" = "sha256:dc241bac2c214ad562b9efc5ce8f3ad16705d967c82d0bfbd51e5084323220cc"
          test "$(printf '%s' "$ARTIFACT_JSON" | jq -r '.workflow_run.id')" = "34993614373"
          test "$(printf '%s' "$ARTIFACT_JSON" | jq -r '.workflow_run.head_sha')" = "0b5dedf6028add27040af112d0bceef76be25827"
          echo 'PASS: locked run/job/artifact/hash/probe provenance matches GitHub Actions'

      - name: Run complete governed and Batch 09 adjudication regression
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_*.py \
            tests/test_dukascopy_usatech_calendar*.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Prove adjudicator has no browser probe or live membership path
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path('tools/trading_breaks_recovery_batch09_adjudication.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          imports = set()
          calls = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.lower() for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add((node.module or '').lower())
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id.lower())
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr.lower())
          assert not any('playwright' in item or 'selenium' in item for item in imports)
          for forbidden in (
              'probe_candidate',
              'eligible_recovery_queue',
              'recovery_queue',
              'progression_decisions',
              'derive_batch09_membership',
          ):
              assert forbidden not in calls, forbidden
          assert 'batch09_targets' in calls
          assert 'validate_positive_recovery_against_frozen_batch' in calls
          print('PASS: adjudicator is offline and consumes immutable frozen Batch 09 only')
          PY

      - name: Independently adjudicate persisted Batch 09 runtime
        run: python -m tools.trading_breaks_recovery_batch09_adjudication

      - name: Assert authoritative adjudication result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('reports/data-qualification/historical_trading_breaks_recovery_batch09_adjudication.json').read_text(encoding='utf-8'))
          assert report['verdict'] == 'PASS'
          assert report['attempted'] == 5
          assert report['pass'] == 4
          assert report['blocked'] == 1
          assert report['fail'] == 0
          assert [item['verdict'] for item in report['adjudications']] == ['PASS','PASS','PASS','PASS','BLOCKED']
          dec25 = report['adjudications'][4]
          assert dec25['target_date'] == '2024-12-25'
          assert dec25['reason'] == 'NO_EXACT_TARGET_DATE_POSITIVE_RECORD_ADMISSIBLE'
          assert dec25['broker_record_id'] == '74339'
          assert dec25['capture_verdict'] == 'CAPTURED'
          assert 'break_start_utc' not in dec25
          assert 'fully_closed_hours_utc' not in dec25
          print('PASS: Batch 09 independent adjudication = 4 PASS / 1 BLOCKED / 0 FAIL; Dec 25 cross-date not promoted')
          PY

      - name: Prove adjudication did not mutate governed executable state
        run: |
          git diff --exit-code -- \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json \
            tools/trading_breaks_recovery_progression.py \
            tools/trading_breaks_recovery_protocol.py \
            tools/trading_breaks_recovery_batch09.py \
            reports/data-qualification/historical_trading_breaks_recovery_batch09_runtime.json

      - name: Persist adjudication evidence only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            reports/data-qualification/historical_trading_breaks_recovery_batch09_adjudication.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch09_qualification.md
          git diff --cached --check
          git commit -m 'evidence: persist Trading Breaks Batch 09 adjudication'
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
