name: SMF Post-M10 DRE-03 Result Integrity

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'artifacts/smf_ap1_m03_02_r1_post_m10_dre_03/**'
      - 'reports/program/*POST-M10-DRE-03*'
      - 'tests/test_smf_ap1_m03_02_r1_post_m10_dre_03_result_integrity.py'
      - '.github/workflows/smf-ap1-m03-02-r1-post-m10-dre-03-result-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: DRE-03 persisted result integrity only
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_dre_03_result_integrity.py
      - name: DRE-02 synthetic regression only
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_dre_02.py
      - name: Assert no real-source file committed
        run: |
          test -z "$(find . -type f -name 'M03-R1-REAL-e73a24ca.json' -print -quit)"
      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
