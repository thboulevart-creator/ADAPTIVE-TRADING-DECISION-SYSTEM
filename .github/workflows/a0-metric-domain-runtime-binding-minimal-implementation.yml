name: A0 Metric-Domain Runtime Binding Minimal Implementation

on:
  push:
    branches:
      - sandbox/a0-metric-domain-runtime-binding-minimal-implementation
    paths:
      - .github/workflows/a0-metric-domain-runtime-binding-minimal-implementation.yml

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 083baee8813a96cd8e9b4ca57b454c8190fe9878
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify exact candidate scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "083baee8813a96cd8e9b4ca57b454c8190fe9878"
          python - <<'PY'
          import subprocess
          got=set(subprocess.check_output(
              ["git","diff","--name-only",
               "3b4e5f055ac427265c1bde6027262d2ca4271d14",
               "083baee8813a96cd8e9b4ca57b454c8190fe9878"],
              text=True,
          ).splitlines())
          assert got=={"src/a0_research_authority.py"}, got
          PY

      - name: Verify protected identities
        shell: bash
        run: |
          test "$(git hash-object src/a0_research_authority.py)" = "1210bee06a2d9aed2ed7d9078542934ff430175c"
          test "$(git hash-object src/a0_metric_domain_authority.py)" = "9bd05f2a2a97f092c0fc2988319f15caff57dda3"
          test "$(git hash-object GOVERNANCE/A0-SYNTHETIC-PRODUCER-METRIC-DOMAIN-AUTHORITY-V0.1.json)" = "dd205d3e7b4a522a5ba23cef1e665d51c196acb8"
          test "$(git hash-object GOVERNANCE/A0-SYNTHETIC-PRODUCER-METRIC-DOMAIN-RUNTIME-BINDING-TEST-FIRST-RED-V0.1.json)" = "935661cbdf4dee031a738e37969baafa0a975d81"
          test "$(git hash-object breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py)" = "bcba5de33a73f9e32ff39e8fb498ab4d471af098"
          test "$(git hash-object breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py)" = "e3620ac348a8042fe1d04cfc9b32c16060fce4a3"
          test "$(git hash-object breakers/a0_research_authority_red_breaker.py)" = "e02ecfa6d30c2877a33f5c5d81b161ee562202b6"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v01.py)" = "2911d5b282ccbb6147b2b54a7db5c357c2d315b6"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v02.py)" = "9833ce563305cfb6d6fe1de8907e8aa9fc96fda4"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v03.py)" = "d23e3c72dd8bd2200cb392edc6c80b4e744d4751"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v04.py)" = "efcc3ca7927b29b45f5d0dc0180b81176dbed51e"
          test "$(git hash-object GOVERNANCE/A0-RESEARCH-FINDINGS-AUTHORITY-INTERPRETATION-CONTRACT-V0.3.md)" = "f1168481879f33f8762dcb1e19e2ad35211c8ec2"
          ! grep -q "FOREIGN_METRIC" breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py

      - name: Compile runtime and qualifier
        run: |
          python -m py_compile src/a0_research_authority.py
          python -m py_compile src/a0_metric_domain_authority.py

      - name: Run full frozen 127-test surface
        shell: bash
        run: |
          python -m pytest -q             breakers/a0_research_authority_red_breaker.py             breakers/a0_research_authority_adversarial_breaker_v01.py             breakers/a0_research_authority_adversarial_breaker_v02.py             breakers/a0_research_authority_adversarial_breaker_v03.py             breakers/a0_research_authority_adversarial_breaker_v04.py             breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py             breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py             | tee /tmp/a0-binding-candidate.txt
          grep -q "127 passed" /tmp/a0-binding-candidate.txt
          echo "A0_METRIC_DOMAIN_RUNTIME_BINDING_MINIMAL_IMPLEMENTATION=PASS_127_OF_127"
