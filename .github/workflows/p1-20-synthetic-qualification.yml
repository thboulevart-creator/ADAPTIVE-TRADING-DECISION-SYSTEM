name: P1-20 Common Downstream Synthetic Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/p1-20-synthetic-qualification.yml'
      - '.github/workflows/p1-20-red-baseline.yml'
      - 'src/p1_12d_qualified_execution_evidence.py'
      - 'src/p1_13c_common_evaluation.py'
      - 'src/p1_14c_common_measurement_provenance.py'
      - 'src/p1_15c_common_evaluator_authority.py'
      - 'src/p1_16c_common_qualified_finding.py'
      - 'tests/p1_20_fixture.py'
      - 'tests/test_p1_20_common_downstream.py'
      - 'breakers/p1_20_common_downstream_breaker.py'
      - 'reports/program/*P1-20*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  P1_20_RECONCILED_PARENT: '0d67013e20e3d2a9fcec26bec8de62c015955711'

jobs:
  p1-20:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove persisted HEAD and ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${P1_20_RECONCILED_PARENT}" HEAD

      - name: Prove frozen P1-19 and RED identities
        run: |
          test "$(git hash-object GOVERNANCE/P1-19-ARCHITECTURE-SELECTION-V0.1.md)" = "832574ed747988d6df11dfb5f9c457ced30f3c26"
          test "$(git hash-object GOVERNANCE/P1-19-COMMON-QUALIFIED-EXECUTION-EVIDENCE-CONTRACT-V0.1.json)" = "d3a259f032db3a2d882e1e0403936476701a7cd3"
          test "$(git hash-object GOVERNANCE/P1-19-FROZEN-ADVERSARIAL-BREAKER-CONTRACT-V0.1.json)" = "07f6d170ddd1afab20bec1e45c7fad6cc32fdf65"
          test "$(git hash-object reports/program/2026-10-05-P1-19-FINAL-DOCUMENTARY-QUALIFICATION.md)" = "70fea3d9716bbc6070e408e456517dd74a8f5c56"
          test "$(git hash-object reports/program/2026-10-05-P1-19-FINAL-DOCUMENTARY-CLOSURE-RECEIPT-V0.1.json)" = "2d6dd8d139235006a4ec77286ae4b81050427ce5"
          test "$(git hash-object breakers/p1_20_common_downstream_breaker.py)" = "eb958d866acb0d69af405768c980cbd3296cb715"
          test "$(git hash-object reports/program/2026-10-05-P1-20-TEST-FIRST-RED-RECEIPT-V0.1.json)" = "1221e564623b20e509deb078b0449cf8253ded54"

      - name: Prove legacy and native-owner firewalls
        run: |
          test "$(git hash-object src/linked_experiment_execution.py)" = "f2fa07178134e04963d42d1fbdda1a8f7bad179d"
          test "$(git hash-object src/p1_12c_qualified_producer_execution.py)" = "6d634ed1adab21ce31a55289d8d6e5b288e70005"
          test "$(git hash-object src/experiment_evaluation_submission.py)" = "968ef47d0fc4e066374b7471110c71d0eaf28865"
          test "$(git hash-object src/experiment_measurement_provenance.py)" = "4ce8ceb7e46ac2f6ffbd97560225d559ea7757f5"
          test "$(git hash-object src/experiment_evaluator_authority.py)" = "bfab3c421263434d5e3e3066720f95abb521b09c"
          test "$(git hash-object src/qualified_experimental_finding.py)" = "a5c6b820df5ea5e89fd61c84feb42cb42e923a5f"

      - name: Prove exact P1-20 implementation identities
        run: |
          test "$(git hash-object src/p1_12d_qualified_execution_evidence.py)" = "2bbc59f248d1c735fba93a35fc8c00b3ab6c7190"
          test "$(git hash-object src/p1_13c_common_evaluation.py)" = "617c39505cdd64e8a7a40a40612b4bec0c30ed34"
          test "$(git hash-object src/p1_14c_common_measurement_provenance.py)" = "7bd6a91a69484213b4d26d25bd18d62019c77b08"
          test "$(git hash-object src/p1_15c_common_evaluator_authority.py)" = "a0c7ced052a734ce44d580f2430081f8f8647a47"
          test "$(git hash-object src/p1_16c_common_qualified_finding.py)" = "92967f7789537399510ac2c61ceab5b52268c931"
          test "$(git hash-object tests/p1_20_fixture.py)" = "3d08058d681a78060f5b40cebea21ebe37e67108"
          test "$(git hash-object tests/test_p1_20_common_downstream.py)" = "03c4f25da8d5a987e599005691af816411456dbc"
          test "$(git hash-object .github/workflows/p1-20-red-baseline.yml)" = "364b5a3255b5244da6b5b93d4de45dd88ef0f7e4"

      - name: Prove P1-20 delta is strictly bounded
        run: |
          python - <<'PY'
          import subprocess
          parent="0d67013e20e3d2a9fcec26bec8de62c015955711"
          changed=subprocess.check_output(["git","diff","--name-only",f"{parent}..HEAD"],text=True).splitlines()
          exact={
              ".github/workflows/p1-20-red-baseline.yml",
              ".github/workflows/p1-20-synthetic-qualification.yml",
              "breakers/p1_20_common_downstream_breaker.py",
              "src/p1_12d_qualified_execution_evidence.py",
              "src/p1_13c_common_evaluation.py",
              "src/p1_14c_common_measurement_provenance.py",
              "src/p1_15c_common_evaluator_authority.py",
              "src/p1_16c_common_qualified_finding.py",
              "tests/p1_20_fixture.py",
              "tests/test_p1_20_common_downstream.py",
          }
          for path in changed:
              if path in exact:
                  continue
              if path.startswith("reports/program/") and "P1-20" in path:
                  continue
              raise SystemExit(f"UNAUTHORIZED_P1_20_DELTA:{path}")
          print("PASS: P1-20 delta strictly bounded")
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Compile P1-20 surfaces without filesystem mutation
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              "src/p1_12d_qualified_execution_evidence.py",
              "src/p1_13c_common_evaluation.py",
              "src/p1_14c_common_measurement_provenance.py",
              "src/p1_15c_common_evaluator_authority.py",
              "src/p1_16c_common_qualified_finding.py",
              "tests/p1_20_fixture.py",
              "tests/test_p1_20_common_downstream.py",
          ):
              p=Path(name)
              compile(p.read_text(encoding="utf-8"),str(p),"exec")
          print("PASS: P1-20 sources compile")
          PY

      - name: Replay exact frozen 24-case P1-19 breaker
        run: python -m pytest -q breakers/p1_20_common_downstream_breaker.py

      - name: Dual-owner synthetic common-downstream qualification
        run: python -m pytest -q tests/test_p1_20_common_downstream.py

      - name: Full protected legacy P1.12B to P1.16 regression
        run: |
          python -m pytest -q             breakers/p1_12b_linked_experiment_execution_breaker.py             breakers/p1_13b_experiment_evaluation_submission_breaker.py             breakers/p1_14b_measurement_provenance_breaker.py             breakers/p1_15b_experiment_evaluator_authority_breaker.py             breakers/p1_16_qualified_experimental_finding_breaker.py

      - name: Protected P1.12C regression
        run: python -m pytest -q breakers/p1_18_qualified_producer_execution_breaker.py

      - name: Prove AP1 remains unexecuted
        run: |
          test ! -e ATDS-AP1-INTRADAY-SPREAD-CENSUS.json
          test ! -e /tmp/ATDS-AP1-INTRADAY-SPREAD-CENSUS.json
          echo "PASS: AP1 not executed"

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
