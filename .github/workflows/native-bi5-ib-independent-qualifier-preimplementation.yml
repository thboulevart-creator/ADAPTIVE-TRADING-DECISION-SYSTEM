name: Native BI5 I_B Independent Qualifier Preimplementation RED

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/native-bi5-ib-independent-qualifier-preimplementation.yml'
      - 'breakers/native_bi5_ib_independent_qualifier_breaker.py'
      - 'reports/data-qualification/iab_native_bi5_implementation_boundary_candidate_2026-09-19.md'
      - 'reports/data-qualification/iab_native_bi5_candidate_adversarial_break_2026-09-19.md'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
      - 'src/native_bi5_reference_qualifier.py'
      - 'src/native_bi5_independent_qualifier.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  IAB_BOUNDARY_BLOB: 'fac8d143a836b0c02538c607ac5ab71357824537'
  IAB_REBREAK_BLOB: '6653953562ffaa5f7d8ff23578356ab794f37827'
  IB_BREAKER_BLOB: 'e8f6d3b41a1ecd8acdfb01090d7499cb24d93dea'

jobs:
  preimplementation-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD and governed boundary identities
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object reports/data-qualification/iab_native_bi5_implementation_boundary_candidate_2026-09-19.md)" = "${IAB_BOUNDARY_BLOB}"
          test "$(git hash-object reports/data-qualification/iab_native_bi5_candidate_adversarial_break_2026-09-19.md)" = "${IAB_REBREAK_BLOB}"
          test "$(git hash-object breakers/native_bi5_ib_independent_qualifier_breaker.py)" = "${IB_BREAKER_BLOB}"

      - name: Prove I_B production candidate is still absent
        run: |
          test ! -e src/native_bi5_independent_qualifier.py
          echo 'PASS: expected preimplementation state — I_B runtime candidate absent'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Execute I_B test-first breaker — expected RED only because runtime is absent
        run: python -m pytest -q breakers/native_bi5_ib_independent_qualifier_breaker.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
