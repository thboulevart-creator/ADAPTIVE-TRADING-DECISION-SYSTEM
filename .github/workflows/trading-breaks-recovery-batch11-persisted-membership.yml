name: Batch 11 Persisted Membership Re-break
on:
  push:
    branches: [feat/multi-year-dukascopy-acquisition]
    paths: ['.github/workflows/trading-breaks-recovery-batch11-persisted-membership.yml']
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_trading_breaks_recovery_*.py tests/test_dukascopy_usatech_calendar*.py tests/test_coverage_execution_window_boundary.py
      - run: |
          python - <<'PY'
          from tools.trading_breaks_recovery_batch11 import batch11_targets
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue, progression_decisions, load_attempt_ledger, load_material_capability_changes
          from tools.trading_breaks_recovery_protocol import recovery_queue
          f=batch11_targets(); e=eligible_recovery_queue(); d={x.target_date:x for x in progression_decisions()}; _,_,a=load_attempt_ledger()
          assert f==e[:5] and len(f)==5
          assert len(recovery_queue())==31 and len(e)==18 and len(a)==50
          assert sum((not x.eligible) and x.latest_attempt_outcome=='BLOCKED' for x in d.values())==13
          assert load_material_capability_changes()==[]
          for day,reason in f:
              x=d[day]; assert x.candidate_reason==reason and x.eligible and x.reason=='INITIAL_ATTEMPT' and x.latest_attempt_id is None
          print('PASS: persisted Batch 11 membership matches governed prefix')
          PY
      - run: |
          BEFORE="$(sha256sum reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json | awk '{print $1}')"
          python -m tools.trading_breaks_recovery_progression >/tmp/b11.json
          AFTER="$(sha256sum reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"
          git diff --exit-code
          test -z "$(git status --porcelain)"
