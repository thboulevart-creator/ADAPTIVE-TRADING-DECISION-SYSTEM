name: AO-E0 B8 M06 Planning Dispersion Qualification
on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/ao-e0-b8-m06-01-qualification.yml'
      - 'GOVERNANCE/AO-E0-B8-M06-01-*'
      - 'tools/ao_e0_b8_m06_01_planning_dispersion.py'
      - 'breakers/ao_e0_b8_m06_01_breaker.py'
      - 'tests/test_ao_e0_b8_m06_01.py'
      - 'reports/program/*AO-E0-B8-M06-01*'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: Breaker
        run: python -m pytest -q -p no:cacheprovider breakers/ao_e0_b8_m06_01_breaker.py
      - name: Qualification tests
        run: python -m pytest -q -p no:cacheprovider tests/test_ao_e0_b8_m06_01.py
      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
