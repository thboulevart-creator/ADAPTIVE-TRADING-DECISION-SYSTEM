name: AO-E0 B8 M06 Recovery Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/ao-e0-b8-m06-01-qualification.yml'
      - 'GOVERNANCE/AO-E0-B8-M06-01-*'
      - 'tools/ao_e0_b8_m06_recovery.py'
      - 'tests/test_ao_e0_b8_m06_01.py'
      - 'reports/program/evidence/ao-e0-b8-m06/**'
      - 'reports/program/*AO-E0-B8-M06-01*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Exact package qualification
        run: python tools/ao_e0_b8_m06_recovery.py
      - name: Adversarial qualification
        run: python -m pytest -q -p no:cacheprovider tests/test_ao_e0_b8_m06_01.py
      - name: Prove no strategy execution output
        run: |
          test ! -e AO-E0-RESULT.json
          test ! -e AO-E0-FORWARD.json
          echo "PASS: recovery only"
      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
