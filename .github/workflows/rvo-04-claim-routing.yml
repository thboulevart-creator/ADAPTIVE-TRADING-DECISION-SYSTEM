name: RVO-04 Claim Routing Design Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/rvo-04-claim-routing.yml'
      - 'GOVERNANCE/RVO-04-*'
      - 'breakers/rvo_04_claim_routing_breaker.py'
      - 'reports/program/*RVO-04*'
      - 'GOVERNANCE/RVO-03-CANONICAL-OWNER-CAPABILITY-MATRIX-V0.1.json'
      - 'GOVERNANCE/MCEPR-ACTIVATION-CONTRACT-V0.2.json'
      - 'src/rvo_orchestrator.py'
      - 'breakers/rvo_02_frozen_breaker_v0_1.py'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  RVO04_PARENT: '2cc20a84eb1979febec41f36aeb657a93d0f6a01'

jobs:
  rvo-04:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD and RVO-03 ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${RVO04_PARENT}" HEAD

      - name: Prove frozen RVO-01 through RVO-03 identities
        run: |
          test "$(git hash-object src/rvo_orchestrator.py)" = "20766da0d609d0056e40df0115a3151d5c703938"
          test "$(git hash-object breakers/rvo_02_frozen_breaker_v0_1.py)" = "c5835e8a0a9c3ff26201a5860d0866478b3cdacb"
          test "$(git hash-object GOVERNANCE/RVO-03-CANONICAL-OWNER-CAPABILITY-MATRIX-V0.1.json)" = "5f2406189af8e118ca8f20f5a7f92f3a2ce91c13"
          test "$(git hash-object src/rvo_owner_adapters.py)" = "7ded32616fa959ecdc7857dad95b53884f58c15a"
          test "$(git hash-object tests/test_rvo_owner_integration.py)" = "5fb325e420a72a64ae024fbea0b8332cd0dcc63f"
          test "$(git hash-object reports/program/2026-10-04-RVO-03-CANONICAL-OWNER-INTEGRATION-QUALIFICATION-RECEIPT-V0.1.json)" = "611da4247a62ebfb2e5d9962e44ab0a72f3c96be"
          test "$(git hash-object reports/program/2026-10-04-RVO-03-CANONICAL-OWNER-INTEGRATION-QUALIFICATION.md)" = "d7e1f01c3e0b51ae0c8f77f417966ab6abdee52f"

      - name: Prove exact RVO-04 design identities
        run: |
          test "$(git hash-object GOVERNANCE/RVO-04-CLAIM-CLASS-TAXONOMY-V0.1.json)" = "1fa07fb4b262bfc2a867e66914ce4221cdcd1f79"
          test "$(git hash-object GOVERNANCE/RVO-04-CLAIM-CAPABILITY-GRAPH-V0.1.json)" = "fcd723a30bad063471d7a399c06464b580c87e77"
          test "$(git hash-object GOVERNANCE/RVO-04-OWNER-GAP-PRIORITIZATION-V0.1.json)" = "4c5720b593fc8e955103c55b9ab37b5e6c3e83da"
          test "$(git hash-object GOVERNANCE/RVO-04-REAL-EXPERIMENT-READINESS-DESIGN-V0.1.md)" = "3f6875e1a1a1aa36396d10c43eae25478963a48a"

      - name: Prove RVO-04 delta does not modify owners
        run: |
          python - <<'PY'
          import subprocess
          parent = "2cc20a84eb1979febec41f36aeb657a93d0f6a01"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{parent}..HEAD"],
              text=True,
          ).splitlines()
          exact = {
              ".github/workflows/rvo-04-claim-routing.yml",
              "GOVERNANCE/RVO-04-CLAIM-CLASS-TAXONOMY-V0.1.json",
              "GOVERNANCE/RVO-04-CLAIM-CAPABILITY-GRAPH-V0.1.json",
              "GOVERNANCE/RVO-04-OWNER-GAP-PRIORITIZATION-V0.1.json",
              "GOVERNANCE/RVO-04-REAL-EXPERIMENT-READINESS-DESIGN-V0.1.md",
              "breakers/rvo_04_claim_routing_breaker.py",
          }
          for path in changed:
              if path in exact:
                  continue
              if path.startswith("reports/program/") and "RVO-04" in path:
                  continue
              raise SystemExit(f"UNAUTHORIZED_RVO04_DELTA:{path}")
          print("PASS: RVO-04 delta is design/RVO-only")
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Execute RVO-04 claim-routing breaker
        run: python -m pytest -q breakers/rvo_04_claim_routing_breaker.py

      - name: Replay unchanged RVO-02 frozen breaker
        run: python -m pytest -q breakers/rvo_02_frozen_breaker_v0_1.py

      - name: Replay RVO-03 canonical owner integration
        run: python -m pytest -q tests/test_rvo_owner_integration.py

      - name: Re-break protected owner surfaces
        run: |
          python -m pytest -q             breakers/p1_16_qualified_experimental_finding_breaker.py             breakers/smf03_core_foundation_red_breaker.py             breakers/smf03_dependence_inference_red_breaker.py             breakers/smf03_evidence_governance_red_breaker.py             breakers/mcepr_registry_breaker_v0_1.py             breakers/p22_01_pure_state_projector_red_breaker.py             breakers/p22_02_identity_state_verifier_red_breaker.py             breakers/p22_03_evidence_envelope_recorder_red_breaker.py             tests/test_dataset_admissibility.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
