name: A0 Adversarial Break Expansion V0.3 Persisted Rebreak

on:
  push:
    branches:
      - sandbox/a0-adversarial-break-expansion-v03-persisted-rebreak
    paths:
      - .github/workflows/a0-adversarial-break-expansion-v03-persisted-rebreak.yml

permissions:
  contents: read

jobs:
  rebreak-v03:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact persisted V0.3 break HEAD
        uses: actions/checkout@v4
        with:
          ref: 64d4c8d4dac39264045e8dca1326fdac79da6025
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify exact persisted HEAD and scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "64d4c8d4dac39264045e8dca1326fdac79da6025"
          python - <<'PY'
          import subprocess
          expected = {
              "04-REFERENCE/RECOVERY-CHECKPOINT.md",
              "breakers/a0_research_authority_adversarial_breaker_v03.py",
              "reports/program/2026-09-27-A0-ADVERSARIAL-BREAK-EXPANSION-V0.3-FAIL.md",
          }
          got = set(subprocess.check_output(
              ["git", "diff", "--name-only",
               "731380d8f1dd851c52de732c1edaf70f28ecc3c5",
               "64d4c8d4dac39264045e8dca1326fdac79da6025"],
              text=True,
          ).splitlines())
          assert got == expected, (got, expected)
          PY

      - name: Verify protected identities
        shell: bash
        run: |
          test "$(git hash-object src/a0_research_authority.py)" = "f0015894d001c0ced7d0edf881947e3a435ab5ca"
          test "$(git hash-object breakers/a0_research_authority_red_breaker.py)" = "e02ecfa6d30c2877a33f5c5d81b161ee562202b6"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v01.py)" = "2911d5b282ccbb6147b2b54a7db5c357c2d315b6"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v02.py)" = "9833ce563305cfb6d6fe1de8907e8aa9fc96fda4"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v03.py)" = "d23e3c72dd8bd2200cb392edc6c80b4e744d4751"
          test "$(git hash-object GOVERNANCE/A0-RESEARCH-FINDINGS-AUTHORITY-INTERPRETATION-CONTRACT-V0.3.md)" = "f1168481879f33f8762dcb1e19e2ad35211c8ec2"

      - name: Compile runtime and breakers
        run: |
          python -m py_compile src/a0_research_authority.py
          python -m py_compile breakers/a0_research_authority_red_breaker.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v01.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v02.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v03.py

      - name: Preserve existing closed 42-test suite
        shell: bash
        run: |
          python -m pytest -q             breakers/a0_research_authority_red_breaker.py             breakers/a0_research_authority_adversarial_breaker_v01.py             breakers/a0_research_authority_adversarial_breaker_v02.py             | tee /tmp/a0-existing-42.txt
          grep -q "42 passed" /tmp/a0-existing-42.txt
          echo "A0_EXISTING_42=PASS_UNCHANGED"

      - name: Reproduce exact V0.3 failure profile
        shell: bash
        run: |
          set +e
          python -m pytest -q             breakers/a0_research_authority_adversarial_breaker_v03.py             > /tmp/a0-v03-persisted.txt 2>&1
          status=$?
          set -e
          cat /tmp/a0-v03-persisted.txt
          test "$status" -ne 0
          grep -q "10 failed, 12 passed" /tmp/a0-v03-persisted.txt
          grep -q "test_ad04_semantically_equal_registry_bytes_cannot_repin_authority" /tmp/a0-v03-persisted.txt
          grep -q "test_ad05_semantically_equal_profile_bytes_plus_rehashed_registry_rejected" /tmp/a0-v03-persisted.txt
          grep -q "test_ad06_semantically_equal_policy_bytes_cannot_repin_authority" /tmp/a0-v03-persisted.txt
          grep -q "test_ad07_semantically_equal_preregistration_bytes_cannot_repin_authority" /tmp/a0-v03-persisted.txt
          grep -q "test_ad08_registry_supersession_metadata_forgery_rejected" /tmp/a0-v03-persisted.txt
          grep -q "test_ad09_global_native_status_is_preserved" /tmp/a0-v03-persisted.txt
          grep -q "test_ad10_missing_profile_declared_native_status_path_rejected" /tmp/a0-v03-persisted.txt
          grep -q "test_ad13_measurement_scope_is_preserved_exactly" /tmp/a0-v03-persisted.txt
          grep -q "test_ad15_present_narrative_has_opaque_reference_not_semantic_authority" /tmp/a0-v03-persisted.txt
          grep -q "test_ad16_same_schema_permission_table_mutation_rejected" /tmp/a0-v03-persisted.txt
          echo "A0_V03_PERSISTED_REBREAK=PASS_FAILURE_PROFILE_REPRODUCED"
