name: P1-18 Synthetic Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/p1-18-synthetic-qualification.yml'
      - '.github/workflows/p1-18-red-baseline.yml'
      - 'src/p1_12c_qualified_producer_execution.py'
      - 'tools/p1_12c_sandbox_runner.py'
      - 'tests/p1_18_synthetic_producer.py'
      - 'tests/p1_18_fixture.py'
      - 'tests/test_p1_18_qualified_producer_execution.py'
      - 'breakers/p1_18_qualified_producer_execution_breaker.py'
      - 'reports/program/*P1-18*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  P1_18_RECONCILED_PARENT: '07a54720284acbfd0a94a727ebd58468d26a1e06'

jobs:
  p1-18:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove persisted HEAD and ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${P1_18_RECONCILED_PARENT}" HEAD

      - name: Prove frozen P1-17 and RED identities
        run: |
          test "$(git hash-object GOVERNANCE/P1-17-QUALIFIED-PRODUCER-EXECUTION-CONTRACT-V0.1.json)" = "164bb9027bb7a241b3a14b1f6704e9be8b2bef7d"
          test "$(git hash-object GOVERNANCE/P1-17-FROZEN-ADVERSARIAL-BREAKER-CONTRACT-V0.1.json)" = "9ab0f9018dd6e9def4a5e35b8e9a35c3beb556bc"
          test "$(git hash-object breakers/p1_18_qualified_producer_execution_breaker.py)" = "7f40b525e16ca06306cba3ae59f03cb08c71d0cd"
          test "$(git hash-object reports/program/2026-10-05-P1-18-TEST-FIRST-RED-RECEIPT-V0.1.json)" = "69abcade9791e8826e201f718b753061ee5f1321"

      - name: Prove protected owner identities unchanged
        run: |
          test "$(git hash-object src/data/claim_scoped_admission.py)" = "6ce06e1583e61be9e8618136d1bc8fdda608ffd7"
          test "$(git hash-object tools/ap1_intraday_spread_census.py)" = "9f613063fb8a190a1ff6f2f8b12c97c4ed97712a"
          test "$(git hash-object src/experiment_execution_binding.py)" = "5419ad7caf4dbfa2a621b060d3f42bc090e97077"
          test "$(git hash-object src/qualified_experiment_execution_input.py)" = "6700fbbef314bc9c6e5b7f6f374e71cfabee0f92"
          test "$(git hash-object src/linked_experiment_execution.py)" = "f2fa07178134e04963d42d1fbdda1a8f7bad179d"
          test "$(git hash-object src/experiment_evaluation_submission.py)" = "968ef47d0fc4e066374b7471110c71d0eaf28865"
          test "$(git hash-object src/experiment_measurement_provenance.py)" = "4ce8ceb7e46ac2f6ffbd97560225d559ea7757f5"
          test "$(git hash-object src/experiment_evaluator_authority.py)" = "bfab3c421263434d5e3e3066720f95abb521b09c"
          test "$(git hash-object src/qualified_experimental_finding.py)" = "a5c6b820df5ea5e89fd61c84feb42cb42e923a5f"
          test "$(git hash-object src/research/execution.py)" = "6ca117f2cd760b299b14933f308cfc1b2466ae0d"
          test "$(git hash-object src/research/engine.py)" = "6e0a4c68ca75cea27b7691477f98e5566f2b8cac"

      - name: Prove exact P1-18 implementation identities
        run: |
          test "$(git hash-object src/p1_12c_qualified_producer_execution.py)" = "6d634ed1adab21ce31a55289d8d6e5b288e70005"
          test "$(git hash-object tools/p1_12c_sandbox_runner.py)" = "08fbd6f4b2cd4db9cb714f583c1459d0753a9112"
          test "$(git hash-object tests/p1_18_synthetic_producer.py)" = "06d48e6253e6f94cb3eebf3aa53f3fd96a5ad7b0"
          test "$(git hash-object tests/p1_18_fixture.py)" = "83878b17f854a28db10adde845e1d811a7ba6599"
          test "$(git hash-object tests/test_p1_18_qualified_producer_execution.py)" = "c20d6052b7ae394ce61a53ee6b7bfa3d548493b1"

      - name: Prove P1-18 delta is strictly bounded
        run: |
          python - <<'PY'
          import subprocess
          parent = "07a54720284acbfd0a94a727ebd58468d26a1e06"
          changed = subprocess.check_output(["git","diff","--name-only",f"{parent}..HEAD"],text=True).splitlines()
          exact = {
              ".github/workflows/p1-18-red-baseline.yml",
              ".github/workflows/p1-18-synthetic-qualification.yml",
              "breakers/p1_18_qualified_producer_execution_breaker.py",
              "src/p1_12c_qualified_producer_execution.py",
              "tools/p1_12c_sandbox_runner.py",
              "tests/p1_18_synthetic_producer.py",
              "tests/p1_18_fixture.py",
              "tests/test_p1_18_qualified_producer_execution.py",
          }
          for path in changed:
              if path in exact:
                  continue
              if path.startswith("reports/program/") and "P1-18" in path:
                  continue
              raise SystemExit(f"UNAUTHORIZED_P1_18_DELTA:{path}")
          print("PASS: P1-18 delta strictly bounded")
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Emit exact P1-18 runtime lock identity
        run: |
          python - <<'PY'
          from src import p1_12c_qualified_producer_execution as p12c
          lock = p12c.build_current_runtime_lock()
          print("P1_18_RUNTIME_LOCK_DIGEST=" + lock["runtime_lock_digest"])
          print("P1_18_PYTHON_VERSION=" + lock["python_version"])
          print("P1_18_PYTHON_EXECUTABLE_SHA256=" + lock["python_executable_sha256"])
          print("P1_18_TIMEZONE_DATABASE_IDENTITY=" + lock["timezone_database_identity"])
          PY

      - name: Compile P1-18 surfaces without filesystem mutation
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              "src/p1_12c_qualified_producer_execution.py",
              "tools/p1_12c_sandbox_runner.py",
              "tests/p1_18_synthetic_producer.py",
              "tests/p1_18_fixture.py",
              "tests/test_p1_18_qualified_producer_execution.py",
          ):
              p=Path(name)
              compile(p.read_text(encoding="utf-8"),str(p),"exec")
          print("PASS: P1-18 sources compile")
          PY

      - name: Replay exact frozen 32-case P1-17 breaker
        run: python -m pytest -q breakers/p1_18_qualified_producer_execution_breaker.py

      - name: Positive P1-18 synthetic qualification
        run: python -m pytest -q tests/test_p1_18_qualified_producer_execution.py

      - name: Protected P1.10B-P1.16 regressions
        run: |
          python -m pytest -q             breakers/p1_10b_experiment_execution_binding_breaker.py             breakers/p1_11b_qualified_experiment_execution_input_breaker.py             breakers/p1_12b_linked_experiment_execution_breaker.py             breakers/p1_13b_experiment_evaluation_submission_breaker.py             breakers/p1_14b_measurement_provenance_breaker.py             breakers/p1_15b_experiment_evaluator_authority_breaker.py             breakers/p1_16_qualified_experimental_finding_breaker.py

      - name: Protected DATA-02 regression
        run: python -m pytest -q breakers/data_02_claim_scoped_admission_breaker.py

      - name: Protected P0.4 producer-junction regression
        run: python -m pytest -q tests/test_research_producer_junction_tier_a.py

      - name: Protected P0.5 interprocess regression
        run: python -m pytest -q tests/test_research_interprocess_reattestation_tier_a.py

      - name: Prove AP1 remains unexecuted by P1-18 workflow
        run: |
          test ! -e ATDS-AP1-INTRADAY-SPREAD-CENSUS.json
          test ! -e /tmp/ATDS-AP1-INTRADAY-SPREAD-CENSUS.json
          echo "PASS: AP1 not executed"

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
