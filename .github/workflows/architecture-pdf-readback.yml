name: Architecture PDF Readback

on:
  push:
    branches: [feat/multi-year-dukascopy-acquisition]
    paths:
      - '.github/workflows/architecture-pdf-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract PDF text and render pages from checked-out snapshot
        run: |
          python -m pip install pypdf==6.0.0 pymupdf==1.26.4
          mkdir -p /tmp/architecture-readback/pages
          python - <<'PY'
          from pathlib import Path
          import fitz
          from pypdf import PdfReader

          path = Path('Carte Architecturale Snapshots Claude/ADTS-plan-systeme-autonome.pdf')
          reader = PdfReader(str(path))
          chunks = [f'PAGE_COUNT={len(reader.pages)}\n']
          for i, page in enumerate(reader.pages, 1):
              text = page.extract_text() or ''
              chunks.append(f'\n===== PAGE {i} =====\n{text}\n')
          Path('/tmp/architecture-readback/pdf-text.txt').write_text(''.join(chunks), encoding='utf-8')

          doc = fitz.open(path)
          matrix = fitz.Matrix(1.6, 1.6)
          for index, page in enumerate(doc, 1):
              pix = page.get_pixmap(matrix=matrix, alpha=False)
              pix.save(f'/tmp/architecture-readback/pages/page-{index:02d}.png')

          print(f'pages={len(reader.pages)}')
          print(f'text_chars={sum(len(x) for x in chunks)}')
          print(f'rendered_pages={len(doc)}')
          PY
          ls -lh /tmp/architecture-readback/pages

      - uses: actions/upload-artifact@v4
        with:
          name: architecture-pdf-readback
          path: /tmp/architecture-readback
          if-no-files-found: error
          retention-days: 1
