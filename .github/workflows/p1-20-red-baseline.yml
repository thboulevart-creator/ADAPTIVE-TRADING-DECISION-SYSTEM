name: P1-20 RED Baseline

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/p1-20-red-baseline.yml'
      - 'breakers/p1_20_common_downstream_breaker.py'
      - 'reports/program/*P1-20*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  p1-20-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove persisted HEAD
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Prove frozen P1-19 identities
        run: |
          test "$(git hash-object GOVERNANCE/P1-19-FROZEN-ADVERSARIAL-BREAKER-CONTRACT-V0.1.json)" = "07f6d170ddd1afab20bec1e45c7fad6cc32fdf65"
          test "$(git hash-object GOVERNANCE/P1-19-COMMON-QUALIFIED-EXECUTION-EVIDENCE-CONTRACT-V0.1.json)" = "d3a259f032db3a2d882e1e0403936476701a7cd3"

      - name: Prove common runtime absent before RED
        run: |
          test ! -e src/p1_12d_qualified_execution_evidence.py
          test ! -e src/p1_13c_common_evaluation.py
          test ! -e src/p1_14c_common_measurement_provenance.py
          test ! -e src/p1_15c_common_evaluator_authority.py
          test ! -e src/p1_16c_common_qualified_finding.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Observe exact 24-case RED
        run: |
          set +e
          python -m pytest -q breakers/p1_20_common_downstream_breaker.py > /tmp/p120-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/p120-red.log
          test "$rc" -ne 0
          grep -q "24 failed" /tmp/p120-red.log
          test "$(grep -c 'P1_COMMON_DOWNSTREAM_RUNTIME_ABSENT_EXPECTED_RED' /tmp/p120-red.log)" -ge 24
          echo "P1_20_RED_BASELINE=PASS_EXPECTED_24_FAILURES"

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
