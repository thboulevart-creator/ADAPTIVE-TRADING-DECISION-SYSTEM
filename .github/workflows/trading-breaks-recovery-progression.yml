name: Trading Breaks Recovery Progression Qualification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  progression-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: feat/multi-year-dukascopy-acquisition
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest==8.4.2

      - name: Adversarially re-break progression boundary and parent invariants
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_batch01.py \
            tests/test_trading_breaks_recovery_batch02.py \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Build deterministic progression state report
        run: python -m tools.trading_breaks_recovery_progression

      - name: Assert current progression state without defining Batch 03
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['schema'] == 'HISTORICAL_TRADING_BREAKS_RECOVERY_PROGRESSION_V1'
          assert report['verdict'] == 'PASS'
          assert report['calendar_unresolved_count'] == 61
          assert report['attempt_ledger_count'] == 10
          assert report['registered_material_capability_change_count'] == 0
          assert report['attempted_blocked_ineligible_count'] == 3
          assert report['eligible_initial_or_retry_count'] == 58
          PY

      - name: Persist progression runtime report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No progression runtime report change to persist.'
          else
            git commit -m 'evidence: persist corrected attempt-aware progression qualification runtime'
            git push origin HEAD:feat/multi-year-dukascopy-acquisition
          fi