name: Trading Breaks Recovery Batch 14 Adjudication

on:
  push:
    branches: [feat/multi-year-dukascopy-acquisition]
    paths:
      - '.github/workflows/trading-breaks-recovery-batch14-adjudication.yml'
      - 'tools/trading_breaks_recovery_batch14_adjudication.py'
      - 'tests/test_trading_breaks_recovery_batch14_adjudication.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove persisted capture ancestry and governed state unchanged
        run: |
          git merge-base --is-ancestor 61c58c6d4369d64ba3a5c6f690952729b8d09139 HEAD
          git diff --exit-code 61c58c6d4369d64ba3a5c6f690952729b8d09139 HEAD -- \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            tools/trading_breaks_recovery_progression.py \
            tools/trading_breaks_recovery_protocol.py \
            tools/trading_breaks_recovery_batch14.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch14_runtime.json
          test -f reports/data-qualification/historical_trading_breaks_recovery_batch14_runtime.json

      - name: Run independent offline adjudication attacks
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch14_adjudication.py \
            tests/test_trading_breaks_recovery_batch14.py \
            tests/test_trading_breaks_recovery_batch14_execution_contract.py

      - name: Produce independent adjudication reports
        run: python -m tools.trading_breaks_recovery_batch14_adjudication

      - name: Prove adjudication is offline and scheduler-free
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/trading_breaks_recovery_batch14_adjudication.py').read_text(encoding='utf-8').lower()
          for token in ('playwright', 'selenium', 'probe_candidate', 'eligible_recovery_queue', 'recovery_queue('):
              assert token not in source, token
          print('PASS: Batch 14 adjudication is offline, immutable-membership, and scheduler-free')
          PY

      - name: Persist adjudication evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            reports/data-qualification/historical_trading_breaks_recovery_batch14_adjudication.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch14_qualification.md
          git diff --cached --check
          git commit -m 'evidence: persist Trading Breaks recovery Batch 14 adjudication'
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
