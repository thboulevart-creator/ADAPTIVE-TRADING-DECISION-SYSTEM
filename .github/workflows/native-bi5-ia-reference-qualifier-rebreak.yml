name: Native BI5 I_A Reference Qualifier Persisted-HEAD Rebreak

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/native-bi5-ia-reference-qualifier-rebreak.yml'
      - 'breakers/native_bi5_ia_reference_qualifier_breaker.py'
      - 'breakers/native_bi5_ia_reference_qualifier_adversarial.py'
      - 'src/native_bi5_reference_qualifier.py'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  IA_SOURCE_BLOB: '098040812de654a9c5e4f9961f4a26b2ba959adf'
  IA_FROZEN_BREAKER_BLOB: '64d3a391e1b5cb5aecfdf926551acd3ee5f0d7dd'
  IA_ADVERSARIAL_BREAKER_BLOB: '13e8a2aa01ca311f0094a6ea6a4e73b3501741f7'

jobs:
  rebreak-ia:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD and immutable source/breaker blobs
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object src/native_bi5_reference_qualifier.py)" = "${IA_SOURCE_BLOB}"
          test "$(git hash-object breakers/native_bi5_ia_reference_qualifier_breaker.py)" = "${IA_FROZEN_BREAKER_BLOB}"
          test "$(git hash-object breakers/native_bi5_ia_reference_qualifier_adversarial.py)" = "${IA_ADVERSARIAL_BREAKER_BLOB}"

      - name: Prove I_B remains absent
        run: test ! -e src/native_bi5_independent_qualifier.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Re-break frozen I_A qualification surface
        run: python -m pytest -q breakers/native_bi5_ia_reference_qualifier_breaker.py

      - name: Re-break demonstrated I_A adversarial defects
        run: python -m pytest -q breakers/native_bi5_ia_reference_qualifier_adversarial.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

# persisted-head-final-trigger
