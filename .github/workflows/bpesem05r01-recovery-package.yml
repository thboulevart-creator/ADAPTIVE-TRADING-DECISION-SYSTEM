name: B-PE-SEM-05R-01 recovery package

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - ".github/workflows/bpesem05r01-recovery-package.yml"

permissions:
  contents: write

jobs:
  recovery-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: integration/system-v1
          fetch-depth: 0

      - name: Assert package stage has no network imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          forbidden={"requests","urllib","http","socket","aiohttp","ftplib"}
          for name in [
              "tools/bpesem05r01_materialize_recovery.py",
              "breakers/bpesem05r01_recovery_breaker.py",
          ]:
              tree=ast.parse(Path(name).read_text(encoding="utf-8"))
              bad=[]
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      for a in node.names:
                          if a.name.split(".")[0] in forbidden:
                              bad.append((node.lineno,a.name))
                  elif isinstance(node,ast.ImportFrom):
                      root=(node.module or "").split(".")[0]
                      if root in forbidden:
                          bad.append((node.lineno,node.module))
              assert not bad,(name,bad)
          print("RECOVERY_PACKAGE_OFFLINE_PASS")
          PY

      - name: Materialize compact recovery candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bpesem05r01_materialize_recovery.py | tee /tmp/bpesem05r01-candidate.json
          test -f evidence/bpesem05r01/recovery_package_result_v0_1.json
          test -f evidence/bpesem05r01/recovery_a_result_v0_1.json
          test -f evidence/bpesem05r01/recovery_b_result_v0_1.json
          test -f evidence/bpesem05r01/recovery_c_result_v0_1.json
          test -f reports/data-qualification/bpesem05r01_recovery_candidate_2026-09-22.md

      - name: Persist recovery candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/bpesem05r01             reports/data-qualification/bpesem05r01_recovery_candidate_2026-09-22.md
          git commit -m "evidence: materialize B-PE-SEM-05R-01 recovery candidate"
          git push origin HEAD:integration/system-v1
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Adversarial break persisted candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          python3 breakers/bpesem05r01_recovery_breaker.py | tee /tmp/bpesem05r01-break.json
          test -f reports/data-qualification/bpesem05r01_recovery_adversarial_break_2026-09-22.md

      - name: Persist adversarial break
        shell: bash
        run: |
          set -euo pipefail
          git add reports/data-qualification/bpesem05r01_recovery_adversarial_break_2026-09-22.md
          git commit -m "audit: break B-PE-SEM-05R-01 recovery candidate"
          git push origin HEAD:integration/system-v1
