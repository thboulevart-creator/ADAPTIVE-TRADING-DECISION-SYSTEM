name: RVO-08F Forensic Qualification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'GOVERNANCE/RVO-08F-*'
      - 'reports/program/*RVO-08F*'
      - 'src/p1_12c_qualified_producer_execution.py'
      - 'tools/p1_12c_sandbox_runner.py'
      - 'tests/test_rvo_08f_runtime_repair.py'
      - '.github/workflows/rvo-08f-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: Prove protected identities
        run: |
          test "$(git hash-object tools/ap1_intraday_spread_census.py)" = "9f613063fb8a190a1ff6f2f8b12c97c4ed97712a"
          test "$(git hash-object reports/program/2026-10-05-RVO-08-ONE-SHOT-LEDGER-V0.1.json)" = "11d47d1dfc2fbfe6a2746f74f245812398494e8e"
          test "$(git hash-object reports/program/2026-10-05-RVO-08-SINGLE-AP1-EXECUTION-RECEIPT-V0.1.json)" = "937e33846126246596e4d8ecf8327706d59202e5"
          test "$(git hash-object src/p1_12c_qualified_producer_execution.py)" = "87d2ef49c0b70b956ada19443f5ba693cfb5b242"
          test "$(git hash-object tools/p1_12c_sandbox_runner.py)" = "78aa1615a093c241774fdea1018b69f47728ecb6"
      - name: RVO-08F repair qualification
        run: python -m pytest -q tests/test_rvo_08f_runtime_repair.py
      - name: P1-21 regression
        run: |
          python -m pytest -q breakers/p1_21_real_producer_capability_breaker.py
          python -m pytest -q tests/test_p1_21_real_producer_capability.py
      - name: RVO-08 regression
        run: python -m pytest -q tests/test_rvo_08_single_ap1_execution.py
      - name: RVO-07 regression
        run: |
          python -m pytest -q breakers/rvo_07_pre_execution_requalification_breaker.py
          python -m pytest -q tests/test_rvo_07_pre_execution_requalification.py
      - name: G05 regression
        run: |
          python -m pytest -q breakers/g05_01_workspace_dry_readiness_breaker.py
          python -m pytest -q tests/test_g05_01_workspace_dry_readiness.py
      - name: SMF regression
        run: |
          python -m pytest -q breakers/smf_ap1_m03_01_binding_breaker.py
          python -m pytest -q tests/test_smf_ap1_m03_01_binding.py
      - name: DATA-02 regression
        run: python -m pytest -q breakers/data_02_claim_scoped_admission_breaker.py
      - name: Prove forensic boundary
        run: |
          test "$(python - <<'PY'
          import json
          p='reports/program/2026-10-05-RVO-08-ONE-SHOT-LEDGER-V0.1.json'
          print(json.load(open(p, encoding='utf-8'))['invocation_count'])
          PY
          )" = "1"
          echo "PASS: no AP1 execution is performed by RVO-08F qualification"
      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
