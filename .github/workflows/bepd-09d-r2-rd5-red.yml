name: BEPD-09D-R2-RD5 RED Test-First
on:
  push:
    branches:
      - integration/system-v1
    paths:
      - 'tests/test_bepd09d_r2_rd5_*.py'
      - 'tools/bepd09d_r2_rd5_synthetic_fixture.py'
      - '.github/workflows/bepd-09d-r2-rd5-red.yml'
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools
            tests
            GOVERNANCE
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact frozen numerical environment
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Expected RED missing isolated training adapter
        env:
          PYTHONPATH: tools
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_bepd09d_r2_rd5_*.py' -v
