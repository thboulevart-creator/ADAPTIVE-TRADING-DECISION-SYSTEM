name: SMF Post-M10 PCG-02B Result Integrity Qualification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'artifacts/smf_ap1_m03_02_r1_post_m10_pcg_02b/**'
      - 'reports/program/*POST-M10-PCG-02B*'
      - 'tests/test_smf_ap1_m03_02_r1_post_m10_pcg_02b_result_integrity.py'
      - '.github/workflows/smf-ap1-m03-02-r1-post-m10-pcg-02b-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: PCG-02B persisted-result integrity
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_pcg_02b_result_integrity.py
      - name: PCG-02A static regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_pcg_02a.py
      - name: DC-00 regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_dc_00.py
      - name: PCG-01 synthetic regression only
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_pcg_01.py
      - name: Post-M10 governance regression
        run: python -m pytest -q tests/test_smf_ap1_m03_02_r1_post_m10_method_necessity.py
      - name: Assert no downstream real-execution surfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          rec=json.loads((root/'reports/program/2026-10-06-SMF-AP1-M03-02-R1-POST-M10-PCG-02B-REAL-EXECUTION-RECORD-V0.1.json').read_text())
          assert rec['human_adjudication']=='PENDING'
          assert all(v is False for v in rec['downstream_state'].values())
          PY
      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
