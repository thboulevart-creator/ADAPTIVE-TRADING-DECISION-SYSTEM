name: P0.2 Decision Block Regression Guard

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/data-to-context.yml'
      - '.github/workflows/context-to-research-boundary.yml'
      - '.github/workflows/research-findings-contract.yml'
      - '.github/workflows/research-to-decision-boundary.yml'
      - '.github/workflows/p0-2-decision-block-integration-rebreak.yml'
      - '04-REFERENCE/SYSTEM-REPRODUCIBILITY-CONTRACT.md'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
      - 'GOVERNANCE/STEP-1-MANIFESTO-ARBITRATION.md'
      - 'GOVERNANCE/STEP-2-MINIMAL-SYSTEM-TARGET.md'
      - 'GOVERNANCE/STEP-2-MINIMAL-TARGET-ADVERSARIAL-CHECK.md'
      - 'GOVERNANCE/STEP-3-CONTEXT-RESEARCH-CONTRACT-GATE.md'
      - 'GOVERNANCE/STEP-3-REAL-SYSTEM-MAPPING.md'
      - 'GOVERNANCE/TRUSTWORTHY-INTELLIGENT-SYSTEM-MANIFESTO-FINAL-CANDIDATE.md'
      - 'docs/RESEARCH-FINDINGS-CONTRACT.md'
      - 'src/context.py'
      - 'src/context_identity.py'
      - 'src/decision.py'
      - 'src/decision_trace.py'
      - 'src/research_findings.py'
      - 'src/research_run_evidence.py'
      - 'tests/test_context_research_alternative_paths.py'
      - 'tests/test_context_to_research_boundary.py'
      - 'tests/test_data_to_context.py'
      - 'tests/test_durable_ci_branch_independence.py'
      - 'tests/test_research_findings_contract.py'
      - 'tests/test_research_reader_adversarial.py'
      - 'tests/test_research_to_decision_boundary.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: 'UTC'
  LANG: 'C.UTF-8'
  LC_ALL: 'C.UTF-8'
  BASE_MAIN: '43ec28f3e09856fe508874af3aaf32079761d2d5'
  SOURCE_DECISION: 'c0116d195063c464d602fb699654ac61adc7290c'

jobs:
  rebreak:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD and integration ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${BASE_MAIN}" HEAD
          git cat-file -e "${SOURCE_DECISION}^{commit}"

      - name: Prove protected P0.2 identity and governed downstream handoffs
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          base = '43ec28f3e09856fe508874af3aaf32079761d2d5'
          source = 'c0116d195063c464d602fb699654ac61adc7290c'
          protected = {
              'GOVERNANCE/STEP-1-MANIFESTO-ARBITRATION.md',
              'GOVERNANCE/STEP-2-MINIMAL-SYSTEM-TARGET.md',
              'GOVERNANCE/STEP-2-MINIMAL-TARGET-ADVERSARIAL-CHECK.md',
              'GOVERNANCE/STEP-3-CONTEXT-RESEARCH-CONTRACT-GATE.md',
              'GOVERNANCE/TRUSTWORTHY-INTELLIGENT-SYSTEM-MANIFESTO-FINAL-CANDIDATE.md',
              'docs/RESEARCH-FINDINGS-CONTRACT.md',
              'src/context.py',
              'src/context_identity.py',
              'src/research_findings.py',
              'tests/test_context_to_research_boundary.py',
              'tests/test_data_to_context.py',
              'tests/test_durable_ci_branch_independence.py',
              'tests/test_research_findings_contract.py',
              'tests/test_research_reader_adversarial.py',
          }
          evolved_by_p04 = {
              'src/research_run_evidence.py',
              'tests/test_context_research_alternative_paths.py',
              'tests/test_research_to_decision_boundary.py',
          }
          evolved_by_p11 = {
              'src/decision.py',
          }
          evolved_by_p12_p14 = {
              'GOVERNANCE/STEP-3-REAL-SYSTEM-MAPPING.md',
              'src/decision_trace.py',
          }
          environment_evolved_by_p06 = {
              '.github/workflows/context-to-research-boundary.yml',
              '.github/workflows/data-to-context.yml',
              '.github/workflows/research-findings-contract.yml',
              '.github/workflows/research-to-decision-boundary.yml',
          }
          for path in sorted(protected):
              expected = subprocess.check_output(['git', 'rev-parse', f'{source}:{path}'], text=True).strip()
              actual = subprocess.check_output(['git', 'rev-parse', f'HEAD:{path}'], text=True).strip()
              assert actual == expected, ('P0.2 protected drift', path, expected, actual)
          for path in evolved_by_p04:
              assert Path(path).is_file(), ('P0.4-evolved P0.2 artifact missing', path)
          for path in evolved_by_p11:
              assert Path(path).is_file(), ('P1.1-evolved P0.2 artifact missing', path)
          for path in evolved_by_p12_p14:
              assert Path(path).is_file(), ('P1.2-P1.4 evolved P0.2 artifact missing', path)
          for path in environment_evolved_by_p06:
              assert Path(path).is_file(), ('P0.6-evolved durable workflow missing', path)

          decision_source = Path('src/decision.py').read_text(encoding='utf-8')
          assert 'is_factory_attested_decision' in decision_source
          assert 'produce_decision' in decision_source
          assert Path('04-REFERENCE/DECISION-ACTION-AUTHORIZATION-BOUNDARY-CONTRACT.md').is_file()
          assert Path('.github/workflows/p1-1-decision-action-authorization.yml').is_file()

          mapping = Path('GOVERNANCE/STEP-3-REAL-SYSTEM-MAPPING.md').read_text(encoding='utf-8')
          assert 'P1_2_ACTION_RESULT_EVIDENCE_BOUNDARY_V1' in mapping
          assert 'P1_3_RESULT_TRACE_EVIDENCE_BOUNDARY_V1' in mapping
          assert 'P1_4_TRACE_MEMORY_EPISODE_BOUNDARY_V1' in mapping
          trace_source = Path('src/decision_trace.py').read_text(encoding='utf-8')
          assert 'produce_decision_trace' in trace_source
          assert 'is_factory_attested_decision_trace' in trace_source
          assert 'is_trace_bound_to_exact_observation_pair' in trace_source

          contract = Path('04-REFERENCE/RESEARCH-PRODUCER-JUNCTION-CONTRACT.md').read_text(encoding='utf-8')
          assert 'RESEARCH_PRODUCER_JUNCTION_V1' in contract
          assert Path('src/research/execution.py').is_file()
          assert Path('tests/research_runtime_fixture.py').is_file()
          assert Path('.github/workflows/p0-4-research-producer-junction.yml').is_file()
          assert Path('04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json').is_file()
          assert Path('requirements/qualification.lock.txt').is_file()
          assert Path('tools/qualification_environment.py').is_file()

          base_governance = set(subprocess.check_output(
              ['git', 'ls-tree', '-r', '--name-only', base, 'GOVERNANCE'], text=True
          ).splitlines())
          head_governance = set(subprocess.check_output(
              ['git', 'ls-tree', '-r', '--name-only', 'HEAD', 'GOVERNANCE'], text=True
          ).splitlines())
          assert not (base_governance - head_governance), 'governance deletion detected'
          print('PASS: P0.2 source-identical core preserved; governed P0.4/P0.6/P1.1/P1.2-P1.4 evolution explicit')
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install and verify locked qualification environment
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
          python tools/qualification_environment.py verify

      - name: Run decision Tier-A boundary suite
        run: |
          python -m pytest -q \
            tests/test_data_to_context.py \
            tests/test_context_to_research_boundary.py \
            tests/test_context_research_alternative_paths.py \
            tests/test_research_findings_contract.py \
            tests/test_research_reader_adversarial.py \
            tests/test_research_to_decision_boundary.py \
            tests/test_durable_ci_branch_independence.py

      - name: Re-break provenance reconstruction and identity bypasses
        run: |
          python - <<'PY'
          import copy
          from dataclasses import fields
          import src.research_run_evidence as evidence_module
          from src.decision import produce_decision
          from src.research_findings import ResearchFinding, ResearchFindings, ResearchHypothesis, ResearchMeasurement
          from src.research_run_evidence import ResearchRunEvidence, is_factory_attested
          from tests.test_research_to_decision_boundary import coherent_inputs, reconstruct

          assert not hasattr(evidence_module, '_attest_factory_evidence')
          evidence, context = coherent_inputs()
          assert is_factory_attested(evidence)
          assert produce_decision(evidence, context=context, decision='HOLD').research_run_id == evidence.research_run_id
          forged = reconstruct(evidence)
          assert forged == evidence and forged is not evidence and not is_factory_attested(forged)
          for candidate in (forged, copy.copy(evidence), copy.deepcopy(evidence)):
              try:
                  produce_decision(candidate, context=context, decision='HOLD')
              except ValueError:
                  pass
              else:
                  raise AssertionError('reconstructed/copied evidence bypassed decision boundary')
          object.__setattr__(forged, '_factory_validated', True)
          assert not is_factory_attested(forged)
          identity_fields = [field.name for field in fields(ResearchRunEvidence)]
          assert set(identity_fields) == {
              'provenance_id', 'research_run_id', 'code_version',
              'configuration_version', 'dataset_id', 'dataset_version', 'context_id'
          }
          for field_name in identity_fields:
              candidate, candidate_context = coherent_inputs()
              original = getattr(candidate, field_name)
              object.__setattr__(candidate, field_name, f'{original}-FORGED')
              assert not is_factory_attested(candidate), field_name
              try:
                  produce_decision(candidate, context=candidate_context, decision='HOLD')
              except ValueError:
                  pass
              else:
                  raise AssertionError(f'identity mutation bypassed decision boundary: {field_name}')
          candidate, candidate_context = coherent_inputs()
          candidate.__dict__['research_run_id'] = 'RUN-DICT-FORGED'
          assert not is_factory_attested(candidate)
          hypothesis = ResearchHypothesis('H1', 's', 'p', 'f')
          measurement = ResearchMeasurement('M1', 'R', 'E', 'metric', 1.0, 1, 'scope')
          finding = ResearchFinding('F1', 'H1', 's', ('M1',), 'SUPPORTED', 'rule', 'reason')
          try:
              ResearchFindings.from_research_run_evidence(
                  reconstruct(evidence), hypotheses=(hypothesis,), measurements=(measurement,), findings=(finding,)
              )
          except ValueError:
              pass
          else:
              raise AssertionError('unattested evidence seeded ResearchFindings')
          print('PASS: P0.2 anti-forgery properties survive governed P0.4/P0.6/P1.1 evolution')
          PY

      - name: Prove durable decision workflows remain semantically intact and reproducibly locked
        run: |
          python - <<'PY'
          from pathlib import Path

          required_commands = {
              '.github/workflows/data-to-context.yml': (
                  'tests/test_data_to_context.py',
                  'tests/test_context_to_research_boundary.py',
              ),
              '.github/workflows/context-to-research-boundary.yml': (
                  'tests/test_context_to_research_boundary.py',
                  'tests/test_context_research_alternative_paths.py',
              ),
              '.github/workflows/research-findings-contract.yml': (
                  'tests/test_research_findings_contract.py',
              ),
              '.github/workflows/research-to-decision-boundary.yml': (
                  'tests/test_research_to_decision_boundary.py',
                  'tests/test_research_findings_contract.py',
                  'tests/test_research_reader_adversarial.py',
                  'tests/test_context_research_alternative_paths.py',
                  'tests/test_durable_ci_branch_independence.py',
              ),
          }
          for path_text, commands in required_commands.items():
              path = Path(path_text)
              text = path.read_text(encoding='utf-8')
              assert '\n    branches:' not in text, path
              assert 'feat/' not in text, path
              assert '\n  push:' in text and '\n  pull_request:' in text, path
              assert text.count('\n    paths:') >= 2, path
              assert '\npermissions:\n  contents: read\n' in text, path
              assert 'runs-on: ubuntu-24.04' in text, path
              assert 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262' in text, path
              assert 'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065' in text, path
              assert "python-version: '3.12.14'" in text, path
              assert '--no-deps -r requirements/qualification.lock.txt' in text, path
              assert 'python tools/qualification_environment.py verify' in text, path
              for command in commands:
                  assert command in text, (path, command)
          print('PASS: durable decision CI remains branch-neutral/read-only, semantically intact and P0.6-locked')
          PY

      - name: Prove read-only clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
