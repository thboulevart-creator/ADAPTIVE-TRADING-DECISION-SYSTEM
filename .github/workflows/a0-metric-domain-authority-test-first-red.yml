name: A0 Metric-Domain Authority Test-First RED

on:
  push:
    branches:
      - sandbox/a0-metric-domain-authority-test-first-red
    paths:
      - .github/workflows/a0-metric-domain-authority-test-first-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact preregistered RED HEAD
        uses: actions/checkout@v4
        with:
          ref: 2e1c7d4f556367fb5f4a33d44b74d359dc7b39a9
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify exact persisted preregistration
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "2e1c7d4f556367fb5f4a33d44b74d359dc7b39a9"
          test "$(git hash-object GOVERNANCE/A0-SYNTHETIC-PRODUCER-METRIC-DOMAIN-AUTHORITY-TEST-FIRST-RED-V0.1.json)" = "be8c1c0c805c86d376517ec11da744763c48143c"
          test "$(git hash-object breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py)" = "e3620ac348a8042fe1d04cfc9b32c16060fce4a3"
          test "$(git hash-object GOVERNANCE/A0-SYNTHETIC-PRODUCER-METRIC-DOMAIN-AUTHORITY-V0.1.json)" = "dd205d3e7b4a522a5ba23cef1e665d51c196acb8"
          ! grep -q "FOREIGN_METRIC" breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py

      - name: Verify protected identities
        shell: bash
        run: |
          test "$(git hash-object src/a0_research_authority.py)" = "18246b818c6c6af8c5412c3b0a515f76c5d5ddc8"
          test "$(git hash-object breakers/a0_research_authority_red_breaker.py)" = "e02ecfa6d30c2877a33f5c5d81b161ee562202b6"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v01.py)" = "2911d5b282ccbb6147b2b54a7db5c357c2d315b6"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v02.py)" = "9833ce563305cfb6d6fe1de8907e8aa9fc96fda4"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v03.py)" = "d23e3c72dd8bd2200cb392edc6c80b4e744d4751"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v04.py)" = "efcc3ca7927b29b45f5d0dc0180b81176dbed51e"
          test "$(git hash-object GOVERNANCE/A0-RESEARCH-FINDINGS-AUTHORITY-INTERPRETATION-CONTRACT-V0.3.md)" = "f1168481879f33f8762dcb1e19e2ad35211c8ec2"

      - name: Compile persisted breaker
        run: python -m py_compile breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py

      - name: Preserve existing governed 85-test suite
        shell: bash
        run: |
          python -m pytest -q             breakers/a0_research_authority_red_breaker.py             breakers/a0_research_authority_adversarial_breaker_v01.py             breakers/a0_research_authority_adversarial_breaker_v02.py             breakers/a0_research_authority_adversarial_breaker_v03.py             breakers/a0_research_authority_adversarial_breaker_v04.py             | tee /tmp/a0-existing-85.txt
          grep -q "85 passed" /tmp/a0-existing-85.txt
          echo "A0_EXISTING_85=PASS_UNCHANGED"

      - name: Execute preregistered independent RED family
        shell: bash
        run: |
          set +e
          python -m pytest -q             breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py             > /tmp/a0-metric-red.txt 2>&1
          status=$?
          set -e
          cat /tmp/a0-metric-red.txt
          test "$status" -ne 0
          grep -q "22 failed" /tmp/a0-metric-red.txt
          grep -q "A0_METRIC_DOMAIN_QUALIFIER_REQUIRED" /tmp/a0-metric-red.txt
          echo "A0_METRIC_DOMAIN_AUTHORITY_TEST_FIRST_RED=PASS_RED_22_OF_22"
