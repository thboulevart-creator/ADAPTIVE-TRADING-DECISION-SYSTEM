name: Dukascopy Calendar Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run calendar and boundary regression tests
        run: |
          python -m pytest -q \
            tests/test_dukascopy_usatech_calendar.py \
            tests/test_dukascopy_usatech_calendar_2019_remaining.py \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_dukascopy_usatech_calendar_2021_labor_day.py \
            tests/test_dukascopy_downloader_calendar_coverage_gate.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Assert governed coverage counts after pilot integration
        run: |
          python - <<'PY'
          import json
          from tools.dukascopy_usatech_calendar_coverage import audit_calendar_coverage

          report = audit_calendar_coverage()
          print(json.dumps(report, indent=2, sort_keys=True))
          assert report['candidate_dates'] == 111
          assert report['special_session_evidence_dates'] == 25
          assert report['resolved_candidate_dates'] == 25
          assert report['unresolved_candidate_dates'] == 86
          assert report['verdict'] == 'BLOCKED'
          assert report['reason'] == 'SPECIAL_SESSION_EVIDENCE_COVERAGE_INCOMPLETE'
          assert report['orphan_special_evidence'] == []
          assert report['contradictory_evidence_dates'] == []
          assert report['evidence_shape_errors'] == []
          PY
