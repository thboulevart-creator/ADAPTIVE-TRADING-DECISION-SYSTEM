name: P0.3 Multi-Year Regression Guard

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/p0-3-multi-year-integration-rebreak.yml'
      - '.github/workflows/p0-2-decision-block-integration-rebreak.yml'
      - '04-REFERENCE/COVERAGE-ENVELOPE-EXECUTION-WINDOW-BOUNDARY.md'
      - '04-REFERENCE/EXECUTION-WINDOW-FREEZE.json'
      - '04-REFERENCE/EXECUTION-WINDOW-SELECTION-RULE.md'
      - 'docs/03.1.2-MOMENTUM-V1-BASELINE-PROTOCOL.md'
      - 'tools/coverage_execution_window_boundary.py'
      - 'tools/current_execution_window_boundary_state.py'
      - 'tools/dukascopy_usatech_calendar.py'
      - 'tools/dukascopy_usatech_calendar_coverage.py'
      - 'tools/frozen_execution_window.py'
      - 'tools/trading_breaks_recovery_progression.py'
      - 'tools/trading_breaks_recovery_protocol.py'
      - 'reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json'
      - 'reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json'
      - 'tests/test_coverage_execution_window_boundary.py'
      - 'tests/test_current_execution_window_boundary_state.py'
      - 'tests/test_dukascopy_usatech_calendar.py'
      - 'tests/test_dukascopy_usatech_calendar_coverage.py'
      - 'tests/test_frozen_execution_window.py'
      - 'tests/test_trading_breaks_post_closure_current_state.py'
  pull_request:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/p0-3-multi-year-integration-rebreak.yml'
      - '.github/workflows/p0-2-decision-block-integration-rebreak.yml'
      - '04-REFERENCE/COVERAGE-ENVELOPE-EXECUTION-WINDOW-BOUNDARY.md'
      - '04-REFERENCE/EXECUTION-WINDOW-FREEZE.json'
      - '04-REFERENCE/EXECUTION-WINDOW-SELECTION-RULE.md'
      - 'docs/03.1.2-MOMENTUM-V1-BASELINE-PROTOCOL.md'
      - 'tools/coverage_execution_window_boundary.py'
      - 'tools/current_execution_window_boundary_state.py'
      - 'tools/dukascopy_usatech_calendar.py'
      - 'tools/dukascopy_usatech_calendar_coverage.py'
      - 'tools/frozen_execution_window.py'
      - 'tools/trading_breaks_recovery_progression.py'
      - 'tools/trading_breaks_recovery_protocol.py'
      - 'reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json'
      - 'reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json'
      - 'tests/test_coverage_execution_window_boundary.py'
      - 'tests/test_current_execution_window_boundary_state.py'
      - 'tests/test_dukascopy_usatech_calendar.py'
      - 'tests/test_dukascopy_usatech_calendar_coverage.py'
      - 'tests/test_frozen_execution_window.py'
      - 'tests/test_trading_breaks_post_closure_current_state.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_MULTIYEAR: 'b7d13bb3492fb6e1f0d4dcab64079bf1a8f55698'

jobs:
  rebreak:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD and protected source exists
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git cat-file -e "${SOURCE_MULTIYEAR}^{commit}"

      - name: Prove 19 protected P0.3 artifacts remain source-identical
        run: |
          python - <<'PY'
          import subprocess
          source = 'b7d13bb3492fb6e1f0d4dcab64079bf1a8f55698'
          protected = {
              '04-REFERENCE/COVERAGE-ENVELOPE-EXECUTION-WINDOW-BOUNDARY.md',
              '04-REFERENCE/EXECUTION-WINDOW-FREEZE.json',
              '04-REFERENCE/EXECUTION-WINDOW-SELECTION-RULE.md',
              'docs/03.1.2-MOMENTUM-V1-BASELINE-PROTOCOL.md',
              'tools/coverage_execution_window_boundary.py',
              'tools/current_execution_window_boundary_state.py',
              'tools/dukascopy_usatech_calendar.py',
              'tools/dukascopy_usatech_calendar_coverage.py',
              'tools/frozen_execution_window.py',
              'tools/trading_breaks_recovery_progression.py',
              'tools/trading_breaks_recovery_protocol.py',
              'reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json',
              'reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json',
              'tests/test_coverage_execution_window_boundary.py',
              'tests/test_current_execution_window_boundary_state.py',
              'tests/test_dukascopy_usatech_calendar.py',
              'tests/test_dukascopy_usatech_calendar_coverage.py',
              'tests/test_frozen_execution_window.py',
              'tests/test_trading_breaks_post_closure_current_state.py',
          }
          for path in sorted(protected):
              expected = subprocess.check_output(['git', 'rev-parse', f'{source}:{path}'], text=True).strip()
              actual = subprocess.check_output(['git', 'rev-parse', f'HEAD:{path}'], text=True).strip()
              assert actual == expected, (path, expected, actual)
          print('PASS: P0.3 protected surface remains source-identical')
          PY

      - name: Prove governed P0.4 downstream handoff remains explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          contract = Path('04-REFERENCE/RESEARCH-PRODUCER-JUNCTION-CONTRACT.md').read_text(encoding='utf-8')
          assert 'RESEARCH_PRODUCER_JUNCTION_V1' in contract
          assert Path('src/research/execution.py').is_file()
          assert Path('tests/test_research_producer_junction_tier_a.py').is_file()
          print('PASS: P0.3 preserves its block while accepting the governed P0.4 downstream handoff')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-run protected P0.3 and shared upstream Tier-A regressions
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q \
            tests/test_data_to_context.py \
            tests/test_context_to_research_boundary.py \
            tests/test_context_research_alternative_paths.py \
            tests/test_research_findings_contract.py \
            tests/test_research_to_decision_boundary.py
          python -m pytest -q \
            tests/test_coverage_execution_window_boundary.py \
            tests/test_current_execution_window_boundary_state.py \
            tests/test_dukascopy_usatech_calendar.py \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_frozen_execution_window.py \
            tests/test_trading_breaks_post_closure_current_state.py

      - name: Re-break calendar/freeze truth
        run: |
          python - <<'PY'
          from datetime import date
          from tools.coverage_execution_window_boundary import BLOCKED, DECLARE_GLOBAL_COVERAGE_PASS, evaluate_boundary
          from tools.current_execution_window_boundary_state import derive_current_boundary_evidence, evaluate_current_freeze
          from tools.frozen_execution_window import evaluate_acquisition_after_persisted_freeze, evaluate_persisted_execution_window_freeze
          evidence = derive_current_boundary_evidence()
          state = evidence.state
          assert state.window_start == date(2021, 8, 14)
          assert state.window_end == date(2026, 8, 14)
          assert (evidence.global_candidate_count, evidence.global_resolved_count, state.global_unresolved_count) == (111, 91, 20)
          assert (evidence.window_candidate_count, evidence.window_resolved_count, state.window_unresolved_count) == (68, 68, 0)
          assert evaluate_boundary(DECLARE_GLOBAL_COVERAGE_PASS, state).verdict == BLOCKED
          assert evaluate_current_freeze().decision.verdict == 'PASS'
          frozen = evaluate_persisted_execution_window_freeze()
          assert frozen.decision.verdict == 'PASS'
          assert frozen.evidence.record['massive_acquisition_authorized'] is False
          assert frozen.evidence.record['real_backtest_authorized'] is False
          assert evaluate_acquisition_after_persisted_freeze().verdict == BLOCKED
          print('PASS: P0.3 calendar/freeze truth survives')
          PY

      - name: Prove guard is composable and read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/p0-3-multi-year-integration-rebreak.yml').read_text(encoding='utf-8')
          assert '\npermissions:\n  contents: read\n' in text
          forbidden = (
              'src/' + 'research/**',
              '04-REFERENCE/' + 'RECOVERY-CHECKPOINT.md',
              'git diff --' + 'name-only',
          )
          assert all(token not in text for token in forbidden), forbidden
          print('PASS: P0.3 guard protects its block without constraining later governed blocks')
          PY

      - name: Prove clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
