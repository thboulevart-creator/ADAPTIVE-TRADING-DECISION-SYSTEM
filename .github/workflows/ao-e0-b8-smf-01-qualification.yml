name: AO-E0 B8 SMF-01 Qualification
on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'GOVERNANCE/AO-E0-B8-SMF-01-MATERIAL-CONFIGURATION-CANDIDATE-V0.1.json'
      - 'tools/ao_e0_b8_smf_01_preregistration.py'
      - 'tests/test_ao_e0_b8_smf_01.py'
      - '.github/workflows/ao-e0-b8-smf-01-qualification.yml'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct candidate
        run: python tools/ao_e0_b8_smf_01_preregistration.py
      - name: Synthetic and adversarial qualification
        run: python -m unittest tests/test_ao_e0_b8_smf_01.py -v
