name: Trading Breaks Recovery Batch 09 Mechanical Freeze

on:
  push:
    branches:
      - feat/multi-year-dukascopy-acquisition
    paths:
      - '.github/workflows/trading-breaks-recovery-batch09-freeze.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-batch09:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact triggering persisted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove post-Batch08 checkpoint ancestry and governed-state immutability
        run: |
          git merge-base --is-ancestor 2e94b8bfa1459d300ee315d0754f84973be2dd1e HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          git diff --exit-code 2e94b8bfa1459d300ee315d0754f84973be2dd1e HEAD -- \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            tools/trading_breaks_recovery_progression.py \
            tools/trading_breaks_recovery_protocol.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest only
        run: python -m pip install pytest==8.4.2

      - name: Adversarially break the mechanical freeze contract before snapshot creation
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch09_freeze_contract.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Materialize Batch 09 from governed eligible_recovery_queue prefix
        run: python -m tools.freeze_trading_breaks_recovery_batch09

      - name: Adversarially re-break frozen membership and governed regressions
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_*.py \
            tests/test_dukascopy_usatech_calendar*.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Assert exact freeze state without hard-coded members
        run: |
          python - <<'PY'
          from tools.trading_breaks_recovery_batch09 import BATCH_SIZE, batch09_targets
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue, load_attempt_ledger, load_material_capability_changes, progression_decisions
          from tools.trading_breaks_recovery_protocol import recovery_queue

          frozen = batch09_targets()
          eligible = eligible_recovery_queue()
          raw = recovery_queue()
          decisions = {item.target_date: item for item in progression_decisions()}
          _, _, attempts = load_attempt_ledger()

          assert BATCH_SIZE == 5
          assert len(raw) == 38
          assert len(eligible) == 28
          assert len(attempts) == 40
          assert load_material_capability_changes() == []
          assert frozen == eligible[:BATCH_SIZE]
          assert len({day for day, _ in frozen}) == BATCH_SIZE
          assert [day for day, _ in frozen] == sorted(day for day, _ in frozen)
          assert sum(not item.eligible and item.latest_attempt_outcome == 'BLOCKED' for item in decisions.values()) == 10
          attempted_days = {item.target_date for item in attempts}
          for day, reason in frozen:
              decision = decisions[day]
              assert decision.candidate_reason == reason
              assert decision.eligible is True
              assert decision.reason == 'INITIAL_ATTEMPT'
              assert decision.latest_attempt_id is None
              assert decision.latest_attempt_outcome is None
              assert day not in attempted_days
          print('PASS: Batch 09 is exactly the mechanically derived governed eligible prefix')
          for index, item in enumerate(frozen, start=1):
              print(index, item[0].isoformat(), item[1])
          PY

      - name: Prove frozen production module has no browser probe or live selection path
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('tools/trading_breaks_recovery_batch09.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          imports = set()
          calls = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.lower() for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add((node.module or '').lower())
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id.lower())
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr.lower())
          assert not any('playwright' in name or 'selenium' in name for name in imports)
          assert 'probe_candidate' not in calls
          assert 'eligible_recovery_queue' not in calls
          assert 'recovery_queue' not in calls
          assert 'batch09_targets' in source
          print('PASS: frozen Batch 09 module is immutable and observation-free')
          PY

      - name: Prove freeze changed scheduling artifacts only
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              '?? 04-REFERENCE/HISTORICAL-TRADING-BREAKS-RECOVERY-BATCH09-POLICY.md',
              '?? tests/test_trading_breaks_recovery_batch09.py',
              '?? tools/trading_breaks_recovery_batch09.py',
          }
          status = set(subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines())
          assert status == expected, (status, expected)
          print('PASS: freeze mutation surface is exactly three new scheduling artifacts')
          PY

      - name: Persist qualification and mechanically frozen Batch 09 snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "freeze-batch09") | .id' | head -n 1)"
          export JOB_ID
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.trading_breaks_recovery_batch09 import batch09_targets

          targets = batch09_targets()
          members = '\n'.join(f'- `{day.isoformat()} — {reason}`' for day, reason in targets)
          report = Path('reports/data-qualification/historical_trading_breaks_recovery_batch09_policy_qualification.md')
          report.write_text(
              '# HISTORICAL TRADING BREAKS RECOVERY — BATCH 09 MEMBERSHIP QUALIFICATION\n\n'
              '**PASS — `BATCH09_MEMBERSHIP_FROZEN_FROM_ATTEMPT_AWARE_ELIGIBLE_QUEUE_BEFORE_OBSERVATION`**\n\n'
              f'- workflow run: `{os.environ["GITHUB_RUN_ID"]}`\n'
              f'- job: `{os.environ.get("JOB_ID")}`\n'
              f'- trigger commit: `{os.environ["GITHUB_SHA"]}`\n'
              '- freeze baseline checkpoint: `2e94b8bfa1459d300ee315d0754f84973be2dd1e`\n'
              '- selection rule: `eligible_recovery_queue()[:5]`\n'
              '- batch size: `5`\n'
              '- pre-freeze state: raw unresolved `38`, eligible `28`, ledger `40`, BLOCKED/ineligible `10`, capability changes `0`\n'
              '- all frozen members: `INITIAL_ATTEMPT` with no prior factual attempt\n'
              '- adversarial attacks: skip/reorder/substitution/cardinality/duplicate/BLOCKED/resolved reinsertion rejected\n'
              '- frozen production module: no browser/probe/live-queue path\n'
              '- no Chromium opened; no `.bi5`; no real backtest\n\n'
              '## Mechanically frozen membership\n\n'
              + members + '\n',
              encoding='utf-8',
          )
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/trading_breaks_recovery_batch09.py \
            tests/test_trading_breaks_recovery_batch09.py \
            04-REFERENCE/HISTORICAL-TRADING-BREAKS-RECOVERY-BATCH09-POLICY.md \
            reports/data-qualification/historical_trading_breaks_recovery_batch09_policy_qualification.md
          git diff --cached --check
          git commit -m 'policy: freeze Trading Breaks Batch 09 membership'
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
