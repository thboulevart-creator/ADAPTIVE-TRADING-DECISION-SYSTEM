name: B-PE-SEM-05 Lane S

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - ".github/workflows/bpesem05-lane-s.yml"

permissions:
  contents: write

jobs:
  lane-s:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: integration/system-v1
          fetch-depth: 0

      - name: Assert Lane S documentary-only code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          forbidden={"requests","urllib","http","socket","aiohttp","ftplib"}
          for name in [
              "tools/bpesem05_materialize_lane_s.py",
              "breakers/bpesem05_lane_s_breaker.py",
          ]:
              tree=ast.parse(Path(name).read_text(encoding="utf-8"))
              bad=[]
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      for a in node.names:
                          if a.name.split(".")[0] in forbidden:
                              bad.append((node.lineno,a.name))
                  elif isinstance(node,ast.ImportFrom):
                      root=(node.module or "").split(".")[0]
                      if root in forbidden:
                          bad.append((node.lineno,node.module))
              assert not bad,(name,bad)
          print("LANE_S_NO_NETWORK_IMPORTS_PASS")
          PY

      - name: Materialize Lane S candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bpesem05_materialize_lane_s.py | tee /tmp/bpesem05-candidate.json
          test -f evidence/bpesem05/lane_s_evidence_registry_v0_1.json
          test -f evidence/bpesem05/semantic_epoch_manifest_v0_1.json
          test -f evidence/bpesem05/lane_s_semantic_authority_result_v0_1.json
          test -f reports/data-qualification/bpesem05_lane_s_candidate_2026-09-22.md

      - name: Persist Lane S candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/bpesem05 reports/data-qualification/bpesem05_lane_s_candidate_2026-09-22.md
          git commit -m "evidence: materialize B-PE-SEM-05 Lane S candidate"
          git push origin HEAD:integration/system-v1
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Break persisted Lane S candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          python3 breakers/bpesem05_lane_s_breaker.py | tee /tmp/bpesem05-break.json
          test -f reports/data-qualification/bpesem05_lane_s_adversarial_break_2026-09-22.md

      - name: Persist Lane S break report
        shell: bash
        run: |
          set -euo pipefail
          git add reports/data-qualification/bpesem05_lane_s_adversarial_break_2026-09-22.md
          git commit -m "audit: break B-PE-SEM-05 Lane S candidate"
          git push origin HEAD:integration/system-v1
