name: SMF03 CORE Final Canonical Closure Qualification

on:
  push:
    branches:
      - feat/smf03-core-post-integration-ci-3faa6e4b

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Checkout exact final canonical HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2714cf5bf6d607760c589e334757f395ca903991

      - name: Verify exact canonical identity
        run: |
          test "$(git rev-parse HEAD)" = "2714cf5bf6d607760c589e334757f395ca903991"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"

      - name: Verify Python
        run: python --version

      - name: Install qualification lock
        run: python -m pip install -r requirements/qualification.lock.txt

      - name: W1-W2 qualification
        run: python -m pytest -q breakers/smf03_core_foundation_red_breaker.py

      - name: W3 qualification
        run: python -m pytest -q breakers/smf03_dependence_inference_red_breaker.py

      - name: W4 qualification
        run: python -m pytest -q breakers/smf03_evidence_governance_red_breaker.py

      - name: Integrated adversarial re-break
        run: >
          python -m pytest -q
          breakers/smf03_core_foundation_red_breaker.py
          breakers/smf03_dependence_inference_red_breaker.py
          breakers/smf03_evidence_governance_red_breaker.py
          breakers/smf03_core_integrated_rebreak.py