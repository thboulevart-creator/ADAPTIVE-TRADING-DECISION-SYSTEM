name: Trading Breaks Recovery Batch 10 Freeze Qualification

on:
  push:
    branches:
      - feat/multi-year-dukascopy-acquisition
    paths:
      - '.github/workflows/trading-breaks-recovery-batch10-freeze.yml'
      - 'tools/freeze_trading_breaks_recovery_batch10.py'
      - 'tests/test_trading_breaks_recovery_batch10_freeze_contract.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-batch10:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact triggering persisted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove post-Batch09 checkpoint ancestry and freeze-only preparation delta
        run: |
          git merge-base --is-ancestor 7264970e0be56f3eb379f6647f8c353885f6e521 HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/trading-breaks-recovery-batch10-freeze.yml',
              'tests/test_trading_breaks_recovery_batch10_freeze_contract.py',
              'tools/freeze_trading_breaks_recovery_batch10.py',
          }
          actual = set(subprocess.check_output([
              'git', 'diff', '--name-only',
              '7264970e0be56f3eb379f6647f8c353885f6e521', 'HEAD'
          ], text=True).splitlines())
          assert actual == expected, (actual, expected)
          print('PASS: only Batch 10 freeze qualification preparation changed since checkpoint')
          PY
          git diff --exit-code 7264970e0be56f3eb379f6647f8c353885f6e521 HEAD -- \
            04-REFERENCE/RECOVERY-CHECKPOINT.md \
            reports/data-qualification/current_coverage_execution_window_boundary_application.md \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            tools/trading_breaks_recovery_protocol.py \
            tools/trading_breaks_recovery_progression.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Break Batch 10 selection boundary before snapshot
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch10_freeze_contract.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_coverage_execution_window_boundary.py
          python - <<'PY'
          from tools.freeze_trading_breaks_recovery_batch10 import derive_batch10_membership
          frozen = derive_batch10_membership()
          assert len(frozen) == 5
          print('PASS: Batch 10 candidate mechanically derived and adversarial selection boundary holds')
          for i, (day, reason) in enumerate(frozen, 1):
              print(f'{i}: {day.isoformat()} — {reason}')
          PY

      - name: Materialize immutable Batch 10 snapshot
        run: python -m tools.freeze_trading_breaks_recovery_batch10

      - name: Re-break frozen membership and complete governed regression
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_*.py \
            tests/test_dukascopy_usatech_calendar*.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Assert exact frozen identity and zero governed-state mutation
        run: |
          python - <<'PY'
          from tools.trading_breaks_recovery_batch10 import batch10_targets
          from tools.trading_breaks_recovery_progression import (
              eligible_recovery_queue,
              load_attempt_ledger,
              load_material_capability_changes,
              progression_decisions,
          )
          from tools.trading_breaks_recovery_protocol import recovery_queue

          frozen = batch10_targets()
          eligible = eligible_recovery_queue()
          _, _, attempts = load_attempt_ledger()
          decisions = progression_decisions()
          assert len(frozen) == 5
          assert frozen == eligible[:5]
          assert len(recovery_queue()) == 34
          assert len(eligible) == 23
          assert len(attempts) == 45
          assert sum(not d.eligible and d.latest_attempt_outcome == 'BLOCKED' for d in decisions) == 11
          assert load_material_capability_changes() == []
          assert all(d.reason == 'INITIAL_ATTEMPT' for d in decisions if (d.target_date, d.candidate_reason) in set(frozen))
          print('PASS: frozen Batch 10 identity equals persisted eligible[:5] and governed state is unchanged')
          PY
          git diff --exit-code -- \
            tools/dukascopy_usatech_calendar.py \
            tools/dukascopy_usatech_calendar_coverage.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_capability_changes.json

      - name: Prove generated snapshot has no live selection or observation surface
        run: |
          python - <<'PY'
          import ast
          import inspect
          import tools.trading_breaks_recovery_batch10 as batch10
          source = inspect.getsource(batch10)
          tree = ast.parse(source)
          imports = set()
          calls = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.lower() for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add((node.module or '').lower())
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id.lower())
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr.lower())
          assert not any(token in module for module in imports for token in ('playwright', 'selenium', 'requests', 'httpx'))
          for forbidden in ('eligible_recovery_queue', 'recovery_queue', 'progression_decisions', 'probe_candidate', 'goto', 'launch'):
              assert forbidden not in calls, forbidden
          print('PASS: immutable Batch 10 snapshot has no live queue/browser/probe surface')
          PY

      - name: Persist frozen membership qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "freeze-batch10") | .id' | head -n 1)"
          export JOB_ID
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.trading_breaks_recovery_batch10 import batch10_targets
          members = '\n'.join(
              f'{i}. `{day.isoformat()} — {reason}`'
              for i, (day, reason) in enumerate(batch10_targets(), 1)
          )
          report = Path('reports/data-qualification/historical_trading_breaks_recovery_batch10_policy_qualification.md')
          report.write_text(
              '# HISTORICAL TRADING BREAKS RECOVERY — BATCH 10 MEMBERSHIP QUALIFICATION\n\n'
              '**PASS — `BATCH10_MEMBERSHIP_MECHANICALLY_FROZEN_AND_ADVERSARIALLY_QUALIFIED`**\n\n'
              f'- workflow run: `{os.environ["GITHUB_RUN_ID"]}`\n'
              f'- job: `{os.environ.get("JOB_ID")}`\n'
              f'- trigger commit: `{os.environ["GITHUB_SHA"]}`\n'
              '- freeze baseline checkpoint: `7264970e0be56f3eb379f6647f8c353885f6e521`\n'
              '- selection: `eligible_recovery_queue()[:5]`\n'
              '- fixed batch size: `5`\n'
              '- pre-freeze state: raw `34`, eligible `23`, attempts `45`, BLOCKED/ineligible `11`, capability changes `0`\n'
              '- browser/probe/network observation during freeze: `NONE`\n'
              '- governed calendar/ledger/progression mutation: `NONE`\n\n'
              '## Frozen membership\n\n'
              + members + '\n\n'
              'Adversarial rejection includes skip, reorder, later-member substitution, cardinality change, duplication, raw-queue bypass, same-capability BLOCKED reinsertion, resolved-date reinsertion and observation/outcome-dependent selection surfaces.\n\n'
              'No `.bi5`. No real backtest.\n',
              encoding='utf-8',
          )
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/trading_breaks_recovery_batch10.py \
            04-REFERENCE/HISTORICAL-TRADING-BREAKS-RECOVERY-BATCH10-POLICY.md \
            tests/test_trading_breaks_recovery_batch10.py \
            reports/data-qualification/historical_trading_breaks_recovery_batch10_policy_qualification.md
          git diff --cached --check
          git commit -m 'governance: freeze Trading Breaks Batch 10 membership'
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
