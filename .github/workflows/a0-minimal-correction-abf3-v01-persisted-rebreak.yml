name: A0 Minimal Correction ABF3 V0.1 Persisted Rebreak

on:
  push:
    branches:
      - sandbox/a0-minimal-correction-abf3-v01-persisted-rebreak
    paths:
      - .github/workflows/a0-minimal-correction-abf3-v01-persisted-rebreak.yml

permissions:
  contents: read

jobs:
  rebreak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed correction HEAD
        uses: actions/checkout@v4
        with:
          ref: a3d36fa417293bd6b436f622df73d157f36e41d8
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify exact persisted HEAD and correction scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a3d36fa417293bd6b436f622df73d157f36e41d8"
          python - <<'PY'
          import subprocess
          expected = {"src/a0_research_authority.py"}
          got = set(subprocess.check_output(
              ["git", "diff", "--name-only",
               "1009f7685c37bb7a161a4bdd22bd42fea2d55d86",
               "a3d36fa417293bd6b436f622df73d157f36e41d8"],
              text=True,
          ).splitlines())
          assert got == expected, (got, expected)
          PY

      - name: Verify protected identities
        shell: bash
        run: |
          test "$(git hash-object src/a0_research_authority.py)" = "4b4737238d01be0b1017b07cf33742797cb995eb"
          test "$(git hash-object breakers/a0_research_authority_red_breaker.py)" = "e02ecfa6d30c2877a33f5c5d81b161ee562202b6"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v01.py)" = "2911d5b282ccbb6147b2b54a7db5c357c2d315b6"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v02.py)" = "9833ce563305cfb6d6fe1de8907e8aa9fc96fda4"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v03.py)" = "d23e3c72dd8bd2200cb392edc6c80b4e744d4751"
          test "$(git hash-object GOVERNANCE/A0-RESEARCH-FINDINGS-AUTHORITY-INTERPRETATION-CONTRACT-V0.3.md)" = "f1168481879f33f8762dcb1e19e2ad35211c8ec2"

      - name: Compile governed candidate and breakers
        run: |
          python -m py_compile src/a0_research_authority.py
          python -m py_compile breakers/a0_research_authority_red_breaker.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v01.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v02.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v03.py

      - name: Fresh persisted-head 64-test rebreak
        shell: bash
        run: |
          python -m pytest -q             breakers/a0_research_authority_red_breaker.py             breakers/a0_research_authority_adversarial_breaker_v01.py             breakers/a0_research_authority_adversarial_breaker_v02.py             breakers/a0_research_authority_adversarial_breaker_v03.py             | tee /tmp/a0-abf3-persisted.txt
          grep -q "64 passed" /tmp/a0-abf3-persisted.txt
          echo "A0_MINIMAL_CORRECTION_ABF3_V01_PERSISTED_REBREAK=PASS_64_OF_64"
