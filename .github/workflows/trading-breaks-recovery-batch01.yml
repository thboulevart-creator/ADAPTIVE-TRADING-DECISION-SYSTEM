name: Trading Breaks Recovery Batch 01

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch01:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: feat/multi-year-dukascopy-acquisition
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qualify parent protocol and frozen Batch 01 policy
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.4.2
          python -m pytest -q \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_batch01.py

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Execute deterministic Batch 01 in headed Chromium
        run: xvfb-run -a python -m tools.trading_breaks_recovery_batch01

      - name: Print batch capture summary
        if: always()
        run: |
          echo '--- batch_summary.json ---'
          cat trading_breaks_batch01_artifacts/batch_summary.json || true

      - name: Upload complete Batch 01 runtime evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-trading-breaks-recovery-batch01
          path: trading_breaks_batch01_artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Persist compact runtime report with artifact provenance
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          JOB_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[] | select(.name == "batch01") | .id' | head -n 1)"
          export JOB_ID
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          src = Path('trading_breaks_batch01_artifacts/batch_summary.json')
          dst = Path('reports/data-qualification/historical_trading_breaks_recovery_batch01_runtime.json')
          if src.exists():
              data = json.loads(src.read_text(encoding='utf-8'))
          else:
              data = {
                  'schema': 'HISTORICAL_TRADING_BREAKS_RECOVERY_BATCH_POLICY_V1',
                  'batch_number': 1,
                  'verdict': 'BLOCKED',
                  'reason': 'BATCH_SUMMARY_NOT_PRODUCED',
              }
          digest = os.environ.get('ARTIFACT_DIGEST') or None
          if digest and digest.startswith('sha256:'):
              digest = digest.split(':', 1)[1]
          data['provenance'] = {
              'workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'job_id': int(os.environ['JOB_ID']) if os.environ.get('JOB_ID') else None,
              'probe_commit': os.environ['GITHUB_SHA'],
              'artifact_id': int(os.environ['ARTIFACT_ID']) if os.environ.get('ARTIFACT_ID') else None,
              'artifact_url': os.environ.get('ARTIFACT_URL') or None,
              'artifact_sha256': digest,
          }
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print(dst.read_text(encoding='utf-8'))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/data-qualification/historical_trading_breaks_recovery_batch01_runtime.json
          if git diff --cached --quiet; then
            echo 'No runtime report change to persist.'
          else
            git commit -m 'evidence: persist Trading Breaks recovery batch 01 runtime'
            git push origin HEAD:feat/multi-year-dukascopy-acquisition
          fi
