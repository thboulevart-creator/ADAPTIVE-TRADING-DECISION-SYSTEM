name: P0.6 System Reproducibility Tier-A

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/data-to-context.yml'
      - '.github/workflows/context-to-research-boundary.yml'
      - '.github/workflows/research-findings-contract.yml'
      - '.github/workflows/research-to-decision-boundary.yml'
      - '.github/workflows/p0-2-decision-block-integration-rebreak.yml'
      - '.github/workflows/p0-3-multi-year-integration-rebreak.yml'
      - '.github/workflows/p0-4-research-producer-junction.yml'
      - '.github/workflows/p0-5-research-interprocess-reattestation.yml'
      - '.github/workflows/p0-6-system-reproducibility.yml'
      - '04-REFERENCE/SYSTEM-REPRODUCIBILITY-CONTRACT.md'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - '04-REFERENCE/RECOVERY-CHECKPOINT.md'
      - 'GOVERNANCE/GOVERNANCE-AUDIT-REGISTER.md'
      - 'reports/data-qualification/p0_6_system_reproducibility_qualification.md'
      - '99-BACKUP/SESSION-2026-09-16-P0.6-SYSTEM-REPRODUCIBILITY-PASS.md'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
      - 'tests/**'
      - 'tests/test_system_reproducibility_tier_a.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: 'UTC'
  LANG: 'C.UTF-8'
  LC_ALL: 'C.UTF-8'
  P0_5_BASE: '7ae5f3cb77d6914699df3cd1104bc02ecb3c2bf4'

jobs:
  tier-a-break:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD and closed P0.5 ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${P0_5_BASE}" HEAD

      - name: Prove documentary closure artifacts are persisted and bounded
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path('GOVERNANCE/GOVERNANCE-AUDIT-REGISTER.md')
          report = Path('reports/data-qualification/p0_6_system_reproducibility_qualification.md')
          checkpoint = Path('04-REFERENCE/RECOVERY-CHECKPOINT.md')
          backup = Path('99-BACKUP/SESSION-2026-09-16-P0.6-SYSTEM-REPRODUCIBILITY-PASS.md')
          for path in (audit, report, checkpoint, backup):
              assert path.is_file(), f'missing P0.6 closure artifact: {path}'

          texts = {path.name: path.read_text(encoding='utf-8') for path in (audit, report, checkpoint, backup)}
          marker = 'P0_6_SYSTEM_REPRODUCIBILITY_JIT_AUDIT_V1'
          contract_id = 'SYSTEM_REPRODUCIBILITY_ENVELOPE_V1'
          lock_id = 'QUALIFICATION_ENVIRONMENT_LOCK_V1'
          technical_head = 'e96396ab3f807144144ff548dfe771c6a0584b44'
          requirements_sha = '4ef534add869a64dd4957ea986f7ada98dffd41f89021e1719d02d9c2062a0db'

          assert marker in texts[audit.name]
          assert 'P0_5_RESEARCH_INTERPROCESS_REATTESTATION_JIT_AUDIT_V1' in texts[audit.name]
          for path in (report, backup):
              text = texts[path.name]
              assert marker in text, path
              assert contract_id in text, path
              assert lock_id in text, path
              assert '35145837748 / 104961521577' in text, path
              assert '35146586182 / 104964108341' in text, path
              assert technical_head in text, path
              assert requirements_sha in text, path
              assert '220 passed' in text, path
              assert '13 passed' in text, path

          for path in (audit, report, backup):
              lowered = texts[path.name].lower()
              assert 'covered by p0.6' in lowered, path
              assert 'explicitly not covered by p0.6' in lowered, path

          checkpoint_text = texts[checkpoint.name]
          assert '8061127c148f06454dac6e7977a8d0cb921276f8' in checkpoint_text
          assert '35147651568 / 104967695069' in checkpoint_text
          assert '- P0.6: **CLOSED / PASS**' in checkpoint_text

          audit_text = texts[audit.name]
          assert technical_head in audit_text
          assert '35146586182 / 104964108341' in audit_text
          assert '111/91/20' in audit_text.replace(' ', '')
          assert '68/68/0' in audit_text.replace(' ', '')
          print('PASS: immutable P0.6 closure evidence is preserved; current checkpoint still attests final P0.6 CLOSED / PASS')
          PY

      - name: Prove P0.6 surface is bounded and non-acquisitive
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          required = {
              '04-REFERENCE/SYSTEM-REPRODUCIBILITY-CONTRACT.md',
              '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json',
              'requirements/qualification.lock.txt',
              'tools/qualification_environment.py',
              'tests/test_system_reproducibility_tier_a.py',
              '.github/workflows/p0-6-system-reproducibility.yml',
          }
          for path in required:
              assert Path(path).is_file(), path
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '7ae5f3cb77d6914699df3cd1104bc02ecb3c2bf4', 'HEAD'],
              text=True,
          ).splitlines())
          forbidden_prefixes = (
              'data/', 'LOCAL-EVIDENCE/', 'tools/download_',
              'tools/probe_dukascopy', 'tools/qualify_dukascopy',
          )
          forbidden = [p for p in changed if p.startswith(forbidden_prefixes) or p.endswith('.bi5')]
          assert not forbidden, forbidden
          print('PASS: P0.6 changes only qualification environment/governance/tests/workflows; no acquisition/data/backtest surface')
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact P0.6 qualification environment
        run: python tools/qualification_environment.py verify

      - name: Break P0.6 E0-E12 environment and workflow attacks
        run: python -m pytest -q tests/test_system_reproducibility_tier_a.py

      - name: Run complete repository regression
        run: python -m pytest -q

      - name: E13 re-break P0.5 D0-D14
        run: python -m pytest -q tests/test_research_interprocess_reattestation_tier_a.py

      - name: E13 re-break P0.4 C0-C15
        run: python -m pytest -q tests/test_research_producer_junction_tier_a.py

      - name: E13 re-break complete P0.2 decision Tier-A boundary
        run: |
          python -m pytest -q \
            tests/test_data_to_context.py \
            tests/test_context_to_research_boundary.py \
            tests/test_context_research_alternative_paths.py \
            tests/test_research_findings_contract.py \
            tests/test_research_reader_adversarial.py \
            tests/test_research_to_decision_boundary.py \
            tests/test_durable_ci_branch_independence.py

      - name: E13 re-break P0.3 calendar and freeze Tier-A boundary
        run: |
          python -m pytest -q \
            tests/test_coverage_execution_window_boundary.py \
            tests/test_current_execution_window_boundary_state.py \
            tests/test_dukascopy_usatech_calendar.py \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_frozen_execution_window.py \
            tests/test_trading_breaks_post_closure_current_state.py

      - name: E14 re-prove current global/window truth and blocked acquisition
        run: |
          python - <<'PY'
          from datetime import date
          from tools.coverage_execution_window_boundary import BLOCKED, DECLARE_GLOBAL_COVERAGE_PASS, evaluate_boundary
          from tools.current_execution_window_boundary_state import derive_current_boundary_evidence, evaluate_current_freeze
          from tools.frozen_execution_window import evaluate_acquisition_after_persisted_freeze, evaluate_persisted_execution_window_freeze

          evidence = derive_current_boundary_evidence()
          state = evidence.state
          assert state.window_start == date(2021, 8, 14)
          assert state.window_end == date(2026, 8, 14)
          assert (evidence.global_candidate_count, evidence.global_resolved_count, state.global_unresolved_count) == (111, 91, 20)
          assert (evidence.window_candidate_count, evidence.window_resolved_count, state.window_unresolved_count) == (68, 68, 0)
          assert evaluate_boundary(DECLARE_GLOBAL_COVERAGE_PASS, state).verdict == BLOCKED
          assert evaluate_current_freeze().decision.verdict == 'PASS'
          frozen = evaluate_persisted_execution_window_freeze()
          assert frozen.decision.verdict == 'PASS'
          assert frozen.evidence.record['massive_acquisition_authorized'] is False
          assert frozen.evidence.record['real_backtest_authorized'] is False
          assert evaluate_acquisition_after_persisted_freeze().verdict == BLOCKED
          print('PASS: global 111/91/20 BLOCKED; selected 68/68/0 and freeze PASS; acquisition BLOCKED')
          PY

      - name: E14 prove pyarrow remains outside envelope and gate is read-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path('04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json').read_text(encoding='utf-8'))
          assert lock['optional_excluded']['pyarrow']['status'] == 'BLOCKED_OUTSIDE_P0_6'
          assert all(name.lower() != 'pyarrow' for name in lock['requirements']['packages'])
          contract = Path('04-REFERENCE/SYSTEM-REPRODUCIBILITY-CONTRACT.md').read_text(encoding='utf-8')
          assert 'native `.bi5` acquisition or acquisition readiness' in contract
          assert 'real-data backtest' in contract
          workflow = Path('.github/workflows/p0-6-system-reproducibility.yml').read_text(encoding='utf-8')
          assert '\npermissions:\n  contents: read\n' in workflow
          print('PASS: optional Parquet dependency remains explicitly outside P0.6; no acquisition/backtest authorization')
          PY

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
