name: B-PE-SEM-03 Part 2 adjudication\n# rerun-after-regex-fix

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - ".github/workflows/bpesem03-part2-adjudication.yml"

permissions:
  contents: write

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: integration/system-v1
          fetch-depth: 0

      - name: Assert materializer/breaker have no provider-network imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          forbidden={"requests","urllib","http","socket","aiohttp"}
          for name in [
              "tools/bpesem03_materialize_adjudication.py",
              "breakers/bpesem03_operational_semantic_adjudication_breaker.py",
          ]:
              tree=ast.parse(Path(name).read_text(encoding="utf-8"))
              bad=[]
              for node in ast.walk(tree):
                  if isinstance(node,ast.Import):
                      for a in node.names:
                          if a.name.split(".")[0] in forbidden:
                              bad.append((node.lineno,a.name))
                  elif isinstance(node,ast.ImportFrom):
                      root=(node.module or "").split(".")[0]
                      if root in forbidden:
                          bad.append((node.lineno,node.module))
              assert not bad,(name,bad)
          print("NO_PROVIDER_NETWORK_IMPORTS_PASS")
          PY

      - name: Materialize operational semantic adjudication candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bpesem03_materialize_adjudication.py | tee /tmp/bpesem03-adjudication.json
          test -f evidence/bpesem03/operational_semantic_rule_adjudication_v0_1.json

      - name: Persist candidate before adversarial break
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/bpesem03 reports/data-qualification/bpesem03_operational_semantic_adjudication_candidate_2026-09-21.md
          git commit -m "evidence: materialize B-PE-SEM-03 semantic adjudication candidate"
          git push origin HEAD:integration/system-v1
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Adversarial break persisted candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          python3 breakers/bpesem03_operational_semantic_adjudication_breaker.py | tee /tmp/bpesem03-break.json
          test -f reports/data-qualification/bpesem03_operational_semantic_adjudication_adversarial_break_2026-09-21.md

      - name: Persist adversarial break
        shell: bash
        run: |
          set -euo pipefail
          git add reports/data-qualification/bpesem03_operational_semantic_adjudication_adversarial_break_2026-09-21.md
          git commit -m "audit: break B-PE-SEM-03 semantic adjudication candidate"
          git push origin HEAD:integration/system-v1
