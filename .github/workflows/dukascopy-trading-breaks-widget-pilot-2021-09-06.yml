name: Dukascopy Trading Breaks Pilot 2021-09-06

on:
  push:
    branches:
      - feat/multi-year-dukascopy-acquisition
    paths:
      - 'tools/probe_dukascopy_trading_breaks_widget_2021_09_06.py'
      - '.github/workflows/dukascopy-trading-breaks-widget-pilot-2021-09-06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run single unresolved-date pilot in headed Chromium
        run: xvfb-run -a python tools/probe_dukascopy_trading_breaks_widget_2021_09_06.py

      - name: Print authoritative pilot result
        if: always()
        run: |
          echo '--- probe_result.json ---'
          cat widget_pilot_artifacts/probe_result.json || true

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-trading-breaks-widget-pilot-2021-09-06
          path: widget_pilot_artifacts/
          if-no-files-found: error
          retention-days: 30
