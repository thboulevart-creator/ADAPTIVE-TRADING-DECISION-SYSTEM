name: B-PE-SEM-04 breaker rerun

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - ".github/workflows/bpesem04-breaker-rerun.yml"

permissions:
  contents: write

jobs:
  breaker-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: integration/system-v1
          fetch-depth: 0

      - name: Assert unchanged candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object evidence/bpesem04/prospective_semantic_authority_closure_contract_v0_1.json)" = "fe0ca12e12624371be28ea8c09340691466a37ce"
          echo "UNCHANGED_CANDIDATE_PASS"

      - name: Re-run corrected breaker
        shell: bash
        run: |
          set -euo pipefail
          python3 breakers/bpesem04_contract_breaker.py | tee /tmp/bpesem04-break-rerun.json
          test -f reports/data-qualification/bpesem04_prospective_semantic_authority_contract_adversarial_break_2026-09-22.md

      - name: Persist corrected breaker report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/data-qualification/bpesem04_prospective_semantic_authority_contract_adversarial_break_2026-09-22.md
          git commit -m "audit: re-break B-PE-SEM-04 contract candidate"
          git push origin HEAD:integration/system-v1
