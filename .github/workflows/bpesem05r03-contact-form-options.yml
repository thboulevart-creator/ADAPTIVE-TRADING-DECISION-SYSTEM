name: B-PE-SEM-05R-03 contact form options

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - ".github/workflows/bpesem05r03-contact-form-options.yml"

permissions:
  contents: write

jobs:
  capture-options:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: integration/system-v1
          fetch-depth: 0

      - name: Assert exact frozen plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object evidence/bpesem05r03/provider_channel_acquisition_plan_v0_1.json)" = "83f82b27898c1a6fbe0a31ef04196317e2f972ff"

      - name: Capture select options read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bpesem05r03_capture_contact_form_options.py | tee /tmp/bpesem05r03-options.json
          test -f evidence/bpesem05r03/provider_contact_form_options_v0_1.json

      - name: Assert no contact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open("evidence/bpesem05r03/provider_contact_form_options_v0_1.json",encoding="utf-8"))
          assert x["method_used"]=="GET_ONLY"
          assert x["no_form_submission"] is True
          assert x["no_contact"] is True
          print("NO_CONTACT_PASS")
          PY

      - name: Persist form options evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/bpesem05r03/provider_contact_form_options_v0_1.json
          git commit -m "evidence: capture B-PE-SEM-05R-03 contact form options"
          git push origin HEAD:integration/system-v1
