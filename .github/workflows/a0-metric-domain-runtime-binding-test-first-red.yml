name: A0 Metric-Domain Runtime Binding Test-First RED

on:
  push:
    branches:
      - sandbox/a0-metric-domain-runtime-binding-test-first-red
    paths:
      - .github/workflows/a0-metric-domain-runtime-binding-test-first-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact persisted preregistration HEAD
        uses: actions/checkout@v4
        with:
          ref: e0320d5df64d39ad1386382efc197b1ae9739ecc
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify exact preregistration and protected identities
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "e0320d5df64d39ad1386382efc197b1ae9739ecc"
          test "$(git hash-object GOVERNANCE/A0-SYNTHETIC-PRODUCER-METRIC-DOMAIN-RUNTIME-BINDING-TEST-FIRST-RED-V0.1.json)" = "935661cbdf4dee031a738e37969baafa0a975d81"
          test "$(git hash-object breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py)" = "bcba5de33a73f9e32ff39e8fb498ab4d471af098"
          test "$(git hash-object src/a0_research_authority.py)" = "18246b818c6c6af8c5412c3b0a515f76c5d5ddc8"
          test "$(git hash-object src/a0_metric_domain_authority.py)" = "9bd05f2a2a97f092c0fc2988319f15caff57dda3"
          test "$(git hash-object GOVERNANCE/A0-SYNTHETIC-PRODUCER-METRIC-DOMAIN-AUTHORITY-V0.1.json)" = "dd205d3e7b4a522a5ba23cef1e665d51c196acb8"
          test "$(git hash-object GOVERNANCE/A0-SYNTHETIC-PRODUCER-METRIC-DOMAIN-RUNTIME-BINDING-GOVERNANCE-DECISION-2026-09-27.md)" = "82b399f06c41fa740a3676d0272cb39759911a7f"
          test "$(git hash-object breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py)" = "e3620ac348a8042fe1d04cfc9b32c16060fce4a3"
          ! grep -q "FOREIGN_METRIC" breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py

      - name: Compile persisted integration breaker
        run: python -m py_compile breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py

      - name: Preserve frozen 107-test surface
        shell: bash
        run: |
          python -m pytest -q             breakers/a0_research_authority_red_breaker.py             breakers/a0_research_authority_adversarial_breaker_v01.py             breakers/a0_research_authority_adversarial_breaker_v02.py             breakers/a0_research_authority_adversarial_breaker_v03.py             breakers/a0_research_authority_adversarial_breaker_v04.py             breakers/a0_synthetic_producer_metric_domain_authority_red_breaker_v01.py             | tee /tmp/a0-existing-107.txt
          grep -q "107 passed" /tmp/a0-existing-107.txt
          echo "A0_EXISTING_107=PASS_UNCHANGED"

      - name: Execute persisted runtime-binding RED family
        shell: bash
        run: |
          set +e
          python -m pytest -q             breakers/a0_synthetic_producer_metric_domain_runtime_binding_red_breaker_v01.py             > /tmp/a0-binding-red.txt 2>&1
          status=$?
          set -e
          cat /tmp/a0-binding-red.txt
          echo "A0_BINDING_RED_PYTEST_EXIT=$status"
          test "$status" -ne 0
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("/tmp/a0-binding-red.txt").read_text()
          failed = re.findall(
              r"FAILED .*::(test_rb\d+_[^ ]+)",
              text,
          )
          m = re.search(
              r"(?:(\d+) failed, )?(?:(\d+) passed)(?: in |,)",
              text,
          )
          if not m:
              print("A0_BINDING_RED_RESULT=UNPARSED")
              raise SystemExit(2)
          fail_count = int(m.group(1) or 0)
          pass_count = int(m.group(2))
          print(
              f"A0_BINDING_RED_RESULT=PASS:{pass_count};FAIL:{fail_count}"
          )
          print(
              "A0_BINDING_RED_FAILED_SET="
              + ",".join(failed)
          )
          assert fail_count > 0
          assert pass_count + fail_count == 20
          PY
