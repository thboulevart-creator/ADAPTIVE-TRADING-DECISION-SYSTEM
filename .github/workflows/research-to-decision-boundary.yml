name: Research to decision boundary

on:
  push:
    branches:
      - feat/decision-producer-contract
  workflow_dispatch:

jobs:
  research-to-decision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run RESEARCH to DECISION boundary tests
        run: python -m pytest tests/test_research_to_decision_boundary.py -q
