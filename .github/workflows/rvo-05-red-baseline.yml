name: RVO-05 RED Baseline

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/rvo-05-red-baseline.yml'
      - 'GOVERNANCE/RVO-05-FROZEN-INTEGRATION-BREAKER-CONTRACT-V0.1.json'
      - 'breakers/rvo_05_integration_breaker.py'
      - 'reports/program/*RVO-05*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  rvo-05-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove persisted HEAD
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Prove frozen upstream identities
        run: |
          test "$(git hash-object src/data/claim_scoped_admission.py)" = "6ce06e1583e61be9e8618136d1bc8fdda608ffd7"
          test "$(git hash-object src/rvo_orchestrator.py)" = "20766da0d609d0056e40df0115a3151d5c703938"
          test "$(git hash-object src/rvo_owner_adapters.py)" = "7ded32616fa959ecdc7857dad95b53884f58c15a"
          test "$(git hash-object src/qualified_experimental_finding.py)" = "a5c6b820df5ea5e89fd61c84feb42cb42e923a5f"
          test "$(git hash-object tools/smf03_core_foundation.py)" = "b67d63bbbc4f93be3fe1e7327c1f1f1cc440ebeb"

      - name: Determine RVO-05 RED lifecycle state
        id: lifecycle
        run: |
          if [ -e src/rvo_05_cc02_bindings.py ]; then
            echo "runtime_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prove RVO-05 runtime absent before RED
        if: steps.lifecycle.outputs.runtime_present == 'false'
        run: test ! -e src/rvo_05_cc02_bindings.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify qualification environment
        run: python tools/qualification_environment.py verify

      - name: Observe exact 25-case RED
        if: steps.lifecycle.outputs.runtime_present == 'false'
        run: |
          set +e
          python -m pytest -q breakers/rvo_05_integration_breaker.py > /tmp/rvo05-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/rvo05-red.log
          test "$rc" -ne 0
          grep -q "25 failed" /tmp/rvo05-red.log
          test "$(grep -c 'RVO05_RUNTIME_ABSENT_EXPECTED_RED' /tmp/rvo05-red.log)" -ge 25
          echo "RVO05_RED_BASELINE=PASS_EXPECTED_25_FAILURES"

      - name: Verify archived RED evidence after implementation
        if: steps.lifecycle.outputs.runtime_present == 'true'
        run: |
          test "$(git hash-object GOVERNANCE/RVO-05-FROZEN-INTEGRATION-BREAKER-CONTRACT-V0.1.json)" = "aeded1d85c095bcba4b58fae24046dca36107215"
          test "$(git hash-object breakers/rvo_05_integration_breaker.py)" = "72a0d362ca3ad32a366b30dbf87470d52e3f5d1d"
          test "$(git hash-object reports/program/2026-10-04-RVO-05-TEST-FIRST-RED-RECEIPT-V0.1.json)" = "cccb520f254279f223fd050cd93da7609a9f8587"
          echo "RVO05_RED_BASELINE=ARCHIVED_AND_IDENTITY_VERIFIED"

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
