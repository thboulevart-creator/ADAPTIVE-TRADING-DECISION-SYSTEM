name: Trading Breaks Recovery Batch 05 Independent Adjudication

on:
  push:
    branches:
      - feat/multi-year-dukascopy-acquisition
    paths:
      - '.github/workflows/trading-breaks-recovery-batch05-adjudication.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjudicate-batch05:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: feat/multi-year-dukascopy-acquisition
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Adversarially break Batch 05 adjudication and parent boundaries
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch05_adjudication.py \
            tests/test_trading_breaks_recovery_batch05.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_batch04_adjudication.py

      - name: Independently adjudicate persisted Batch 05 runtime
        run: python -m tools.trading_breaks_recovery_batch05_adjudication

      - name: Assert exact final Batch 05 verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('reports/data-qualification/historical_trading_breaks_recovery_batch05_adjudication.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['verdict'] == 'PASS'
          assert report['attempted'] == 5
          assert report['pass'] == 5
          assert report['blocked'] == 0
          assert report['fail'] == 0
          assert [x['verdict'] for x in report['adjudications']] == ['PASS'] * 5
          PY

      - name: Prove adjudication consumes persisted frozen evidence only
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/trading_breaks_recovery_batch05_adjudication.py').read_text(encoding='utf-8').lower()
          for forbidden in ('playwright', 'chromium', 'probe_candidate', 'eligible_recovery_queue'):
              assert forbidden not in source, forbidden
          assert 'batch05_targets()' in source
          PY

      - name: Persist independent Batch 05 adjudication reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            reports/data-qualification/historical_trading_breaks_recovery_batch05_adjudication.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch05_qualification.md
          git diff --cached --check
          git commit -m 'evidence: independently adjudicate Trading Breaks Batch 05'
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
