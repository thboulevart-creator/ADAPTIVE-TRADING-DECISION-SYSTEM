name: Batch 12 Persisted Membership Re-break

on:
  push:
    branches: [feat/multi-year-dukascopy-acquisition]
    paths: ['.github/workflows/trading-breaks-recovery-batch12-persisted-membership.yml']

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove frozen baseline ancestry and verifier-only delta
        run: |
          git merge-base --is-ancestor e7a6d596921c8ac94cd4306e474a524d846e9abb HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          test "$(git diff --name-only e7a6d596921c8ac94cd4306e474a524d846e9abb HEAD)" = ".github/workflows/trading-breaks-recovery-batch12-persisted-membership.yml"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-break governed and adversarial regression
        run: |
          python -m pip install pytest==8.4.2
          mapfile -t TESTS < <(find tests -maxdepth 1 -type f \( -name 'test_trading_breaks_recovery_*.py' -o -name 'test_dukascopy_usatech_calendar*.py' -o -name 'test_coverage_execution_window_boundary.py' \) ! -name '*_integration_contract.py' | sort)
          python -m pytest -q "${TESTS[@]}"
      - name: Assert exact persisted Batch 12 membership and reject adversarial variants
        run: |
          python - <<'PY'
          from tools.freeze_trading_breaks_recovery_batch12 import derive
          from tools.trading_breaks_recovery_batch12 import batch12_targets
          from tools.trading_breaks_recovery_progression import (
              eligible_recovery_queue,
              progression_decisions,
              load_attempt_ledger,
              load_material_capability_changes,
          )
          from tools.trading_breaks_recovery_protocol import recovery_queue

          frozen = batch12_targets()
          eligible = eligible_recovery_queue()
          decisions = {x.target_date: x for x in progression_decisions()}
          _, _, attempts = load_attempt_ledger()

          assert frozen == list(derive()) == eligible[:5]
          assert len(frozen) == 5
          assert len(recovery_queue()) == 26
          assert len(eligible) == 13
          assert len(attempts) == 55
          assert sum((not x.eligible) and x.latest_attempt_outcome == 'BLOCKED' for x in decisions.values()) == 13
          assert load_material_capability_changes() == []

          for day, reason in frozen:
              decision = decisions[day]
              assert decision.candidate_reason == reason
              assert decision.eligible
              assert decision.reason == 'INITIAL_ATTEMPT'
              assert decision.latest_attempt_id is None
              assert decision.latest_attempt_outcome is None

          attacks = [
              eligible[1:6],
              [frozen[1], frozen[0], *frozen[2:]],
              [*frozen[:-1], eligible[5]],
              frozen[:-1],
              [*frozen, eligible[5]],
              [frozen[0], frozen[0], *frozen[2:]],
              list(reversed(frozen)),
          ]
          assert all(attack != frozen for attack in attacks)

          print('PASS: persisted Batch 12 membership matches governed prefix and adversarial variants are rejected')
          for i, (day, reason) in enumerate(frozen, 1):
              print(f'{i}: {day.isoformat()} — {reason}')
          PY
      - name: Prove byte-stable progression and read-only clean worktree
        run: |
          BEFORE="$(sha256sum reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json | awk '{print $1}')"
          python -m tools.trading_breaks_recovery_progression >/tmp/b12-membership.json
          AFTER="$(sha256sum reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"
          git diff --exit-code
          test -z "$(git status --porcelain)"
