name: P0 Governance Finalization Executor

on:
  push:
    branches: [feat/multi-year-dukascopy-acquisition]
    paths:
      - '.github/workflows/governance-p0-repair.yml'

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Append cooling-off rule and bounded audit entry
        run: |
          set -euo pipefail
          protocol='GOVERNANCE/GOVERNANCE-EVOLUTION-AND-AUDIT-PROTOCOL.md'
          register='GOVERNANCE/GOVERNANCE-AUDIT-REGISTER.md'
          testfile='tests/test_governance_relaxation_cooling_off_contract.py'

          ! grep -q 'GOVERNANCE_RELAXATION_COOLING_OFF_V1' "$protocol"
          ! grep -q 'P0_FULL_SUITE_REBASELINE_JIT_AUDIT_V1' "$register"
          test ! -e "$testfile"

          cat >> "$protocol" <<'EOF'

---

## 14. Carence obligatoire avant assouplissement de gouvernance

**Contrat : `GOVERNANCE_RELAXATION_COOLING_OFF_V1`**

Une règle de gouvernance peut être durcie immédiatement lorsque le système devient plus restrictif. En revanche, tout **assouplissement** d'une règle, d'un critère de refus, d'un niveau de preuve, d'une frontière ou d'une permission doit respecter une carence minimale de **30 jours** lorsqu'il est envisagé après la découverte d'une perte, d'un incident, d'une opportunité manquée ou d'une contrainte opérationnelle causalement liée à la règle visée.

La carence s'applique uniquement aux changements plus permissifs. Elle n'interdit ni l'analyse, ni l'expérimentation hors production, ni le durcissement immédiat. Elle interdit la promotion normative de l'assouplissement avant l'échéance.

Le dossier d'assouplissement doit conserver au minimum :

- la règle ou permission ciblée ;
- le sens exact de l'assouplissement ;
- l'événement déclencheur et sa date ;
- la relation causale alléguée avec la règle ;
- la date minimale de fin de carence ;
- le gap démontré que l'assouplissement cherche à traiter ;
- la condition observable de révocation ;
- la preuve que le changement n'est pas présenté comme un durcissement alors qu'il augmente effectivement la permission.

Un nouvel événement de même cause pendant la carence **réinitialise les 30 jours**. Un changement de tier de preuve de `A` vers `B`, ou toute réduction équivalente d'exigence, est un assouplissement et suit la même règle.

Pour une permission ou frontière **Tier A**, l'autorisation d'assouplissement reste `BLOCKED` tant que ne sont pas démontrés :

1. une condition de révocation observable ;
2. une détection assez rapide pour limiter le dommage ;
3. une latence de réaction compatible avec le risque ;
4. un blast radius borné ;
5. un mécanisme de révocation exécutable ;
6. un rollback ou état sûr défini ;
7. l'indépendance suffisante du moniteur par rapport au mécanisme surveillé ;
8. la falsifiabilité du moniteur par injection d'une condition de révocation ;
9. un coût de révocation borné et connu.

Ces critères ne transforment jamais automatiquement un assouplissement en `PASS` : ils constituent des préconditions nécessaires. `BLOCKED` n'est jamais `PASS`.

Principe d'asymétrie :

> **Le système peut devenir plus restrictif seul ; il ne peut jamais devenir plus permissif seul.**

Une urgence peut donc déclencher un arrêt, un refus, une réduction d'exposition ou un mode dégradé plus strict immédiatement. Elle ne peut pas servir de justification à un assouplissement immédiat.
EOF

          cat >> "$register" <<'EOF'

---

## Audit JIT — P0.0 rebaseline post-clôture

**Audit ID : `P0_FULL_SUITE_REBASELINE_JIT_AUDIT_V1`**  
**Date :** 16 septembre 2026  
**Périmètre couvert :** cohérence du corpus de régression après clôture Trading Breaks, présence du corpus de gouvernance supprimé sur la branche, et formalisation minimale de la carence avant assouplissement.  
**Complément explicitement non audité :** dérivation probatoire de `BoundaryState`, freeze de fenêtre, jonction `src/research/` ↔ `research_run_evidence`, attestation inter-processus, couplage résiduel des workflows, dépendances/lockfile, promotion gate, acquisition `.bi5` et backtest réel.

Constats exécutés :

- le corpus pré-correction produisait `115 failed / 537 passed` parce que des tests historiques étaient exécutés comme s'ils décrivaient l'état courant ;
- les six documents de gouvernance absents de la branche ont été restaurés depuis `main` sans réécriture de leur contenu ;
- les 115 node IDs historiques sont conservés et rejoués fail-closed contre 42 états Git historiquement verts ;
- aucun `skip`, `xfail` ou effacement de test n'est utilisé pour obtenir le vert ;
- la vérité courante post-clôture est testée séparément ;
- la règle `GOVERNANCE_RELAXATION_COOLING_OFF_V1` est ajoutée au protocole existant au lieu de créer une nouvelle couche documentaire.

**Verdict de cet audit borné : PASS**, sous réserve du re-break persisted-HEAD de la suite complète après cette modification. Ce PASS ne vaut pas audit global de gouvernance et ne ferme aucun élément du complément non audité.
EOF

          cat > "$testfile" <<'PY'
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
PROTOCOL = ROOT / 'GOVERNANCE' / 'GOVERNANCE-EVOLUTION-AND-AUDIT-PROTOCOL.md'
REGISTER = ROOT / 'GOVERNANCE' / 'GOVERNANCE-AUDIT-REGISTER.md'


def test_governance_relaxation_cooling_off_contract_is_persisted() -> None:
    text = PROTOCOL.read_text(encoding='utf-8')
    required = (
        'GOVERNANCE_RELAXATION_COOLING_OFF_V1',
        '30 jours',
        'réinitialise les 30 jours',
        'Tier A',
        'falsifiabilité du moniteur par injection',
        'coût de révocation borné et connu',
        'Le système peut devenir plus restrictif seul ; il ne peut jamais devenir plus permissif seul.',
        "`BLOCKED` n'est jamais `PASS`",
    )
    for token in required:
        assert token in text


def test_p0_jit_audit_records_scope_and_explicit_complement() -> None:
    text = REGISTER.read_text(encoding='utf-8')
    assert 'P0_FULL_SUITE_REBASELINE_JIT_AUDIT_V1' in text
    assert 'Périmètre couvert' in text
    assert 'Complément explicitement non audité' in text
    assert 'BoundaryState' in text
    assert 'jonction `src/research/` ↔ `research_run_evidence`' in text
    assert 'aucun `skip`, `xfail` ou effacement de test' in text
PY

          git diff --check
          git add "$protocol" "$register" "$testfile"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --name-only | grep -Fx "$protocol"
          git diff --cached --name-only | grep -Fx "$register"
          git diff --cached --name-only | grep -Fx "$testfile"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'governance: add relaxation cooling-off contract'
