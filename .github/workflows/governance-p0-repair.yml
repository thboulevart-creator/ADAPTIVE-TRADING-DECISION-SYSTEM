name: P0 Historical Baseline Exception Resolver

on:
  push:
    branches: [feat/multi-year-dukascopy-acquisition]
    paths:
      - '.github/workflows/governance-p0-repair.yml'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install pytest==8.4.2

      - name: Find first descendant where each exceptional historical file is green
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          import sys
          from pathlib import Path

          CASES = {
              'tests/test_dukascopy_usatech_calendar_2024_2025_batch10.py': 'f300e6edb8315bce94835738cec96bbde04c6c81',
              'tests/test_trading_breaks_recovery_batch15.py': 'ae3d621f3460ec96a5c96024e05f657f5b2e25b5',
              'tests/test_trading_breaks_target_day_overlap_v2_state.py': 'a805cf576f843e80ab01373da74e89657d8aefc2',
          }
          root = Path.cwd()
          base = root.parent / '_p0_exception_worktrees'
          base.mkdir(exist_ok=True)
          env = dict(os.environ)
          env['PYTHONDONTWRITEBYTECODE'] = '1'

          def cmd(args, *, cwd=root, check=True):
              return subprocess.run(args, cwd=cwd, env=env, text=True,
                                    stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                    check=check)

          head = cmd(['git', 'rev-parse', 'HEAD']).stdout.strip()
          found = {}
          for path, start in CASES.items():
              commits = [start]
              tail = cmd(['git', 'rev-list', '--reverse', '--ancestry-path', f'{start}..{head}']).stdout.splitlines()
              commits.extend(c for c in tail if c)
              print(f'SEARCH {path}: {len(commits)} candidate commits')
              for i, commit in enumerate(commits):
                  exists = cmd(['git', 'cat-file', '-e', f'{commit}:{path}'], check=False).returncode == 0
                  if not exists:
                      continue
                  wt = base / f'{commit[:12]}-{i}'
                  cmd(['git', 'worktree', 'add', '--detach', str(wt), commit])
                  probe = cmd([sys.executable, '-m', 'pytest', '-q', path], cwd=wt, check=False)
                  cmd(['git', 'worktree', 'remove', '--force', str(wt)])
                  if probe.returncode == 0:
                      found[path] = commit
                      print(f'FIRST_GREEN {path} {commit}')
                      print(probe.stdout)
                      break
              if path not in found:
                  raise SystemExit(f'NO_GREEN_DESCENDANT:{path}')

          if len(found) != len(CASES):
              raise SystemExit('EXCEPTION_BASELINE_RESOLUTION_INCOMPLETE')
          print('ALL_EXCEPTION_BASELINES_RESOLVED')
          for path, commit in found.items():
              print(f'RESOLVED {path} -> {commit}')
          PY

      - name: Prove resolver is read-only
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
