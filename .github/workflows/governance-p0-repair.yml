name: P0 Full Suite Persisted HEAD Rebreak

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  rebreak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install pytest==8.4.2

      - name: Validate historical baseline manifest
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path('tests/historical_regression_baselines.json').read_text(encoding='utf-8'))
          entries = data.get('entries')
          assert data.get('schema') == 'HISTORICAL_REGRESSION_BASELINES_V1'
          assert isinstance(entries, dict)
          assert data.get('historical_node_count') == len(entries) == 115
          assert data.get('historical_file_count') == len({n.split('::', 1)[0] for n in entries}) == 42
          assert all(re.fullmatch(r'[0-9a-f]{40}', c) for c in entries.values())
          PY

      - name: Run complete repository test suite
        run: python -m pytest -q

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
