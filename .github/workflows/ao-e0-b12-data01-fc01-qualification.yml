name: AO-E0 DATA-01 FC-01 Blind Collection Qualification

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'GOVERNANCE/AO-E0-B12-DATA-01-FC-01-*.json'
      - 'tools/ao_e0_b12_data01_fc01.py'
      - 'tests/test_ao_e0_b12_data01_fc01.py'
      - '.github/workflows/ao-e0-b12-data01-fc01-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: FC-01 synthetic qualification
        run: python -m pytest -q tests/test_ao_e0_b12_data01_fc01.py

      - name: ACQ-02 primitive regression
        run: python -m pytest -q tests/test_ao_e0_b12_data01_acq02.py

      - name: Exact V0.2 and TC-02 closure bindings
        run: |
          test "$(git hash-object GOVERNANCE/AO-E0-B8-M06-02-SAMPLE-ADEQUACY-PREREGISTRATION-V0.2.json)" = "eabb5fb48f8cccb14d51fafb125c5b906da1761d"
          test "$(git hash-object GOVERNANCE/AO-E0-B12-DATA-01-PROSPECTIVE-FORWARD-INSTANCE-FORMATION-CONTRACT-V0.2.json)" = "3ad012886be330f1fc6af964bfb6b1cd8ce55290"
          test "$(git hash-object GOVERNANCE/AO-E0-B8-DR-01-FINAL-QUALIFICATION-DECISION-RULE-V0.2.json)" = "2c245a21e72e4ed75e807e088d717ff71f17732c"
          test "$(git hash-object GOVERNANCE/AO-E0-B12-DATA-01-TC-01-COUNT-ONLY-CONTRACT-V0.2.json)" = "22771d1e050ff08da05edaf69c801565f4666142"
          test "$(git hash-object reports/program/2026-10-07-AO-E0-B12-DATA-01-TC-02-FINAL-CLOSURE-RECEIPT-V0.1.json)" = "8621bb632ef5ea2dd42e16d9b036eeb8b00f4e14"

      - name: Prove FC-01 has no TC-01 or inference dependency
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('tools/ao_e0_b12_data01_fc01.py')
          tree=ast.parse(p.read_text())
          imported=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Import):
                  imported.extend(a.name for a in node.names)
              elif isinstance(node,ast.ImportFrom) and node.module:
                  imported.append(node.module)
          joined=' '.join(imported).lower()
          for token in ('tc01','dr01','m04','m05','e1_04','e1_05'):
              assert token not in joined, token
          PY

      - name: Authority firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('GOVERNANCE/AO-E0-B12-DATA-01-FC-01-COLLECTION-CONTRACT-V0.1.json').read_text())
          a=c['authority']
          assert a['tc02']=='CLOSED'
          assert a['tc02_read_token']=='CONSUMED'
          assert a['periodic_real_tc01_read'] is False
          assert a['continuous_trade_count_monitoring'] is False
          assert a['dr01_real_inference'] is False
          assert a['m04_real_forward_diagnostics'] is False
          assert a['m05_real_forward_inference'] is False
          assert a['pipe01_first_performance_read'] is False
          assert a['b12']=='CLOSED'
          assert a['oos_performance_consumption'] is False
          assert a['real_forward_performance_observation'] is False
          assert a['force'] is False
          PY

      - name: Clean worktree
        if: always()
        run: |
          git diff --exit-code
          git clean -fd
          test -z "$(git status --porcelain)"
