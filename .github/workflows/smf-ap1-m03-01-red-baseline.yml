name: SMF-AP1-M03-01 RED Baseline

on:
  push:
    branches: [integration/system-v1]
    paths:
      - 'GOVERNANCE/SMF-AP1-M03-01-FROZEN-ADVERSARIAL-BREAKER-CONTRACT-V0.1.json'
      - 'breakers/smf_ap1_m03_01_binding_breaker.py'
      - '.github/workflows/smf-ap1-m03-01-red-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Prove frozen identities
        run: |
          test "$(git hash-object GOVERNANCE/SMF-AP1-M03-01-CLAIM-SCOPED-ACTIVATION-CONTRACT-V0.1.json)" = "847bce0365921024addb42c930dc5f47dee9401c"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
      - name: Observe exact expected RED
        run: |
          set +e
          python -m pytest -q breakers/smf_ap1_m03_01_binding_breaker.py > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          test "$rc" -ne 0
          grep -q "28 failed" /tmp/red.log
          test "$(grep -c 'SMF_AP1_M03_01_RUNTIME_ABSENT_EXPECTED_RED' /tmp/red.log)" -ge 28
      - name: Prove no runtime and no AP1 output
        run: |
          test ! -e src/smf_ap1_m03_binding.py
          test ! -e tools/smf_ap1_m03_companion.py
          test ! -e ATDS-AP1-INTRADAY-SPREAD-CENSUS.json
          echo "PASS: RED is capability absence only"
      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
