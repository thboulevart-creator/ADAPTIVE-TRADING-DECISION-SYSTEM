name: E1-08A-R2 Windows Runtime Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/e1-08a-r2-windows-runtime-qualification.yml'
      - 'GOVERNANCE/E1-08A-R2-WINDOWS-RUNTIME-CORRECTION-V0.1.json'
      - 'breakers/e1_08a_r2_windows_runtime_breaker.py'
      - 'tools/e1_08a_r1_real_run.py'
      - 'requirements/e1_08a_r1_real_run.lock.txt'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  PYTEST_ADDOPTS: '-p no:cacheprovider'
  TZ: 'UTC'

jobs:
  windows-runtime:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install exact R2 environment
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt
          python -m pip install --disable-pip-version-check --no-deps -r requirements/e1_08a_r1_real_run.lock.txt
          python -c "import platform,pyarrow; assert platform.python_version()=='3.12.10'; assert pyarrow.__version__=='25.0.1'; print('R2_WINDOWS_ENVIRONMENT=PASS')"

      - name: Run frozen R2 breaker
        shell: pwsh
        run: python -m pytest -q breakers/e1_08a_r2_windows_runtime_breaker.py

      - name: Prove clean worktree
        if: always()
        shell: pwsh
        run: |
          git diff --exit-code
          if (git status --porcelain) { throw "WORKTREE_NOT_CLEAN" }
