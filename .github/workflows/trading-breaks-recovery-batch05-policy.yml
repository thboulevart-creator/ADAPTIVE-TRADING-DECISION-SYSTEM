name: Trading Breaks Recovery Batch 05 Policy Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch05-policy-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: feat/multi-year-dukascopy-acquisition
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest only
        run: python -m pip install pytest==8.4.2

      - name: Adversarially qualify Batch 05 membership and parent boundaries
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_batch05.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_batch04.py \
            tests/test_trading_breaks_recovery_batch04_integration.py \
            tests/test_dukascopy_usatech_calendar_2022_batch04.py \
            tests/test_dukascopy_usatech_calendar_coverage.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Assert exact mechanically frozen Batch 05 membership
        run: |
          python - <<'PY'
          from datetime import date
          from tools.trading_breaks_recovery_batch05 import BATCH_SIZE, batch05_targets
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue

          expected = [
              (date(2023, 1, 16), 'MARTIN_LUTHER_KING_DAY'),
              (date(2023, 2, 20), 'PRESIDENTS_DAY'),
              (date(2023, 4, 7), 'GOOD_FRIDAY'),
              (date(2023, 5, 29), 'MEMORIAL_DAY'),
              (date(2023, 6, 19), 'JUNETEENTH_OBSERVED'),
          ]
          assert BATCH_SIZE == 5
          assert eligible_recovery_queue()[:5] == expected
          assert batch05_targets() == eligible_recovery_queue()[:5]
          print('PASS: Batch 05 membership equals governed post-Batch04 eligible_recovery_queue()[:5] at freeze')
          for day, reason in expected:
              print(day.isoformat(), reason)
          PY

      - name: Prove Batch 05 freeze contains no browser execution path
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('tools/trading_breaks_recovery_batch05.py').read_text(encoding='utf-8').lower()
          for forbidden in ('playwright', 'chromium', 'probe_candidate', 'asyncio'):
              assert forbidden not in source, forbidden
          print('PASS: Batch 05 freeze is membership-only; no browser/probe path exists')
          PY
