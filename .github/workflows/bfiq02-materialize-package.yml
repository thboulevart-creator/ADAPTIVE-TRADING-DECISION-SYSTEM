name: B-FIQ-02 materialize pre-execution package

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - "tools/bfiq02_materialize_package.py"
      - ".github/workflows/bfiq02-materialize-package.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: integration/system-v1
          fetch-depth: 0

      - name: Materialize sealed package without provider access
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bfiq02_materialize_package.py | tee /tmp/bfiq02-summary.json
          test -f evidence/bfiq02/preexecution_package_v0_1.json

      - name: Assert materializer has no provider-network code path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("tools/bfiq02_materialize_package.py").read_text(encoding="utf-8"))
          forbidden_import_roots = {"requests", "urllib", "http", "socket", "aiohttp"}
          bad = []

          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name.split(".")[0] in forbidden_import_roots:
                          bad.append(("import", alias.name, node.lineno))
              elif isinstance(node, ast.ImportFrom):
                  root = (node.module or "").split(".")[0]
                  if root in forbidden_import_roots:
                      bad.append(("from", node.module, node.lineno))
              elif isinstance(node, ast.Call):
                  fn = node.func
                  if isinstance(fn, ast.Attribute) and isinstance(fn.value, ast.Name):
                      if fn.value.id == "subprocess" and fn.attr in {"run","Popen","call","check_call","check_output"}:
                          bad.append(("subprocess-call", fn.attr, node.lineno))

          assert not bad, bad
          print("NO_PROVIDER_NETWORK_CODE_PATH_PASS")
          PY

      - name: Commit materialized artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/bfiq02 reports/data-qualification/bfiq02_preexecution_package_candidate_2026-09-21.md
          git commit -m "evidence: materialize B-FIQ-02 pre-execution package"
          git push origin HEAD:integration/system-v1
