name: A0 Minimal Correction ABF V0.1 Persisted Rebreak

on:
  push:
    branches:
      - sandbox/a0-minimal-correction-abf-v01-persisted-rebreak
    paths:
      - .github/workflows/a0-minimal-correction-abf-v01-persisted-rebreak.yml

permissions:
  contents: read

jobs:
  rebreak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed correction HEAD
        uses: actions/checkout@v4
        with:
          ref: 7e2a0052e99669ed42e55bbd9a81cf0a23a4c0f2
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify exact persisted HEAD and correction scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "7e2a0052e99669ed42e55bbd9a81cf0a23a4c0f2"
          python - <<'PY'
          import subprocess
          expected = {"src/a0_research_authority.py"}
          got = set(subprocess.check_output(
              ["git", "diff", "--name-only",
               "22a65b6971840efdff401df8481a011b64106da5",
               "7e2a0052e99669ed42e55bbd9a81cf0a23a4c0f2"],
              text=True,
          ).splitlines())
          assert got == expected, (got, expected)
          PY

      - name: Verify protected identities
        shell: bash
        run: |
          test "$(git hash-object src/a0_research_authority.py)" = "c7c1f37d9d306e0424274b276d42ab422beac560"
          test "$(git hash-object breakers/a0_research_authority_red_breaker.py)" = "e02ecfa6d30c2877a33f5c5d81b161ee562202b6"
          test "$(git hash-object breakers/a0_research_authority_adversarial_breaker_v01.py)" = "2911d5b282ccbb6147b2b54a7db5c357c2d315b6"
          test "$(git hash-object GOVERNANCE/A0-RESEARCH-FINDINGS-AUTHORITY-INTERPRETATION-CONTRACT-V0.3.md)" = "f1168481879f33f8762dcb1e19e2ad35211c8ec2"

      - name: Compile governed candidate and breakers
        run: |
          python -m py_compile src/a0_research_authority.py
          python -m py_compile breakers/a0_research_authority_red_breaker.py
          python -m py_compile breakers/a0_research_authority_adversarial_breaker_v01.py

      - name: Fresh persisted-head 24-test rebreak
        shell: bash
        run: |
          python -m pytest -q             breakers/a0_research_authority_red_breaker.py             breakers/a0_research_authority_adversarial_breaker_v01.py             | tee /tmp/a0-persisted-correction.txt
          grep -q "24 passed" /tmp/a0-persisted-correction.txt
          echo "A0_MINIMAL_CORRECTION_ABF_V01_PERSISTED_REBREAK=PASS_24_OF_24"
