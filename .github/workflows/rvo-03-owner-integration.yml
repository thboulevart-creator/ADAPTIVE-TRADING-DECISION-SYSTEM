name: RVO-03 Canonical Owner Integration Qualification

on:
  push:
    branches:
      - integration/system-v1
    paths:
      - '.github/workflows/rvo-03-owner-integration.yml'
      - 'GOVERNANCE/RVO-03-CANONICAL-OWNER-CAPABILITY-MATRIX-V0.1.json'
      - 'src/rvo_owner_adapters.py'
      - 'tests/test_rvo_owner_integration.py'
      - 'reports/program/*RVO-03*'
      - 'src/rvo_orchestrator.py'
      - 'breakers/rvo_02_frozen_breaker_v0_1.py'
      - 'GOVERNANCE/RVO-01-FROZEN-ADVERSARIAL-BREAKER-CONTRACT-V0.1.json'
      - '04-REFERENCE/QUALIFICATION-ENVIRONMENT-LOCK.json'
      - 'requirements/qualification.lock.txt'
      - 'tools/qualification_environment.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: 0
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  RVO03_PARENT: '966c65c5cbcda677ddaab5a8070f7c2bafcaaf8b'

jobs:
  rvo-03:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact persisted HEAD and RVO-02 ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${RVO03_PARENT}" HEAD

      - name: Prove frozen RVO-01 and RVO-02 identities
        run: |
          test "$(git hash-object GOVERNANCE/RVO-THIN-ORCHESTRATOR-TARGET-ARCHITECTURE-R1-HUMAN-ADJUDICATION-2026-10-04.md)" = "d83685b23938b4b7baa9ab098416aa1e1178ab67"
          test "$(git hash-object GOVERNANCE/RVO-01-FROZEN-ADVERSARIAL-BREAKER-CONTRACT-V0.1.json)" = "975dbd74abc999d0b907bae360b23abd224dbc5d"
          test "$(git hash-object src/rvo_orchestrator.py)" = "20766da0d609d0056e40df0115a3151d5c703938"
          test "$(git hash-object breakers/rvo_02_frozen_breaker_v0_1.py)" = "c5835e8a0a9c3ff26201a5860d0866478b3cdacb"
          test "$(git hash-object tests/rvo_runtime_fixture.py)" = "47af02f575943c89a5647664710a15036cf4332e"
          test "$(git hash-object tests/test_rvo_orchestrator.py)" = "c95300922fcf7707c4317cfbf20510ad6cba91db"
          test "$(git hash-object reports/program/2026-10-04-RVO-02-SYNTHETIC-QUALIFICATION-RECEIPT-V0.1.json)" = "bcd5454c5bbf7208de76685cc98375347078d868"
          test "$(git hash-object reports/program/2026-10-04-RVO-02-TEST-FIRST-SYNTHETIC-QUALIFICATION.md)" = "26d91f9a1017d58c84c4a620115f09197ccf568e"

      - name: Prove exact RVO-03 matrix and adapter identities
        run: |
          test "$(git hash-object GOVERNANCE/RVO-03-CANONICAL-OWNER-CAPABILITY-MATRIX-V0.1.json)" = "5f2406189af8e118ca8f20f5a7f92f3a2ce91c13"
          test "$(git hash-object src/rvo_owner_adapters.py)" = "7ded32616fa959ecdc7857dad95b53884f58c15a"
          test "$(git hash-object tests/test_rvo_owner_integration.py)" = "5fb325e420a72a64ae024fbea0b8332cd0dcc63f"

      - name: Prove RVO-03 delta does not modify owners
        run: |
          python - <<'PY'
          import subprocess
          parent = "966c65c5cbcda677ddaab5a8070f7c2bafcaaf8b"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{parent}..HEAD"],
              text=True,
          ).splitlines()
          exact = {
              ".github/workflows/rvo-03-owner-integration.yml",
              "GOVERNANCE/RVO-03-CANONICAL-OWNER-CAPABILITY-MATRIX-V0.1.json",
              "src/rvo_owner_adapters.py",
              "tests/test_rvo_owner_integration.py",
          }
          for path in changed:
              if path in exact:
                  continue
              if path.startswith("reports/program/") and "RVO-03" in path:
                  continue
              raise SystemExit(f"UNAUTHORIZED_RVO03_DELTA:{path}")
          print("PASS: RVO-03 delta is RVO-only")
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install exact locked qualification packages
        run: python -m pip install --disable-pip-version-check --no-deps -r requirements/qualification.lock.txt

      - name: Verify exact qualification environment
        run: python tools/qualification_environment.py verify

      - name: Replay unchanged RVO-02 frozen breaker
        run: python -m pytest -q breakers/rvo_02_frozen_breaker_v0_1.py

      - name: Execute RVO-03 canonical owner synthetic integration
        run: python -m pytest -q tests/test_rvo_owner_integration.py

      - name: Re-break protected owner surfaces
        run: |
          python -m pytest -q             breakers/p1_16_qualified_experimental_finding_breaker.py             breakers/smf03_core_foundation_red_breaker.py             breakers/smf03_dependence_inference_red_breaker.py             breakers/smf03_evidence_governance_red_breaker.py             breakers/mcepr_registry_breaker_v0_1.py             breakers/p22_01_pure_state_projector_red_breaker.py             breakers/p22_02_identity_state_verifier_red_breaker.py             breakers/p22_03_evidence_envelope_recorder_red_breaker.py             tests/test_dataset_admissibility.py

      - name: Prove clean worktree
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
