name: Trading Breaks Recovery Batch 07 Atomic Integration Resume

on:
  push:
    branches:
      - feat/multi-year-dukascopy-acquisition
    paths:
      - '.github/workflows/trading-breaks-recovery-batch07-integration-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-batch07-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering persisted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove pre-integration state is still untouched
        run: |
          git merge-base --is-ancestor 56ae3fea6ff24e42feeb80f621729e6949f83251 HEAD
          git fetch origin feat/multi-year-dukascopy-acquisition
          test "$(git rev-parse origin/feat/multi-year-dukascopy-acquisition)" = "$GITHUB_SHA"
          python - <<'PY'
          from tools.integrate_trading_breaks_recovery_batch07 import load_authoritative_adjudication, guard_preintegration_state
          load_authoritative_adjudication()
          guard_preintegration_state()
          print('PASS: Batch 07 governed state remains pre-integration')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest==8.4.2

      - name: Apply minimal Batch05 integration-test rewrite correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/integrate_trading_breaks_recovery_batch07.py')
          text = path.read_text(encoding='utf-8')
          anchor = '        ("(68, 23, 45)", "(68, 26, 42)", "Batch05 window accounting"),\n'
          addition = '        ("assert len(attempts) == 30", "assert len(attempts) == 35", "Batch05 integration ledger total"),\n'
          fn_start = text.index('def update_batch05_integration_test()')
          fn_end = text.index('\ndef update_batch06_test()', fn_start)
          segment = text[fn_start:fn_end]
          if addition in segment:
              print('PASS: Batch05 integration ledger rewrite already present')
          else:
              if segment.count(anchor) != 1:
                  raise SystemExit(f'BATCH05_INTEGRATION_ANCHOR_COUNT:{segment.count(anchor)}')
              segment = segment.replace(anchor, anchor + addition, 1)
              text = text[:fn_start] + segment + text[fn_end:]
              path.write_text(text, encoding='utf-8')
              print('PASS: restored distinct Batch05 integration ledger rewrite')
          PY

      - name: Re-break corrected integrator before mutation
        run: |
          python -m pytest -q tests/test_trading_breaks_recovery_batch07_integration_contract.py
          python - <<'PY'
          import inspect
          import tools.integrate_trading_breaks_recovery_batch07 as integration
          source = inspect.getsource(integration.update_batch05_integration_test)
          assert 'Batch05 integration ledger total' in source
          assert '("assert len(attempts) == 30", "assert len(attempts) == 35"' in source
          integration.load_authoritative_adjudication()
          integration.guard_preintegration_state()
          print('PASS: corrected integrator re-broken before governed mutation')
          PY

      - name: Persist preparatory source correction only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/integrate_trading_breaks_recovery_batch07.py
          git diff --cached --check
          git commit -m 'fix: restore Batch 07 Batch05 integration rewrite'
          echo "SOURCE_CORRECTION_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feat/multi-year-dukascopy-acquisition

      - name: Prepare atomic Batch 07 state in worktree
        run: python -m tools.integrate_trading_breaks_recovery_batch07

      - name: Regenerate deterministic progression
        run: python -m tools.trading_breaks_recovery_progression

      - name: Break all calendar coverage progression regressions
        run: |
          python -m pytest -q \
            tests/test_trading_breaks_recovery_*.py \
            tests/test_dukascopy_usatech_calendar*.py \
            tests/test_coverage_execution_window_boundary.py

      - name: Assert exact post-integration semantics
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from tools.dukascopy_usatech_calendar import SPECIAL_SESSION_EVIDENCE
          from tools.dukascopy_usatech_calendar_coverage import NO_SPECIAL_CHANGE_EVIDENCE, audit_calendar_coverage
          from tools.trading_breaks_recovery_progression import eligible_recovery_queue, load_attempt_ledger, load_material_capability_changes, progression_decisions
          from tools.trading_breaks_recovery_protocol import recovery_queue

          g = audit_calendar_coverage()
          w = audit_calendar_coverage(date(2021, 8, 14), date(2026, 8, 14))
          _, _, attempts = load_attempt_ledger()
          p = json.load(open('reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json', encoding='utf-8'))
          raw = {d for d, _ in recovery_queue()}
          eligible = eligible_recovery_queue()
          eligible_days = {d for d, _ in eligible}
          decisions = {d.target_date: d for d in progression_decisions()}

          assert (g['candidate_dates'], g['resolved_candidate_dates'], g['unresolved_candidate_dates']) == (111, 49, 62)
          assert (w['candidate_dates'], w['resolved_candidate_dates'], w['unresolved_candidate_dates']) == (68, 26, 42)
          assert g['evidence_shape_errors'] == [] and g['orphan_special_evidence'] == [] and g['contradictory_evidence_dates'] == []
          assert len(attempts) == 35
          b7 = [x for x in attempts if x.attempt_id.startswith('batch07:')]
          assert [x.attempt_sequence for x in b7] == [31, 32, 33, 34, 35]
          assert [x.outcome for x in b7] == ['PASS', 'BLOCKED', 'BLOCKED', 'PASS', 'PASS']
          assert load_material_capability_changes() == []
          assert p['verdict'] == 'PASS'
          assert p['calendar_unresolved_count'] == 42
          assert p['attempt_ledger_count'] == 35
          assert p['attempted_blocked_ineligible_count'] == 9
          assert p['eligible_initial_or_retry_count'] == 33

          passes = {date(2023,12,22), date(2024,1,15), date(2024,2,19)}
          blocked = {date(2023,12,25), date(2024,1,1)}
          assert passes <= set(SPECIAL_SESSION_EVIDENCE)
          assert passes.isdisjoint(raw) and passes.isdisjoint(eligible_days)
          assert blocked.isdisjoint(set(SPECIAL_SESSION_EVIDENCE))
          assert blocked.isdisjoint(set(NO_SPECIAL_CHANGE_EVIDENCE))
          assert blocked <= raw and blocked.isdisjoint(eligible_days)
          for day in blocked:
              assert decisions[day].reason == 'SAME_CAPABILITY_BLOCKED_ALREADY_ATTEMPTED'
              assert decisions[day].latest_attempt_outcome == 'BLOCKED'
              assert decisions[day].contract_verdict == 'PASS'
          assert len(eligible) == 33
          assert eligible[0] == (date(2024,3,29), 'GOOD_FRIDAY')
          print('PASS: exact Batch 07 integrated state = 49 resolved / 42 unresolved / 35 attempts / 9 blocked-ineligible / 33 eligible')
          PY

      - name: Prove integration surface has no forbidden path
        run: |
          python - <<'PY'
          import inspect
          import tools.integrate_trading_breaks_recovery_batch07 as integration
          surface = '\n'.join(inspect.getsource(x) for x in (
              integration.load_authoritative_adjudication,
              integration.guard_preintegration_state,
              integration.integrate_calendar,
              integration.integrate_attempt_ledger,
              integration.main,
          )).lower()
          for token in ('no_special_change_evidence', ''.join(('play','wright')), ''.join(('chro','mium')), ''.join(('probe_','candidate'))):
              assert token not in surface, token
          print('PASS: no negative-evidence/browser/capture path introduced')
          PY

      - name: Write integration qualification
        run: |
          cat > reports/data-qualification/historical_trading_breaks_recovery_batch07_integration_qualification.md <<EOF
          # HISTORICAL TRADING BREAKS RECOVERY — BATCH 07 ATOMIC INTEGRATION QUALIFICATION

          **PASS — \`BATCH07_ATOMIC_CALENDAR_ATTEMPT_PROGRESSION_INTEGRATION_COHERENT\`**

          Authoritative browser evidence: run \`34958083459\`, job \`104344855871\`, artifact \`10392510730\`, SHA-256 \`0df18b4bfcae04c0bf5e3670e789fc1253fde7317a50d108b35e10dd1cc2676a\`.

          Atomic state:
          - PASS calendar additions only: \`2023-12-22\`, \`2024-01-15\`, \`2024-02-19\`;
          - \`2023-12-25\` and \`2024-01-01\` remain unresolved and receive no negative evidence;
          - all five Batch 07 factual attempts are sequences \`31..35\`;
          - both BLOCKED dates are \`SAME_CAPABILITY_BLOCKED_ALREADY_ATTEMPTED\`;
          - global \`111 / 49 resolved / 62 unresolved\`;
          - execution window \`68 / 26 resolved / 42 unresolved\`;
          - ledger \`35\`; blocked-ineligible \`9\`; eligible unresolved \`33\`;
          - no material capability change.

          Integration run: \`${GITHUB_RUN_ID}\`.
          Pre-integration trigger SHA: \`${GITHUB_SHA}\`.
          EOF

      - name: Persist one atomic governed integration commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/dukascopy_usatech_calendar.py \
            reports/data-qualification/historical_trading_breaks_recovery_attempt_ledger.json \
            reports/data-qualification/historical_trading_breaks_recovery_progression_runtime.json \
            reports/data-qualification/historical_trading_breaks_recovery_batch07_integration_qualification.md \
            tests/test_trading_breaks_recovery_protocol.py \
            tests/test_trading_breaks_recovery_progression.py \
            tests/test_trading_breaks_recovery_batch02.py \
            tests/test_trading_breaks_recovery_batch03_integration.py \
            tests/test_trading_breaks_recovery_batch04_integration.py \
            tests/test_trading_breaks_recovery_batch05.py \
            tests/test_trading_breaks_recovery_batch05_integration.py \
            tests/test_trading_breaks_recovery_batch06.py \
            tests/test_trading_breaks_recovery_batch06_integration.py \
            tests/test_trading_breaks_recovery_batch07.py \
            tests/test_dukascopy_usatech_calendar_2023_2024_batch07.py \
            tests/test_trading_breaks_recovery_batch07_integration.py
          git diff --cached --check
          git commit -m 'evidence: atomically integrate Trading Breaks Batch 07'
          echo "INTEGRATION_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feat/multi-year-dukascopy-acquisition
